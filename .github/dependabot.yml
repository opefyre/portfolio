# Keep dependencies and CI actions current. Updates are grouped into one PR
# per ecosystem per week; CI must pass before anything is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types track the runtime (Node 22 in CI and on the host).
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Held until eslint-config-next and typescript-eslint support them
      # (both crash the linter as of Sep 2026). Remove to re-enable.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
