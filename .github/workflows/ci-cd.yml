name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Daily rebuild so the Instagram strip picks up new posts (and the token stays fresh).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

jobs:
  # 1. Verification Job (Lint & Build)
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
        # Provide the service account key so the build can fetch data from Firestore
        FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        # Read-only Instagram token (seed); the refreshed one lives in Firestore.
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Restore recent Instagram thumbnails
        uses: actions/cache/restore@v6
        with:
          path: public/instagram
          key: portfolio-instagram-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: portfolio-instagram-

      - name: Lint Code
        run: npm run lint

      - name: Verify forecast and operations calculators
        run: node --import tsx --test components/notes/forecast-metrics.test.ts components/notes/paa-forecast-model.test.ts components/notes/paa-round-two-models.test.ts components/notes/paa-round-three-models.test.ts components/notes/operations-models.test.ts components/notes/abc-xyz-model.test.ts components/notes/fundamentals-models.test.ts components/notes/foundation-data.test.ts components/notes/supply-planning-models.test.ts components/notes/improvement-models.test.ts components/notes/systems-models.test.ts components/notes/practice-models.test.ts components/notes/measurement-models.test.ts components/notes/boundary-models.test.ts components/notes/decision-models.test.ts components/notes/performance-models.test.ts components/notes/method-models.test.ts components/notes/record-models.test.ts components/notes/planning-basics.test.ts components/notes/commitment-examples.test.ts components/notes/core-concepts.test.ts components/notes/distribution-plan.test.ts components/notes/final-fundamentals.test.ts components/notes/flow-balance.test.ts components/notes/inventory-review.test.ts components/notes/measurement-patterns.test.ts components/notes/patterns-estimates.test.ts components/notes/portfolio-trace.test.ts components/notes/route-risk-time.test.ts components/notes/working-records.test.ts

      - name: Verify rendering compatibility
        run: node --import tsx --test scripts/fiber-timer.test.mjs scripts/instagram-assets.test.ts components/lens/image-ready.test.ts lib/note-figure.test.ts

      - name: Verify Build
        # This runs 'next build' which does the static export.
        # It needs DB access to fetch content.
        run: npm run build

      - name: Verify search metadata
        run: npm run verify:seo

      - name: Verify article hero images
        run: npm run verify:heroes

      - name: Verify exported assets and styles
        run: node scripts/check-render-assets.mjs

      - name: Save recent Instagram thumbnails
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: public/instagram
          key: portfolio-instagram-${{ github.run_id }}-${{ github.run_attempt }}

      # Upload build artifacts to pass to the deploy job (saves rebuilding)
      - name: Upload Build Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: out-build
          path: out
          retention-days: 1

  # 2. Deployment Job (Only runs on push to main AND if verify passes)
  deploy:
    name: Deploy to Firebase
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: out-build
          path: out

      # The Firebase CLI from package-lock.json, not a fresh "latest" download
      # (a broken upstream release once failed a deploy).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_CLI_PREVIEWS: none
        run: |
          KEY="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$KEY"
          GOOGLE_APPLICATION_CREDENTIALS="$KEY" npx firebase deploy --only hosting --project abosh-portfolio --non-interactive
          rm -f "$KEY"
