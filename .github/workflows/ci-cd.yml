name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Daily rebuild so the Instagram strip picks up new posts (and the token stays fresh).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

jobs:
  # 1. Verification Job (Lint & Build)
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
        # Provide the service account key so the build can fetch data from Firestore
        FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        # Read-only Instagram token (seed); the refreshed one lives in Firestore.
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Verify Build
        # This runs 'next build' which does the static export.
        # It needs DB access to fetch content.
        run: npm run build

      # Upload build artifacts to pass to the deploy job (saves rebuilding)
      - name: Upload Build Artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: out-build
          path: out
          retention-days: 1

  # 2. Deployment Job (Only runs on push to main AND if verify passes)
  deploy:
    name: Deploy to Firebase
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: out-build
          path: out

      # The Firebase CLI from package-lock.json, not a fresh "latest" download
      # (a broken upstream release once failed a deploy).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_CLI_PREVIEWS: none
        run: |
          KEY="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$KEY"
          GOOGLE_APPLICATION_CREDENTIALS="$KEY" npx firebase deploy --only hosting --project abosh-portfolio --non-interactive
          rm -f "$KEY"
