<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="paa-order-network-title paa-order-network-desc"><title id="paa-order-network-title">One order, three connected flows</title><desc id="paa-order-network-desc">Fictional supplier, distributor and customer. Material, information, payment and returns are separate relationships.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">ONE ORDER / 100 PUMPS</text><rect x="24" y="100" width="200" height="100" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="130" font-size="19" fill="#101213" text-anchor="start">Supplier</text><text x="40" y="161" font-size="15" fill="#5a5d60" text-anchor="start">40 more required</text><rect x="280" y="100" width="200" height="100" rx="4" fill="none" stroke="#c7c2b8"/><text x="296" y="130" font-size="19" fill="#101213" text-anchor="start">Distributor</text><text x="296" y="161" font-size="15" fill="#5a5d60" text-anchor="start">60 usable in stock</text><rect x="536" y="100" width="200" height="100" rx="4" fill="none" stroke="#c7c2b8"/><text x="552" y="130" font-size="19" fill="#101213" text-anchor="start">Customer</text><text x="552" y="161" font-size="15" fill="#5a5d60" text-anchor="start">100 needed Friday</text><line x1="225" y1="145" x2="278" y2="145" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><line x1="481" y1="145" x2="534" y2="145" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="78" font-size="17" fill="#101213" text-anchor="start">Goods towards the customer</text><line x1="635" y1="248" x2="125" y2="248" stroke="#5a5d60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="24" y="278" font-size="17" fill="#101213" text-anchor="start">Requirements, availability and status in both directions</text><line x1="125" y1="229" x2="635" y2="229" stroke="#5a5d60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><line x1="635" y1="329" x2="125" y2="329" stroke="#b4532a" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="360" font-size="17" fill="#b4532a" text-anchor="start">Payment follows agreed terms; timing can differ from goods</text><line x1="635" y1="408" x2="380" y2="408" stroke="#5a5d60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="24" y="438" font-size="17" fill="#101213" text-anchor="start">Returns need an agreed route and disposition</text></svg>
