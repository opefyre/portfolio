<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="paa3-cdc-records-title paa3-cdc-records-desc"><title id="paa3-cdc-records-title">Snapshot, changes and reconciled reporting copy</title><desc id="paa3-cdc-records-desc">Fictional order table starts with quantities one hundred and fifty. Update first to eighty, delete second and insert forty gives one hundred twenty. Missing the delete leaves an extra fifty.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="23" fill="#252a2d" text-anchor="start" font-weight="500">Ignoring deletions leaves the deleted row behind</text><text x="24" y="96" font-size="21" fill="#252a2d" text-anchor="start" font-weight="500">09:00 snapshot</text><rect x="24" y="122" width="200" height="184" fill="#f5f2ea" stroke="#cec9bd"/><text x="38" y="169" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">1042: 100 units</text><text x="38" y="216" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">1043: 50 units</text><text x="38" y="263" font-size="20" fill="#3c6475" text-anchor="start" font-weight="500">Total: 150</text><text x="280" y="96" font-size="21" fill="#252a2d" text-anchor="start" font-weight="500">Changes 201–203</text><rect x="280" y="122" width="200" height="184" fill="#f5f2ea" stroke="#cec9bd"/><text x="294" y="169" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">1042 → 80</text><text x="294" y="216" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Delete 1043</text><text x="294" y="263" font-size="20" fill="#3c6475" text-anchor="start" font-weight="500">Insert 1044: 40</text><text x="536" y="96" font-size="21" fill="#252a2d" text-anchor="start" font-weight="500">After all changes</text><rect x="536" y="122" width="200" height="184" fill="#f5f2ea" stroke="#cec9bd"/><text x="550" y="169" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">1042: 80 units</text><text x="550" y="216" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">1044: 40 units</text><text x="550" y="263" font-size="20" fill="#3c6475" text-anchor="start" font-weight="500">Total: 120</text><line x1="233" y1="208" x2="270" y2="208" stroke="#252a2d" stroke-width="2"/><path d="M 263,203 L 270,208 L 263,213" fill="none" stroke="#252a2d" stroke-width="2"/><line x1="489" y1="208" x2="526" y2="208" stroke="#252a2d" stroke-width="2"/><path d="M 519,203 L 526,208 L 519,213" fill="none" stroke="#252a2d" stroke-width="2"/><text x="24" y="361" font-size="21" fill="#a94f35" text-anchor="start" font-weight="400">Miss the deletion and the report shows 170 instead of 120.</text><text x="24" y="402" font-size="19" fill="#62676a" text-anchor="start" font-weight="400">A row change still needs an agreed business interpretation.</text></g></svg>
