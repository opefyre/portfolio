<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="aici-explanation-limits-title aici-explanation-limits-desc"><title id="aici-explanation-limits-title">An explanation needs its own checks</title><desc id="aici-explanation-limits-desc">Explanation of a model output is separate from the causal effect of a process intervention.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">An explanation needs its own checks</text><text x="24.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">01</text><rect x="24.0" y="103" width="221.33333333333334" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Prediction</text><text x="39.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Identified model and</text><text x="39.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">input</text><line x1="248.33333333333334" y1="185" x2="265.33333333333337" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="269.33333333333337" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">02</text><rect x="269.33333333333337" y="103" width="221.33333333333334" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="284.33333333333337" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Explanation</text><text x="284.33333333333337" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Defined method and</text><text x="284.33333333333337" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">scope</text><line x1="493.66666666666674" y1="185" x2="510.66666666666674" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="514.6666666666667" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">03</text><rect x="514.6666666666667" y="103" width="221.33333333333334" height="166" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="529.6666666666667" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">User check</text><text x="529.6666666666667" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Relevant evidence and</text><text x="529.6666666666667" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">limits</text><text x="24" y="324" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">A causal process claim still needs evidence about what happens when the</text><text x="24" y="348" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">process changes.</text></g></svg>