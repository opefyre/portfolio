<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 605" role="img" aria-labelledby="aici-attribute-agreement-title aici-attribute-agreement-desc"><title id="aici-attribute-agreement-title">Repeating a rating is not the same as matching its reference</title><desc id="aici-attribute-agreement-desc">Minitab fabric example: self-agreement 100, 96, 86, 90 percent; reference agreement 94, 92, 82, 90 percent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Repeating a rating is not the same as matching its reference</text><text x="24" y="80" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Observed matches / 50 samples per assessor</text><text x="24" y="140" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Amanda</text><rect x="145" y="110" width="465.00000000000006" height="21" rx="3" fill="#252a2d" stroke="#252a2d" stroke-width="1.2"/><text x="619.0" y="127" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">100%</text><rect x="145" y="139" width="437.1" height="21" rx="3" fill="#a35334" stroke="#a35334" stroke-width="1.2"/><text x="591.1" y="156" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">94%</text><text x="24" y="224" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Britt</text><rect x="145" y="194" width="446.40000000000003" height="21" rx="3" fill="#252a2d" stroke="#252a2d" stroke-width="1.2"/><text x="600.4000000000001" y="211" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">96%</text><rect x="145" y="223" width="427.8" height="21" rx="3" fill="#a35334" stroke="#a35334" stroke-width="1.2"/><text x="581.8" y="240" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">92%</text><text x="24" y="308" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Eric</text><rect x="145" y="278" width="399.90000000000003" height="21" rx="3" fill="#252a2d" stroke="#252a2d" stroke-width="1.2"/><text x="553.9000000000001" y="295" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">86%</text><rect x="145" y="307" width="381.3" height="21" rx="3" fill="#a35334" stroke="#a35334" stroke-width="1.2"/><text x="535.3" y="324" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">82%</text><text x="24" y="392" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Mike</text><rect x="145" y="362" width="418.50000000000006" height="21" rx="3" fill="#252a2d" stroke="#252a2d" stroke-width="1.2"/><text x="572.5" y="379" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">90%</text><rect x="145" y="391" width="418.50000000000006" height="21" rx="3" fill="#a35334" stroke="#a35334" stroke-width="1.2"/><text x="572.5" y="408" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">90%</text><rect x="24" y="478" width="15" height="15" rx="3" fill="#252a2d" stroke="#252a2d" stroke-width="1.2"/><text x="48" y="491" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Self agreement</text><rect x="272" y="478" width="15" height="15" rx="3" fill="#a35334" stroke="#a35334" stroke-width="1.2"/><text x="296" y="491" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Reference agreement</text><text x="24" y="535" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Matching across repeats and matching the reference are different</text><text x="24" y="559" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">conditions.</text></g></svg>