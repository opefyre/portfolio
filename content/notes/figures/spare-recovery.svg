<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Review the recovery route before ordering</title><desc id="desc">Identify the equipment consequence, available recovery and replenishment time, then choose a supply arrangement.</desc><rect width="760" height="340" fill="#eeebe4"/><g font-family="Funnel Sans,Arial,sans-serif" fill="#24282b"><text x="25" y="35" font-size="24">A spare starts with the equipment it restores</text><rect x="25" y="65" width="345" height="92" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="43" y="98" font-size="20">Equipment consequence</text><text x="43" y="127" font-size="15">What stops or becomes unsafe?</text><rect x="390" y="65" width="345" height="92" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="408" y="98" font-size="20">Recovery route</text><text x="408" y="127" font-size="15">Standby, approved substitute or repair?</text><text x="25" y="197" font-size="20">Compare the tolerated interruption with replacement time</text><rect x="25" y="224" width="710" height="80" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="43" y="257" font-size="20">Choose and verify the supply arrangement</text><text x="43" y="286" font-size="15">Local stock, shared stock, supplier holding or a repairable pool</text></g></svg>