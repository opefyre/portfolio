<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-npi-readiness-title gap-npi-readiness-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-npi-readiness-title">Connect readiness to the first lot</title><desc id="gap-npi-readiness-desc">The product definition enables approved packaging and materials. Those and production preparation support a representative trial, followed by the required release decision.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Connect readiness to the first lot</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><rect x="20" y="107" width="220" height="95" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="130.0" y="136" font-size="20" fill="#24282b" text-anchor="middle">Approved definition</text><text x="130.0" y="164" font-size="17" fill="#62676a" text-anchor="middle">Specification and BOM</text><rect x="20" y="246" width="220" height="95" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="130.0" y="275" font-size="20" fill="#24282b" text-anchor="middle">Production preparation</text><text x="130.0" y="303" font-size="17" fill="#62676a" text-anchor="middle">Method, people, capacity</text><rect x="280" y="107" width="220" height="95" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="390.0" y="136" font-size="20" fill="#24282b" text-anchor="middle">Packaging and material</text><text x="390.0" y="164" font-size="17" fill="#62676a" text-anchor="middle">Artwork, source, released lot</text><rect x="280" y="246" width="220" height="95" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="390.0" y="275" font-size="20" fill="#24282b" text-anchor="middle">Representative trial</text><text x="390.0" y="303" font-size="17" fill="#62676a" text-anchor="middle">Required checks and results</text><rect x="540" y="176" width="200" height="95" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="640.0" y="205" font-size="20" fill="#24282b" text-anchor="middle">Saleable lot</text><text x="640.0" y="233" font-size="17" fill="#62676a" text-anchor="middle">Release decision</text><text x="640.0" y="257" font-size="17" fill="#62676a" text-anchor="middle">First 5,000 units</text><path d="M240 150 H280" fill="none" stroke="#a35736" stroke-width="2"/><path d="M390 202 V246" fill="none" stroke="#a35736" stroke-width="2"/><path d="M240 291 H280" fill="none" stroke="#a35736" stroke-width="2"/><path d="M500 291 H520 V224 H540" fill="none" stroke="#a35736" stroke-width="2"/><text x="20" y="414" font-size="20" fill="#62676a" text-anchor="start">A booked line slot does not replace the evidence needed to release it.</text></svg>
