<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-sourcing-gates-title gap-sourcing-gates-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-sourcing-gates-title">Qualification comes before ranking</title><desc id="gap-sourcing-gates-desc">The mandatory condition removes supplier A from this award. B and C continue to the weighted comparison.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Qualification comes before ranking</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><rect x="25" y="92" width="450" height="72" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="43" y="121" font-size="23" fill="#24282b" text-anchor="start">Define the requirement</text><text x="43" y="147" font-size="17" fill="#62676a" text-anchor="start">Same drawing, quantities and delivery basis</text><rect x="25" y="190" width="450" height="72" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="43" y="219" font-size="23" fill="#24282b" text-anchor="start">Qualify the supplier</text><text x="43" y="245" font-size="17" fill="#62676a" text-anchor="start">Required tests, capability and capacity</text><rect x="25" y="312" width="450" height="72" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="43" y="341" font-size="23" fill="#24282b" text-anchor="start">Compare eligible offers</text><text x="43" y="367" font-size="17" fill="#62676a" text-anchor="start">Whole cost and agreed weighted criteria</text><line x1="250" y1="164" x2="250" y2="190" stroke="#a35736" stroke-width="2"/><line x1="250" y1="262" x2="250" y2="312" stroke="#a35736" stroke-width="2"/><line x1="475" y1="226" x2="570" y2="226" stroke="#a35736" stroke-width="2"/><circle cx="570" cy="226" r="6" fill="#a35736"/><text x="590" y="218" font-size="20" fill="#a35736" text-anchor="start">A: not eligible</text><text x="590" y="246" font-size="18" fill="#62676a" text-anchor="start">Test failed</text><text x="25" y="419" font-size="20" fill="#24282b" text-anchor="start">B and C pass the gate. Their scores can now be compared.</text></svg>
