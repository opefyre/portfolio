<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" role="img" aria-labelledby="aici-soft-sensor-path-title aici-soft-sensor-path-desc"><title id="aici-soft-sensor-path-title">A virtual measurement still needs a check</title><desc id="aici-soft-sensor-path-desc">Measured inputs feed a model. A separate reference supports validation of its estimate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">A virtual measurement still needs a check</text><rect x="24" y="110" width="200" height="150" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39" y="139" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Measured inputs</text><text x="39" y="186" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Units, time and</text><text x="39" y="210" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">validity</text><rect x="278" y="110" width="200" height="150" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="293" y="139" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Model estimate</text><text x="293" y="186" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Version and</text><text x="293" y="210" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">operating range</text><rect x="532" y="110" width="204" height="150" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="547" y="139" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Operating use</text><text x="547" y="186" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Permission and</text><text x="547" y="210" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">fallback</text><line x1="226" y1="184" x2="272" y2="184" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="480" y1="184" x2="526" y2="184" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="278" y="320" width="200" height="105" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="293" y="349" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Reference check</text><line x1="378" y1="315" x2="378" y2="266" stroke="#a35334" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="24" y="370" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Compare with an</text><text x="24" y="394" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">independent reference;</text><text x="24" y="418" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">retain the timing and</text><text x="24" y="442" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">uncertainty.</text></g></svg>