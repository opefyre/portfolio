<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" role="img" aria-labelledby="bias-offsets-title bias-offsets-desc">
  <title id="bias-offsets-title">Zero bias hides alternating weekly misses</title>
  <desc id="bias-offsets-desc">Fictional signed errors using forecast minus actual. Forecast A: minus 20, plus 20, minus 20, plus 20 units. Forecast B: minus 10 in all four weeks. A has zero bias and 20 percent WAPE. B has minus 10 percent bias and 10 percent WAPE.</desc>
  <style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.display{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.muted{fill:#5a5d60}.rust{fill:#b4532a}</style>
  <text x="12" y="30" class="display" font-size="25">Right total. Wrong every week.</text>
  <text x="12" y="59" class="muted" font-size="17">Signed error in units · forecast minus actual</text>
  <rect x="12" y="79" width="12" height="12" fill="#0f1011"/><text x="32" y="90" font-size="16">A</text><rect x="82" y="79" width="12" height="12" fill="#b4532a"/><text x="102" y="90" font-size="16">B</text>
  <text x="188" y="121" text-anchor="middle" class="muted" font-size="16">Underforecast</text><text x="432" y="121" text-anchor="middle" class="muted" font-size="16">Overforecast</text>
  <line x1="310" y1="135" x2="310" y2="368" stroke="#0f1011" stroke-width="1"/>
  <line x1="150" y1="135" x2="150" y2="368" stroke="#d6d3cb"/><line x1="470" y1="135" x2="470" y2="368" stroke="#d6d3cb"/>
  <text x="12" y="162" class="display" font-size="19">Week 1</text><rect x="150" y="144" width="160" height="16" fill="#0f1011"/><text x="142" y="158" text-anchor="end" font-size="16">−20</text><rect x="230" y="165" width="80" height="12" fill="#b4532a"/><text x="222" y="177" text-anchor="end" class="rust" font-size="16">−10</text>
  <text x="12" y="220" class="display" font-size="19">Week 2</text><rect x="310" y="202" width="160" height="16" fill="#0f1011"/><text x="478" y="216" font-size="16">+20</text><rect x="230" y="223" width="80" height="12" fill="#b4532a"/><text x="222" y="235" text-anchor="end" class="rust" font-size="16">−10</text>
  <text x="12" y="278" class="display" font-size="19">Week 3</text><rect x="150" y="260" width="160" height="16" fill="#0f1011"/><text x="142" y="274" text-anchor="end" font-size="16">−20</text><rect x="230" y="281" width="80" height="12" fill="#b4532a"/><text x="222" y="293" text-anchor="end" class="rust" font-size="16">−10</text>
  <text x="12" y="336" class="display" font-size="19">Week 4</text><rect x="310" y="318" width="160" height="16" fill="#0f1011"/><text x="478" y="332" font-size="16">+20</text><rect x="230" y="339" width="80" height="12" fill="#b4532a"/><text x="222" y="351" text-anchor="end" class="rust" font-size="16">−10</text>
  <text x="150" y="390" text-anchor="middle" class="muted" font-size="16">−20</text><text x="310" y="390" text-anchor="middle" class="muted" font-size="16">0</text><text x="470" y="390" text-anchor="middle" class="muted" font-size="16">+20</text>
  <line x1="12" y1="408" x2="548" y2="408" stroke="#d6d3cb"/>
  <text x="12" y="438" class="display" font-size="21">A: bias 0%</text><text x="548" y="438" text-anchor="end" class="display rust" font-size="21">B: bias −10%</text>
  <text x="12" y="470" font-size="19">WAPE 20% · 80 units missed</text><text x="548" y="470" text-anchor="end" class="rust" font-size="19">WAPE 10% · 40 units missed</text>
</svg>
