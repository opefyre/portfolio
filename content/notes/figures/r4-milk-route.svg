<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="r4-milk-route-title r4-milk-route-desc"><title id="r4-milk-route-title">Signal and replacement on a repeated route</title><desc id="r4-milk-route-desc">In the existing Kanban case, assembly withdraws twenty from a sixty-bracket shelf. A card goes from the shelf to the supplying process; one replacement box of twenty returns. A route can connect collection and return, but no travel time or route frequency is known.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="26" fill="#272b2d" font-weight="500">Transport closes the replenishment loop</text><text x="24" y="68" font-size="18" fill="#63676a" font-weight="400">Existing three-card example: 20 brackets per box</text><rect x="24" y="135" width="260" height="115" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="24" y="135" width="4" height="115" rx="0" fill="#4e6879"/><text x="40" y="164" font-size="19" fill="#4e6879" font-weight="500">Supplying process</text><text x="40" y="193" font-size="16" fill="#272b2d" font-weight="400">Receives the card</text><text x="40" y="217" font-size="16" fill="#272b2d" font-weight="400">Makes one authorised box</text><rect x="434" y="135" width="302" height="115" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="434" y="135" width="4" height="115" rx="0" fill="#4e6879"/><text x="450" y="164" font-size="19" fill="#4e6879" font-weight="500">Supermarket shelf</text><text x="450" y="193" font-size="16" fill="#272b2d" font-weight="400">60 → 40 after withdrawal</text><text x="450" y="217" font-size="16" fill="#272b2d" font-weight="400">Back to 60 after replacement</text><line x1="434" y1="115" x2="284" y2="115" stroke="#a94f35" stroke-width="2" stroke-dasharray="5 5"/><path d="M 292.86994922779286 119.61779175541483 L 284 115 L 292.86994922779286 110.38220824458517" fill="none" stroke="#a94f35" stroke-width="2"/><text x="300" y="100" font-size="17" fill="#a94f35" font-weight="400">Card to supply</text><line x1="284" y1="285" x2="434" y2="285" stroke="#4e6879" stroke-width="2"/><path d="M 425.13005077220714 280.3822082445852 L 434 285 L 425.13005077220714 289.6177917554148" fill="none" stroke="#4e6879" stroke-width="2"/><text x="300" y="313" font-size="17" fill="#4e6879" font-weight="400">Return 20</text><rect x="434" y="355" width="302" height="88" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="434" y="355" width="4" height="88" rx="0" fill="#272b2d"/><text x="450" y="384" font-size="19" fill="#272b2d" font-weight="500">Assembly</text><text x="450" y="413" font-size="16" fill="#272b2d" font-weight="400">Withdraws one 20-bracket box</text><line x1="585" y1="257" x2="585" y2="348" stroke="#272b2d" stroke-width="2"/><path d="M 589.6177917554148 339.13005077220714 L 585 348 L 580.3822082445852 339.13005077220714" fill="none" stroke="#272b2d" stroke-width="2"/><text x="24" y="402" font-size="18" fill="#63676a" font-weight="400">Route timing is not supplied.</text><text x="24" y="429" font-size="17" fill="#63676a" font-weight="400">No frequency or buffer is calculated.</text></g></svg>
