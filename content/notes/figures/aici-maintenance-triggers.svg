<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-labelledby="aici-maintenance-triggers-title aici-maintenance-triggers-desc"><title id="aici-maintenance-triggers-title">Three different triggers for maintenance</title><desc id="aici-maintenance-triggers-desc">Calendar, measured condition and prediction trigger different checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Three different triggers for maintenance</text><text x="24" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Trigger</text><text x="276" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Work decision</text><text x="522" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Evidence to retain</text><line x1="24" y1="103" x2="736" y2="103" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Date or usage interval</text><text x="276" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Scheduled maintenance</text><text x="522" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Required task and</text><text x="522" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">record</text><line x1="24" y1="194" x2="736" y2="194" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Measured condition</text><text x="276" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Condition-based</text><text x="276" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">response</text><text x="522" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Criterion and finding</text><line x1="24" y1="285" x2="736" y2="285" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Forecast future</text><text x="24" y="339" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">condition</text><text x="276" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Predictive decision</text><text x="522" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Warning time and</text><text x="522" y="339" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">outcome</text></g></svg>