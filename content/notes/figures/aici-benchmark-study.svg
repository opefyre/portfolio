<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="aici-benchmark-study-title aici-benchmark-study-desc"><title id="aici-benchmark-study-title">Study the work behind the reference number</title><desc id="aici-benchmark-study-desc">ASQ reports review of twenty-four websites, twelve telephone surveys and four site visits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Study the work behind the reference number</text><text x="24" y="147" font-size="66" fill="#252a2d" text-anchor="start" font-weight="500">24</text><text x="24" y="198" font-size="23" fill="#252a2d" text-anchor="start" font-weight="400">Websites</text><text x="24" y="247" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Initial review</text><line x1="24" y1="295" x2="239" y2="295" stroke="#3c6475" stroke-width="1.5"/><text x="269" y="147" font-size="66" fill="#252a2d" text-anchor="start" font-weight="500">12</text><text x="269" y="198" font-size="23" fill="#252a2d" text-anchor="start" font-weight="400">Telephone surveys</text><text x="269" y="247" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Follow-up research</text><line x1="269" y1="295" x2="484" y2="295" stroke="#3c6475" stroke-width="1.5"/><text x="514" y="147" font-size="66" fill="#252a2d" text-anchor="start" font-weight="500">4</text><text x="514" y="198" font-size="23" fill="#252a2d" text-anchor="start" font-weight="400">Site visits</text><text x="514" y="247" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Closer process study</text><line x1="514" y1="295" x2="729" y2="295" stroke="#3c6475" stroke-width="1.5"/><text x="24" y="365" font-size="19" fill="#62676a" text-anchor="start" font-weight="400">Published Carleton University account. Counts describe the study coverage;</text><text x="24" y="389" font-size="19" fill="#62676a" text-anchor="start" font-weight="400">they do not measure an improvement or a conversion rate.</text></g></svg>