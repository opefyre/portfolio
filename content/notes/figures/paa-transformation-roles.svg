<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="paa-transformation-roles-title paa-transformation-roles-desc"><title id="paa-transformation-roles-title">Coordination alongside explicit operating and technical authority</title><desc id="paa-transformation-roles-desc">Fictional role allocation. Dashed links show coordination and do not represent a universal reporting hierarchy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">SUPPLIER SERVICE / DISTINCT DECISION RIGHTS</text><rect x="245" y="70" width="270" height="90" rx="4" fill="none" stroke="#c7c2b8"/><text x="261" y="100" font-size="19" fill="#101213" text-anchor="start">Sponsor</text><text x="261" y="131" font-size="15" fill="#5a5d60" text-anchor="start">Outcome, funding, trade-offs</text><line x1="380" y1="162" x2="380" y2="202" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="205" width="270" height="90" rx="4" fill="#e1d9cc" stroke="#c7c2b8"/><text x="261" y="235" font-size="19" fill="#101213" text-anchor="start">Transformation lead</text><text x="261" y="266" font-size="15" fill="#5a5d60" text-anchor="start">Coordinate work and decisions</text><rect x="24" y="335" width="220" height="105" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="365" font-size="19" fill="#101213" text-anchor="start">Finance owner</text><text x="40" y="396" font-size="15" fill="#5a5d60" text-anchor="start">Status definition</text><text x="40" y="418" font-size="15" fill="#5a5d60" text-anchor="start">Continuing service</text><rect x="270" y="335" width="220" height="105" rx="4" fill="none" stroke="#c7c2b8"/><text x="286" y="365" font-size="19" fill="#101213" text-anchor="start">IT owner</text><text x="286" y="396" font-size="15" fill="#5a5d60" text-anchor="start">Integration and access</text><text x="286" y="418" font-size="15" fill="#5a5d60" text-anchor="start">Technical support</text><rect x="516" y="335" width="220" height="105" rx="4" fill="none" stroke="#c7c2b8"/><text x="532" y="365" font-size="19" fill="#101213" text-anchor="start">Team managers</text><text x="532" y="396" font-size="15" fill="#5a5d60" text-anchor="start">People and cover</text><text x="532" y="418" font-size="15" fill="#5a5d60" text-anchor="start">Changed working method</text><line x1="380" y1="298" x2="134" y2="333" stroke="#5a5d60" stroke-width="2" stroke-dasharray="6 5"/><line x1="380" y1="298" x2="380" y2="333" stroke="#5a5d60" stroke-width="2" stroke-dasharray="6 5"/><line x1="380" y1="298" x2="626" y2="333" stroke="#5a5d60" stroke-width="2" stroke-dasharray="6 5"/><text x="24" y="487" font-size="19" fill="#b4532a" text-anchor="start">Coordination does not automatically transfer approval authority.</text></svg>
