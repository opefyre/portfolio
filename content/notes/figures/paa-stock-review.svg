<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="paa-stock-review-title paa-stock-review-desc"><title id="paa-stock-review-title">From stock-record correction to a replenishment review</title><desc id="paa-stock-review-desc">Fictional record correction and assumed constant-use coverage. Five-day review plus four-day usable receipt delay is the periodic review exposure, not a target stock quantity.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">PART A / CORRECT THE INPUT BEFORE CHANGING THE RULE</text><rect x="24" y="80" width="210" height="120" rx="4" fill="#e1d9cc" stroke="#c7c2b8"/><text x="40" y="110" font-size="19" fill="#101213" text-anchor="start">Record: 30</text><text x="40" y="141" font-size="15" fill="#5a5d60" text-anchor="start">Count: 18 usable</text><text x="40" y="163" font-size="15" fill="#5a5d60" text-anchor="start">12-unit issue unposted</text><line x1="237" y1="139" x2="268" y2="139" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="272" y="80" width="218" height="120" rx="4" fill="none" stroke="#c7c2b8"/><text x="288" y="110" font-size="19" fill="#101213" text-anchor="start">Reconcile</text><text x="288" y="141" font-size="15" fill="#5a5d60" text-anchor="start">Correct transaction</text><text x="288" y="163" font-size="15" fill="#5a5d60" text-anchor="start">Check recurrence</text><line x1="492" y1="139" x2="523" y2="139" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="526" y="80" width="210" height="120" rx="4" fill="none" stroke="#c7c2b8"/><text x="542" y="110" font-size="19" fill="#101213" text-anchor="start">Plan from 18</text><text x="542" y="141" font-size="15" fill="#5a5d60" text-anchor="start">10 units/day assumed</text><text x="542" y="163" font-size="15" fill="#5a5d60" text-anchor="start">1.8 days at that rate</text><line x1="24" y1="244" x2="736" y2="244" stroke="#c7c2b8" stroke-width="2"/><text x="24" y="280" font-size="22" fill="#101213" text-anchor="start">Then review the replenishment exposure</text><text x="24" y="319" font-size="18" fill="#101213" text-anchor="start">Review interval: 5 working days</text><text x="24" y="353" font-size="18" fill="#101213" text-anchor="start">Supplier + receiving: 3 + 1 = 4 working days</text><text x="24" y="398" font-size="17" fill="#b4532a" text-anchor="start">A future policy change cannot resolve today's shortage by itself.</text></svg>
