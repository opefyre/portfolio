<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" role="img" aria-labelledby="paa3-governance-route-title paa3-governance-route-desc"><title id="paa3-governance-route-title">Project funding escalation</title><desc id="paa3-governance-route-desc">Fictional manager cannot approve an increase above the approved budget. Sponsor considers twelve thousand euros within an example twenty-thousand-euro increase delegation. The recorded approval must reach the delivery plan.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#252a2d" text-anchor="start" font-weight="500">Who can authorise the additional €12,000?</text><rect x="24" y="78" width="712" height="88" fill="#f5f2ea" stroke="#cec9bd"/><text x="44" y="111" font-size="23" fill="#252a2d" text-anchor="start" font-weight="500">Manager identifies the change</text><text x="44" y="143" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">€80,000 approved / €92,000 now forecast</text><line x1="380" y1="166" x2="380" y2="187" stroke="#252a2d" stroke-width="2"/><rect x="24" y="188" width="712" height="88" fill="#f5f2ea" stroke="#cec9bd"/><text x="44" y="221" font-size="23" fill="#a94f35" text-anchor="start" font-weight="500">Sponsor reviews and decides</text><text x="44" y="253" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Within the stated €20,000 increase delegation</text><line x1="380" y1="276" x2="380" y2="297" stroke="#252a2d" stroke-width="2"/><rect x="24" y="298" width="712" height="88" fill="#f5f2ea" stroke="#cec9bd"/><text x="44" y="331" font-size="23" fill="#3c6475" text-anchor="start" font-weight="500">Team implements the recorded decision</text><text x="44" y="363" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Approved budget, purchase authority and plan agree</text><text x="24" y="427" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">A report requests a decision; it does not grant authority.</text></g></svg>
