<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" role="img" aria-label="Absolute errors for forecasts A and B: high-volume product 100 versus 10 parts, medium 10 versus 5, low 1 versus 5. Totals 111 versus 20. Fictional example."><style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.plot-number{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.plot-muted{fill:#5a5d60}.plot-rust{fill:#b4532a}</style><text x="12" y="30" font-size="25" class="plot-number">Fewer units missed. One product worse.</text><line x1="12" y1="50" x2="548" y2="50" stroke="#d6d3cb" stroke-width="1"/><text x="12" y="85" font-size="19" class="plot-muted">Absolute error in individual parts</text><rect x="330" y="69" width="16" height="16" fill="#0f1011"/><text x="354" y="84" font-size="18" >A</text><rect x="408" y="69" width="16" height="16" fill="#b4532a"/><text x="432" y="84" font-size="18" >B</text><text x="12" y="126" font-size="22" class="plot-number">High volume</text><text x="548" y="126" font-size="19" text-anchor="end" class="plot-muted">B: 1% error</text><rect x="12" y="141" width="420" height="18" fill="#0f1011"/><text x="442" y="156" font-size="19" >100</text><rect x="12" y="170" width="42" height="18" fill="#b4532a"/><text x="64" y="185" font-size="19" class="plot-rust">10</text><text x="12" y="244" font-size="22" class="plot-number">Medium volume</text><text x="548" y="244" font-size="19" text-anchor="end" class="plot-muted">B: 5% error</text><rect x="12" y="259" width="42" height="18" fill="#0f1011"/><text x="64" y="274" font-size="19" >10</text><rect x="12" y="288" width="21" height="18" fill="#b4532a"/><text x="43" y="303" font-size="19" class="plot-rust">5</text><text x="12" y="362" font-size="22" class="plot-number">Low volume</text><text x="548" y="362" font-size="19" text-anchor="end" class="plot-muted">B: 50% error</text><rect x="12" y="377" width="4.2" height="18" fill="#0f1011"/><text x="26.2" y="392" font-size="19" >1</text><rect x="12" y="406" width="21" height="18" fill="#b4532a"/><text x="43" y="421" font-size="19" class="plot-rust">5</text><line x1="12" y1="451" x2="548" y2="451" stroke="#d6d3cb" stroke-width="1"/><text x="12" y="484" font-size="22" class="plot-number">A: 111 parts missed</text><text x="548" y="484" font-size="22" text-anchor="end" class="plot-number plot-rust">B: 20 parts missed</text></svg>