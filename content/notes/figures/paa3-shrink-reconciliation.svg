<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" aria-labelledby="paa3-shrink-reconciliation-title paa3-shrink-reconciliation-desc"><title id="paa3-shrink-reconciliation-title">From a twenty-unit difference to twelve unresolved missing units</title><desc id="paa3-shrink-reconciliation-desc">Fictional record 500, corrected record 492 after removing an eight-unit duplicate receipt, physical count 480. Twelve units valued at 240 euros remain missing. Cause is not established.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#252a2d" text-anchor="start" font-weight="500">Reconcile the difference before assigning a cause</text><rect x="24" y="76" width="200" height="174" fill="#f5f2ea" stroke="#cec9bd"/><text x="40" y="108" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Recorded units</text><text x="40" y="167" font-size="44" fill="#252a2d" text-anchor="start" font-weight="400">500</text><text x="40" y="216" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">€10,000</text><rect x="280" y="76" width="200" height="174" fill="#f5f2ea" stroke="#cec9bd"/><text x="296" y="108" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">After receipt correction</text><text x="296" y="167" font-size="44" fill="#252a2d" text-anchor="start" font-weight="400">492</text><text x="296" y="216" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">€9,840</text><rect x="536" y="76" width="200" height="174" fill="#f5f2ea" stroke="#cec9bd"/><text x="552" y="108" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Physical count</text><text x="552" y="167" font-size="44" fill="#252a2d" text-anchor="start" font-weight="400">480</text><text x="552" y="216" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">€9,600</text><line x1="230" y1="160" x2="270" y2="160" stroke="#252a2d" stroke-width="2"/><path d="M 263,155 L 270,160 L 263,165" fill="none" stroke="#252a2d" stroke-width="2"/><line x1="486" y1="160" x2="526" y2="160" stroke="#252a2d" stroke-width="2"/><path d="M 519,155 L 526,160 L 519,165" fill="none" stroke="#252a2d" stroke-width="2"/><text x="24" y="292" font-size="20" fill="#3c6475" text-anchor="start" font-weight="400">8 units explained by a duplicate receipt</text><text x="24" y="328" font-size="22" fill="#a94f35" text-anchor="start" font-weight="500">12 units / €240 still require loss investigation</text></g></svg>
