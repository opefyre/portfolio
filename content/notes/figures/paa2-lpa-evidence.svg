<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" role="img" aria-labelledby="paa2-lpa-evidence-title paa2-lpa-evidence-desc"><title id="paa2-lpa-evidence-title">Audit finds a revision mismatch</title><desc id="paa2-lpa-evidence-desc">Required revision6, mounted roll revision5. Contain affected work, investigate, correct and verify effectiveness.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Check the current instruction against the work</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional layered process audit at a labelling station</text><rect x="24" y="101" width="348" height="109" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="42" y="134" font-size="19" fill="#272b2d" font-weight="400">Approved reference</text><text x="42" y="181" font-size="29" fill="#3c6475" font-weight="500">Revision 6</text><rect x="388" y="101" width="348" height="109" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="406" y="134" font-size="19" fill="#272b2d" font-weight="400">Roll on the station</text><text x="406" y="181" font-size="29" fill="#a94f35" font-weight="500">Revision 5</text><text x="24" y="252" font-size="20" fill="#a94f35" font-weight="400">Mismatch: hold the affected work and assess the material.</text><rect x="24" y="290" width="166" height="58" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="36" y="326" font-size="20" fill="#272b2d" font-weight="400">Contain</text><rect x="206" y="290" width="166" height="58" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="218" y="326" font-size="20" fill="#272b2d" font-weight="400">Investigate</text><rect x="388" y="290" width="166" height="58" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="400" y="326" font-size="20" fill="#272b2d" font-weight="400">Correct</text><rect x="570" y="290" width="166" height="58" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="582" y="326" font-size="20" fill="#272b2d" font-weight="400">Verify</text><text x="24" y="392" font-size="18" fill="#63676a" font-weight="400">Repeated checks do not replace evidence that the fix worked.</text></g></svg>
