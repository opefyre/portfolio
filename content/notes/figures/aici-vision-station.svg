<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="aici-vision-station-title aici-vision-station-desc"><title id="aici-vision-station-title">Inspect the complete station</title><desc id="aici-vision-station-desc">Five linked functions: presentation, illumination, capture, analysis and physical response.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Inspect the complete station</text><text x="24" y="105" font-size="16" fill="#a35334" text-anchor="start" font-weight="400">01</text><rect x="24" y="122" width="132" height="154" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39" y="151" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Present</text><text x="39" y="198" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Correct item</text><line x1="158" y1="201" x2="166" y2="201" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="169" y="105" font-size="16" fill="#a35334" text-anchor="start" font-weight="400">02</text><rect x="169" y="122" width="132" height="154" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="184" y="151" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Illuminate</text><text x="184" y="198" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Usable image</text><line x1="303" y1="201" x2="311" y2="201" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="314" y="105" font-size="16" fill="#a35334" text-anchor="start" font-weight="400">03</text><rect x="314" y="122" width="132" height="154" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="329" y="151" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Capture</text><text x="329" y="198" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Trigger and</text><text x="329" y="222" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">ID</text><line x1="448" y1="201" x2="456" y2="201" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="459" y="105" font-size="16" fill="#a35334" text-anchor="start" font-weight="400">04</text><rect x="459" y="122" width="132" height="154" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="474" y="151" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Analyse</text><text x="474" y="198" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Defined</text><text x="474" y="222" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">output</text><line x1="593" y1="201" x2="601" y2="201" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="604" y="105" font-size="16" fill="#a35334" text-anchor="start" font-weight="400">05</text><rect x="604" y="122" width="132" height="154" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="619" y="151" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Respond</text><text x="619" y="198" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Correct part</text><line x1="24" y1="310" x2="736" y2="310" stroke="#3c6475" stroke-width="1.5"/><text x="24" y="346" font-size="19" fill="#3c6475" text-anchor="start" font-weight="400">Machine-vision system boundary</text><text x="24" y="385" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">The image-analysis method is one part of the accepted inspection</text><text x="24" y="409" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">station.</text></g></svg>