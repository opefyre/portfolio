<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 621" role="img" aria-label="Fictional sensitivity on the same working-minute scale. Current: 4,840 minutes. Faster preparation: 4,830. Shorter final wait: 2,920. Reductions of about 0.21% and 39.67% respectively. The queue change has not been demonstrated."><style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.num{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.muted{fill:#5a5d60}.rust{fill:#b4532a}</style><text x="12" y="32" font-size="28" class="num">Which time changes?</text><text x="12" y="67" font-size="20" class="muted">Total working minutes on the same scale</text><line x1="12" y1="91" x2="548" y2="91" stroke="#d6d3cb"/><text x="12" y="137" font-size="23" class="num">Current state</text><text x="468" y="137" font-size="22" class="">4,840</text><rect x="12" y="152" width="536" height="22" fill="#0f1011"/><text x="12" y="204" font-size="20" class="muted">10 waiting days + 40 min work</text><text x="12" y="263" font-size="23" class="num">Faster preparation only</text><text x="468" y="263" font-size="22" class="">4,830</text><rect x="12" y="278" width="534.8925619834711" height="22" fill="#0f1011"/><text x="12" y="330" font-size="20" class="muted">10 waiting days + 30 min work</text><text x="12" y="389" font-size="23" class="num">Shorter final wait only</text><text x="468" y="389" font-size="22" class="rust">2,920</text><rect x="12" y="404" width="323.3719008264463" height="22" fill="#b4532a"/><text x="12" y="456" font-size="20" class="muted">6 waiting days + 40 min work</text><line x1="12" y1="480" x2="548" y2="480" stroke="#d6d3cb"/><text x="12" y="517" font-size="20" class="">Processing change: about 0.21% less total time</text><text x="12" y="552" font-size="20" class="rust">Queue change: about 39.67% less total time</text><text x="12" y="594" font-size="19" class="muted">Separate assumptions, not demonstrated outcomes.</text></svg>