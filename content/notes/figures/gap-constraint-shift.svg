<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 485" role="img" aria-labelledby="gap-constraint-shift-title gap-constraint-shift-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-constraint-shift-title">Follow the constraint after the change</title><desc id="gap-constraint-shift-desc">Starting capacities are 120, 80 and 100 units per hour. Raising testing to 105 moves the limit to packing at 100.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Follow the constraint after the change</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><text x="24" y="102" font-size="22" fill="#24282b" text-anchor="start">Starting line</text><rect x="35" y="120" width="145" height="75" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="107" y="150" font-size="22" fill="#24282b" text-anchor="middle">Cut</text><text x="107" y="179" font-size="21" fill="#24282b" text-anchor="middle">120/hour</text><line x1="181" y1="158" x2="249" y2="158" stroke="#a35736" stroke-width="3"/><rect x="251" y="120" width="145" height="75" rx="4" fill="#24282b" stroke="#bab8af"/><text x="323" y="150" font-size="22" fill="#eeebe4" text-anchor="middle">Test</text><text x="323" y="179" font-size="21" fill="#eeebe4" text-anchor="middle">80/hour</text><line x1="397" y1="158" x2="465" y2="158" stroke="#a35736" stroke-width="3"/><rect x="467" y="120" width="145" height="75" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="539" y="150" font-size="22" fill="#24282b" text-anchor="middle">Pack</text><text x="539" y="179" font-size="21" fill="#24282b" text-anchor="middle">100/hour</text><text x="690" y="150" font-size="17" fill="#62676a" text-anchor="middle">Output</text><text x="690" y="181" font-size="27" fill="#a35736" text-anchor="middle">80</text><text x="24" y="262" font-size="22" fill="#24282b" text-anchor="start">After the test change</text><rect x="35" y="280" width="145" height="75" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="107" y="310" font-size="22" fill="#24282b" text-anchor="middle">Cut</text><text x="107" y="339" font-size="21" fill="#24282b" text-anchor="middle">120/hour</text><line x1="181" y1="318" x2="249" y2="318" stroke="#a35736" stroke-width="3"/><rect x="251" y="280" width="145" height="75" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="323" y="310" font-size="22" fill="#24282b" text-anchor="middle">Test</text><text x="323" y="339" font-size="21" fill="#24282b" text-anchor="middle">105/hour</text><line x1="397" y1="318" x2="465" y2="318" stroke="#a35736" stroke-width="3"/><rect x="467" y="280" width="145" height="75" rx="4" fill="#24282b" stroke="#bab8af"/><text x="539" y="310" font-size="22" fill="#eeebe4" text-anchor="middle">Pack</text><text x="539" y="339" font-size="21" fill="#eeebe4" text-anchor="middle">100/hour</text><text x="690" y="310" font-size="17" fill="#62676a" text-anchor="middle">Output</text><text x="690" y="341" font-size="27" fill="#a35736" text-anchor="middle">100</text><text x="24" y="460" font-size="20" fill="#62676a" text-anchor="start">Demand: 110/hour. The limiting step moves from test to pack.</text></svg>
