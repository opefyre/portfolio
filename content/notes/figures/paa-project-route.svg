<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="paa-project-route-title paa-project-route-desc"><title id="paa-project-route-title">From authorised purpose to accepted operation</title><desc id="paa-project-route-desc">Four illustrative stages of a fictional pilot, not equal durations or a universal lifecycle.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">MAINTENANCE REQUEST PILOT</text><text x="24" y="92" font-size="34" fill="#b4532a" text-anchor="start">01</text><rect x="24" y="122" width="167" height="138" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="152" font-size="19" fill="#101213" text-anchor="start">Authorise</text><text x="40" y="183" font-size="15" fill="#5a5d60" text-anchor="start">Purpose and scope</text><text x="40" y="205" font-size="15" fill="#5a5d60" text-anchor="start">Sponsor and limits</text><line x1="194" y1="190" x2="205" y2="190" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><text x="209" y="92" font-size="34" fill="#b4532a" text-anchor="start">02</text><rect x="209" y="122" width="167" height="138" rx="4" fill="none" stroke="#c7c2b8"/><text x="225" y="152" font-size="19" fill="#101213" text-anchor="start">Prepare</text><text x="225" y="183" font-size="15" fill="#5a5d60" text-anchor="start">Routing and access</text><text x="225" y="205" font-size="15" fill="#5a5d60" text-anchor="start">Confirmed people</text><line x1="379" y1="190" x2="390" y2="190" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><text x="394" y="92" font-size="34" fill="#b4532a" text-anchor="start">03</text><rect x="394" y="122" width="167" height="138" rx="4" fill="none" stroke="#c7c2b8"/><text x="410" y="152" font-size="19" fill="#101213" text-anchor="start">Test</text><text x="410" y="183" font-size="15" fill="#5a5d60" text-anchor="start">Whole request route</text><text x="410" y="205" font-size="15" fill="#5a5d60" text-anchor="start">Exceptions checked</text><line x1="564" y1="190" x2="575" y2="190" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><text x="579" y="92" font-size="34" fill="#b4532a" text-anchor="start">04</text><rect x="579" y="122" width="167" height="138" rx="4" fill="none" stroke="#c7c2b8"/><text x="595" y="152" font-size="19" fill="#101213" text-anchor="start">Hand over</text><text x="595" y="183" font-size="15" fill="#5a5d60" text-anchor="start">Owner accepts</text><text x="595" y="205" font-size="15" fill="#5a5d60" text-anchor="start">Support and review</text><line x1="24" y1="306" x2="736" y2="306" stroke="#c7c2b8" stroke-width="2"/><text x="24" y="340" font-size="22" fill="#101213" text-anchor="start">A stage finishes with a supported decision.</text><text x="24" y="375" font-size="17" fill="#5a5d60" text-anchor="start">Planning and testing can repeat when the evidence changes.</text></svg>
