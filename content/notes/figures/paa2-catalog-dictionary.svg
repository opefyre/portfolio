<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" role="img" aria-labelledby="paa2-catalog-dictionary-title paa2-catalog-dictionary-desc"><title id="paa2-catalog-dictionary-title">Catalogue and dictionary records</title><desc id="paa2-catalog-dictionary-desc">Catalogue gives dataset grain freshness owner and access. Dictionary gives a field type units null meaning and rule version. Business glossary defines the term.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Find the dataset, then inspect the field</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional catalogue records for warehouse and finance data</text><rect x="24" y="100" width="348" height="242" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="42" y="135" font-size="24" fill="#272b2d" font-weight="500">Data catalogue</text><text x="42" y="177" font-size="18" fill="#63676a" font-weight="400">Warehouse pickable stock</text><text x="42" y="208" font-size="18" fill="#63676a" font-weight="400">Item and location</text><text x="42" y="239" font-size="18" fill="#63676a" font-weight="400">Pieces, snapshot 09:00</text><text x="42" y="270" font-size="18" fill="#63676a" font-weight="400">Loaded 09:05</text><text x="42" y="301" font-size="18" fill="#63676a" font-weight="400">Owner and access route</text><rect x="388" y="100" width="348" height="242" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="406" y="135" font-size="24" fill="#272b2d" font-weight="500">Data dictionary</text><text x="406" y="177" font-size="18" fill="#63676a" font-weight="400">Field: pickable_quantity</text><text x="406" y="208" font-size="18" fill="#63676a" font-weight="400">Type: integer</text><text x="406" y="239" font-size="18" fill="#63676a" font-weight="400">Unit: pieces</text><text x="406" y="270" font-size="18" fill="#63676a" font-weight="400">Null: missing, not zero</text><text x="406" y="301" font-size="18" fill="#63676a" font-weight="400">Rule version: v2</text><path d="M24 377H736" stroke="#cec9bd"/><text x="24" y="415" font-size="20" fill="#272b2d" font-weight="400">Business glossary: what “pickable” means in this business.</text><text x="24" y="452" font-size="18" fill="#a94f35" font-weight="400">A catalogue helps you find data. Field details help you use it.</text></g></svg>
