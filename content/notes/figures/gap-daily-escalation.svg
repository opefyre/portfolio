<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-daily-escalation-title gap-daily-escalation-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-daily-escalation-title">A red result needs a response</title><desc id="gap-daily-escalation-desc">The gap is recorded, the next order protected, unresolved ownership escalated, and evidence checked at the next review.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">A red result needs a response</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><line x1="80" y1="160" x2="660" y2="160" stroke="#a35736" stroke-width="3"/><circle cx="80" cy="160" r="9" fill="#a35736"/><text x="80" y="119" font-size="21" fill="#24282b" text-anchor="middle">10:00</text><text x="80" y="207" font-size="17" fill="#24282b" text-anchor="middle">Record the gap</text><text x="80" y="236" font-size="17" fill="#62676a" text-anchor="middle">C17 unavailable</text><circle cx="280" cy="160" r="9" fill="#a35736"/><text x="280" y="119" font-size="21" fill="#24282b" text-anchor="middle">Before 11:20</text><text x="280" y="207" font-size="17" fill="#24282b" text-anchor="middle">Contain the shortage</text><text x="280" y="236" font-size="17" fill="#62676a" text-anchor="middle">Stores confirms stock</text><circle cx="480" cy="160" r="9" fill="#a35736"/><text x="480" y="119" font-size="21" fill="#24282b" text-anchor="middle">14:00</text><text x="480" y="207" font-size="17" fill="#24282b" text-anchor="middle">Escalate if unassigned</text><text x="480" y="236" font-size="17" fill="#62676a" text-anchor="middle">Resolve readiness owner</text><circle cx="660" cy="160" r="9" fill="#a35736"/><text x="660" y="119" font-size="21" fill="#24282b" text-anchor="middle">Next review</text><text x="660" y="207" font-size="17" fill="#24282b" text-anchor="middle">Check the evidence</text><text x="660" y="236" font-size="17" fill="#62676a" text-anchor="middle">Close or continue</text><rect x="30" y="287" width="700" height="104" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="50" y="321" font-size="24" fill="#24282b" text-anchor="start">Keep the recurring problem open</text><text x="50" y="355" font-size="18" fill="#62676a" text-anchor="start">Today’s carton delivery does not establish that the release rule works.</text></svg>
