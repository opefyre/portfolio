<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="paa-3p-layouts-title paa-3p-layouts-desc"><title id="paa-3p-layouts-title">Two process concepts to prototype before investment</title><desc id="paa-3p-layouts-desc">Fictional straight and compact kit-packing routes. Geometry alone does not establish cycle time, staffing, safety or cost.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">KIT PACKING / ALTERNATIVE PROCESS CONCEPTS</text><text x="24" y="79" font-size="25" fill="#101213" text-anchor="start">Straight transfer line</text><text x="414" y="79" font-size="25" fill="#101213" text-anchor="start">Compact cell</text><rect x="24" y="115" width="280" height="60" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="145" font-size="19" fill="#101213" text-anchor="start">Prepare parts</text><text x="40" y="176" font-size="15" fill="#5a5d60" text-anchor="start"></text><line x1="164" y1="177" x2="164" y2="192" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="195" width="280" height="60" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="225" font-size="19" fill="#101213" text-anchor="start">Verify contents</text><text x="40" y="256" font-size="15" fill="#5a5d60" text-anchor="start"></text><line x1="164" y1="257" x2="164" y2="272" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="275" width="280" height="60" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="305" font-size="19" fill="#101213" text-anchor="start">Close package</text><text x="40" y="336" font-size="15" fill="#5a5d60" text-anchor="start"></text><line x1="164" y1="337" x2="164" y2="352" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="355" width="280" height="60" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="385" font-size="19" fill="#101213" text-anchor="start">Record and release</text><text x="40" y="416" font-size="15" fill="#5a5d60" text-anchor="start"></text><rect x="414" y="115" width="145" height="100" rx="4" fill="none" stroke="#c7c2b8"/><text x="430" y="145" font-size="19" fill="#101213" text-anchor="start">Prepare</text><text x="430" y="176" font-size="15" fill="#5a5d60" text-anchor="start">Parts ready</text><rect x="589" y="115" width="145" height="100" rx="4" fill="none" stroke="#c7c2b8"/><text x="605" y="145" font-size="19" fill="#101213" text-anchor="start">Verify</text><text x="605" y="176" font-size="15" fill="#5a5d60" text-anchor="start">Contents checked</text><rect x="589" y="295" width="145" height="100" rx="4" fill="none" stroke="#c7c2b8"/><text x="605" y="325" font-size="19" fill="#101213" text-anchor="start">Close</text><text x="605" y="356" font-size="15" fill="#5a5d60" text-anchor="start">Package sealed</text><rect x="414" y="295" width="145" height="100" rx="4" fill="none" stroke="#c7c2b8"/><text x="430" y="325" font-size="19" fill="#101213" text-anchor="start">Release</text><text x="430" y="356" font-size="15" fill="#5a5d60" text-anchor="start">Record complete</text><line x1="560" y1="165" x2="586" y2="165" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><line x1="661" y1="217" x2="661" y2="292" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><line x1="586" y1="345" x2="562" y2="345" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="472" font-size="19" fill="#101213" text-anchor="start">Both must meet the same kit, pace, safety and quality requirements.</text><text x="24" y="507" font-size="16" fill="#5a5d60" text-anchor="start">Prototype the work before choosing equipment. Drawings are not to scale.</text></svg>
