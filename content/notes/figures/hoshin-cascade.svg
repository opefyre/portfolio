<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="Hoshin kanri cascade. A three to five year breakthrough objective sets this year's objectives, which set a few top-level priorities, which set measurable targets for each team. Catchball arrows go both ways between each level.">
<defs><marker id="hk-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5a5d60"/></marker></defs>
<text x="0" y="36" font-size="13" fill="#5a5d60">3 to 5 years</text>
<rect x="110" y="10" width="400" height="62" rx="8" fill="#0f1011" stroke="#0f1011" stroke-width="1.2"/>
<text x="126" y="35" font-size="15" font-weight="600" fill="#eeebe4">Breakthrough objective</text>
<text x="126" y="56" font-size="13" fill="#cfcdc6">Halve order-to-delivery lead time</text>
<line x1="532" y1="74" x2="532" y2="90" stroke="#5a5d60" stroke-width="1.3" marker-end="url(#hk-ar)"/>
<line x1="544" y1="90" x2="544" y2="74" stroke="#5a5d60" stroke-width="1.3" marker-end="url(#hk-ar)"/>
<text x="0" y="118" font-size="13" fill="#5a5d60">This year</text>
<rect x="110" y="92" width="400" height="62" rx="8" fill="#0f1011" stroke="#0f1011" stroke-width="1.2"/>
<text x="126" y="117" font-size="15" font-weight="600" fill="#eeebe4">Annual objectives</text>
<text x="126" y="138" font-size="13" fill="#cfcdc6">Cut lead time 20%; on-time delivery to 95%</text>
<line x1="532" y1="156" x2="532" y2="172" stroke="#5a5d60" stroke-width="1.3" marker-end="url(#hk-ar)"/>
<line x1="544" y1="172" x2="544" y2="156" stroke="#5a5d60" stroke-width="1.3" marker-end="url(#hk-ar)"/>
<text x="0" y="200" font-size="13" fill="#5a5d60">This year</text>
<rect x="110" y="174" width="400" height="62" rx="8" fill="#6f7f8c" stroke="#0f1011" stroke-width="1.2"/>
<text x="126" y="199" font-size="15" font-weight="600" fill="#eeebe4">Top-level priorities</text>
<text x="126" y="220" font-size="13" fill="#cfcdc6">Pull planning in 2 plants; supplier lead-time program</text>
<line x1="532" y1="238" x2="532" y2="254" stroke="#5a5d60" stroke-width="1.3" marker-end="url(#hk-ar)"/>
<line x1="544" y1="254" x2="544" y2="238" stroke="#5a5d60" stroke-width="1.3" marker-end="url(#hk-ar)"/>
<text x="0" y="282" font-size="13" fill="#5a5d60">Monthly</text>
<rect x="110" y="256" width="400" height="62" rx="8" fill="#eeebe4" stroke="#0f1011" stroke-width="1.2"/>
<text x="126" y="281" font-size="15" font-weight="600" fill="#0f1011">Team targets</text>
<text x="126" y="302" font-size="13" fill="#0f1011">Plant A: WIP −30% by June; Procurement: 10 suppliers on VMI</text>
<text x="558" y="137.0" font-size="13" fill="#0f1011">Catchball:</text><text x="558" y="155.0" font-size="13" fill="#5a5d60">targets go down,</text><text x="558" y="173.0" font-size="13" fill="#5a5d60">reality comes up</text>
</svg>