<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-mode-timeline-title gap-mode-timeline-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-mode-timeline-title">Check the arrival before the freight bill</title><desc id="gap-mode-timeline-desc">Air arrives day 4, rail day 14 and sea day 24. The required availability is day 18.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Check the arrival before the freight bill</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><text x="20" y="140" font-size="23" fill="#24282b" text-anchor="start">Air</text><line x1="160" y1="132" x2="664" y2="132" stroke="#bab8af" stroke-width="2"/><line x1="160" y1="132" x2="244" y2="132" stroke="#496778" stroke-width="16"/><circle cx="244" cy="132" r="5" fill="#24282b"/><text x="256" y="139" font-size="18" fill="#24282b" text-anchor="start">Day 4</text><text x="20" y="218" font-size="23" fill="#24282b" text-anchor="start">Rail</text><line x1="160" y1="210" x2="664" y2="210" stroke="#bab8af" stroke-width="2"/><line x1="160" y1="210" x2="454" y2="210" stroke="#496778" stroke-width="16"/><circle cx="454" cy="210" r="5" fill="#24282b"/><text x="466" y="217" font-size="18" fill="#24282b" text-anchor="start">Day 14</text><text x="20" y="296" font-size="23" fill="#24282b" text-anchor="start">Sea</text><line x1="160" y1="288" x2="664" y2="288" stroke="#bab8af" stroke-width="2"/><line x1="160" y1="288" x2="664" y2="288" stroke="#a35736" stroke-width="16"/><circle cx="664" cy="288" r="5" fill="#24282b"/><text x="676" y="295" font-size="18" fill="#24282b" text-anchor="start">Day 24</text><line x1="160" y1="330" x2="160" y2="337" stroke="#bab8af" stroke-width="2"/><text x="160" y="363" font-size="18" fill="#62676a" text-anchor="middle">0</text><line x1="286" y1="330" x2="286" y2="337" stroke="#bab8af" stroke-width="2"/><text x="286" y="363" font-size="18" fill="#62676a" text-anchor="middle">6</text><line x1="412" y1="330" x2="412" y2="337" stroke="#bab8af" stroke-width="2"/><text x="412" y="363" font-size="18" fill="#62676a" text-anchor="middle">12</text><line x1="538" y1="330" x2="538" y2="337" stroke="#bab8af" stroke-width="2"/><text x="538" y="363" font-size="18" fill="#62676a" text-anchor="middle">18</text><line x1="664" y1="330" x2="664" y2="337" stroke="#bab8af" stroke-width="2"/><text x="664" y="363" font-size="18" fill="#62676a" text-anchor="middle">24</text><line x1="538" y1="85" x2="538" y2="322" stroke="#a35736" stroke-width="2" stroke-dasharray="5 5"/><text x="538" y="80" font-size="18" fill="#a35736" text-anchor="middle">Needed by day 18</text><text x="20" y="410" font-size="20" fill="#62676a" text-anchor="start">Times run from dispatch to stock available for use.</text></svg>
