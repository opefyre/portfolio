<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="aici-impact-effort-title aici-impact-effort-desc"><title id="aici-impact-effort-title">Plot estimates without calling them measured returns</title><desc id="aici-impact-effort-desc">A labelled impact-effort matrix without invented proposal positions or scores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Plot estimates without calling them measured returns</text><rect x="125" y="105" width="555" height="300" rx="3" fill="none" stroke="#cbc6ba" stroke-width="1.2"/><line x1="402" y1="105" x2="402" y2="405" stroke="#cbc6ba" stroke-width="1.5"/><line x1="125" y1="255" x2="680" y2="255" stroke="#cbc6ba" stroke-width="1.5"/><line x1="125" y1="420" x2="680" y2="420" stroke="#252a2d" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="108" y1="405" x2="108" y2="105" stroke="#252a2d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="401" y="466" font-size="19" fill="#252a2d" text-anchor="middle" font-weight="400">Estimated effort →</text><text x="24" y="81" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Estimated effect ↑</text><text x="145" y="150" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Higher effect / lower</text><text x="145" y="174" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">effort</text><text x="423" y="150" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Higher effect / higher</text><text x="423" y="174" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">effort</text><text x="145" y="301" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">Lower effect / lower</text><text x="145" y="325" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">effort</text><text x="423" y="301" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">Lower effect / higher</text><text x="423" y="325" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">effort</text><text x="24" y="515" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Record evidence and uncertainty beside any proposed position. Mandatory</text><text x="24" y="539" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">requirements are not optional quadrant choices.</text></g></svg>