<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 489" role="img" aria-labelledby="paa2-line-balance-title paa2-line-balance-desc"><title id="paa2-line-balance-title">Before and after line balancing</title><desc id="paa2-line-balance-desc">Current A55 B75 C50 seconds, proposed A60 B60 C60. All share a seconds scale. Takt is 60 seconds; total work remains 180 seconds.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Rebalance the work before changing the target</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional movable manual tasks. Total work stays at 180 seconds.</text><text x="24" y="128" font-size="18" fill="#272b2d" font-weight="400">Station A</text><rect x="166" y="108" width="330" height="24" rx="3" fill="#63676a" stroke="#63676a"/><rect x="166" y="138" width="360" height="24" rx="3" fill="#a94f35" stroke="#a94f35"/><text x="506" y="126" font-size="16" fill="#272b2d" font-weight="400">55s</text><text x="536" y="156" font-size="16" fill="#272b2d" font-weight="400">60s</text><text x="24" y="216" font-size="18" fill="#272b2d" font-weight="400">Station B</text><rect x="166" y="196" width="450" height="24" rx="3" fill="#63676a" stroke="#63676a"/><rect x="166" y="226" width="360" height="24" rx="3" fill="#a94f35" stroke="#a94f35"/><text x="626" y="214" font-size="16" fill="#272b2d" font-weight="400">75s</text><text x="536" y="244" font-size="16" fill="#272b2d" font-weight="400">60s</text><text x="24" y="304" font-size="18" fill="#272b2d" font-weight="400">Station C</text><rect x="166" y="284" width="300" height="24" rx="3" fill="#63676a" stroke="#63676a"/><rect x="166" y="314" width="360" height="24" rx="3" fill="#a94f35" stroke="#a94f35"/><text x="476" y="302" font-size="16" fill="#272b2d" font-weight="400">50s</text><text x="536" y="332" font-size="16" fill="#272b2d" font-weight="400">60s</text><line x1="526" y1="91" x2="526" y2="358" stroke="#a94f35" stroke-dasharray="4 5"/><text x="480" y="386" font-size="17" fill="#a94f35" font-weight="400">Takt: 60s</text><rect x="24" y="411" width="12" height="12" rx="3" fill="#63676a" stroke="#63676a"/><text x="44" y="423" font-size="16" fill="#272b2d" font-weight="400">Current</text><rect x="166" y="411" width="12" height="12" rx="3" fill="#a94f35" stroke="#a94f35"/><text x="186" y="423" font-size="16" fill="#272b2d" font-weight="400">Proposed</text><text x="24" y="461" font-size="19" fill="#272b2d" font-weight="400">A gains 5s. B gives up 15s. C gains 10s.</text></g></svg>
