<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 391" role="img" aria-labelledby="paa2-reserve-bridge-title paa2-reserve-bridge-desc"><title id="paa2-reserve-bridge-title">Estimate, baseline and budget</title><desc id="paa2-reserve-bridge-desc">Base 2.4 million euros plus contingency 180 thousand makes baseline 2.58 million; management reserve 100 thousand brings budget to 2.68 million.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">From estimate to authorised budget</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional allocations, not a reserve-sizing method</text><rect x="24" y="96" width="637.6119402985074" height="42" rx="3" fill="#272b2d" stroke="#272b2d"/><rect x="661.6119402985074" y="96" width="47.82089552238806" height="42" rx="3" fill="#a94f35" stroke="#a94f35"/><rect x="709.4328358208954" y="96" width="26.567164179104477" height="42" rx="3" fill="#3c6475" stroke="#3c6475"/><rect x="24" y="168" width="10" height="16" rx="3" fill="#272b2d" stroke="#272b2d"/><text x="48" y="184" font-size="18" fill="#272b2d" font-weight="400">Base estimate</text><text x="540" y="184" font-size="20" fill="#272b2d" font-weight="500">€2,400,000</text><rect x="24" y="210" width="10" height="16" rx="3" fill="#a94f35" stroke="#a94f35"/><text x="48" y="226" font-size="18" fill="#272b2d" font-weight="400">Contingency reserve</text><text x="540" y="226" font-size="20" fill="#a94f35" font-weight="500">€180,000</text><rect x="24" y="252" width="10" height="16" rx="3" fill="#3c6475" stroke="#3c6475"/><text x="48" y="268" font-size="18" fill="#272b2d" font-weight="400">Management reserve</text><text x="540" y="268" font-size="20" fill="#3c6475" font-weight="500">€100,000</text><path d="M24 292H736" stroke="#cec9bd"/><text x="24" y="326" font-size="20" fill="#272b2d" font-weight="400">Cost baseline: €2,580,000</text><text x="24" y="361" font-size="22" fill="#272b2d" font-weight="500">Total budget: €2,680,000</text></g></svg>
