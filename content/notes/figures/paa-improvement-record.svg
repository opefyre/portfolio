<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="paa-improvement-record-title paa-improvement-record-desc"><title id="paa-improvement-record-title">A trial record that keeps volume and follow-up visible</title><desc id="paa-improvement-record-desc">Fictional error rates: twelve over four hundred equals three percent; four over five hundred equals zero point eight percent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">PICKING TRIAL / WRONG-SIZE ORDER LINES</text><text x="24" y="78" font-size="22" fill="#101213" text-anchor="start">Baseline</text><text x="24" y="110" font-size="17" fill="#5a5d60" text-anchor="start">12 of 400 checked lines</text><text x="24" y="200" font-size="22" fill="#101213" text-anchor="start">Trial</text><text x="24" y="232" font-size="17" fill="#5a5d60" text-anchor="start">4 of 500 checked lines</text><rect x="270" y="64" width="360" height="36" fill="#101213"/><rect x="270" y="186" width="96" height="36" fill="#b4532a"/><text x="700" y="90" font-size="19" fill="#101213" text-anchor="end">3.0%</text><text x="400" y="212" font-size="19" fill="#b4532a" text-anchor="start">0.8%</text><text x="270" y="266" font-size="14" fill="#5a5d60" text-anchor="start">Bars share a 0% to 3% scale</text><line x1="24" y1="298" x2="736" y2="298" stroke="#c7c2b8" stroke-width="2"/><text x="24" y="332" font-size="18" fill="#b4532a" text-anchor="start">Next check</text><text x="24" y="365" font-size="19" fill="#101213" text-anchor="start">Location records, walking, product mix and later errors</text><text x="24" y="400" font-size="16" fill="#5a5d60" text-anchor="start">Lower error in this trial is a finding to follow up, not proof of cause.</text></svg>
