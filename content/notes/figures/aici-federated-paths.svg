<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" role="img" aria-labelledby="aici-federated-paths-title aici-federated-paths-desc"><title id="aici-federated-paths-title">Inspect what the training design actually sends</title><desc id="aici-federated-paths-desc">Classical updates and encrypted-data protected-server methods use different data paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Inspect what the training design actually sends</text><text x="24" y="88" font-size="21" fill="#252a2d" text-anchor="start" font-weight="400">Classical local training</text><rect x="24" y="110" width="216" height="112" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39" y="139" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Local data +</text><text x="39" y="163" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">training</text><line x1="132" y1="225" x2="378" y2="275" stroke="#3c6475" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="269" y="110" width="216" height="112" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="284" y="139" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Local data +</text><text x="284" y="163" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">training</text><line x1="377" y1="225" x2="378" y2="275" stroke="#3c6475" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="514" y="110" width="216" height="112" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="529" y="139" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Local data +</text><text x="529" y="163" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">training</text><line x1="622" y1="225" x2="378" y2="275" stroke="#3c6475" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="278" y="280" width="210" height="70" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="293" y="309" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Aggregate updates</text><text x="24" y="395" font-size="21" fill="#252a2d" text-anchor="start" font-weight="400">Newer protected-server design</text><rect x="24" y="419" width="247" height="100" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39" y="448" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Encrypted training</text><text x="39" y="472" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">data</text><rect x="381" y="419" width="355" height="100" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="396" y="448" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Protected server computation</text><line x1="276" y1="469" x2="375" y2="469" stroke="#a35334" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="565" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">The architecture determines what moves and which privacy protections</text><text x="24" y="589" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">apply.</text></g></svg>