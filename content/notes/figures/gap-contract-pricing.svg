<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" role="img" aria-labelledby="gap-contract-pricing-title gap-contract-pricing-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-contract-pricing-title">What changes the payment?</title><desc id="gap-contract-pricing-desc">The fixed price applies to defined scope. Time and materials changes with authorised hours. Cost plus fixed fee changes with eligible incurred costs.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">What changes the payment?</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><text x="20" y="112" font-size="21" fill="#24282b" text-anchor="start">Fixed scope</text><text x="320" y="112" font-size="25" fill="#a35736" text-anchor="start">€24,000</text><text x="20" y="144" font-size="18" fill="#62676a" text-anchor="start">Defined work; approved changes priced separately</text><line x1="20" y1="167" x2="740" y2="167" stroke="#bab8af" stroke-width="2"/><text x="20" y="216" font-size="21" fill="#24282b" text-anchor="start">Authorised time</text><text x="320" y="216" font-size="25" fill="#a35736" text-anchor="start">320 × €80 = €25,600</text><text x="20" y="248" font-size="18" fill="#62676a" text-anchor="start">Actual authorised hours at the agreed rate</text><line x1="20" y1="271" x2="740" y2="271" stroke="#bab8af" stroke-width="2"/><text x="20" y="320" font-size="21" fill="#24282b" text-anchor="start">Eligible costs + fee</text><text x="320" y="320" font-size="25" fill="#a35736" text-anchor="start">€18,000 + €3,000 = €21,000</text><text x="20" y="352" font-size="18" fill="#62676a" text-anchor="start">Cost evidence plus the agreed fixed fee</text><line x1="20" y1="375" x2="740" y2="375" stroke="#bab8af" stroke-width="2"/><text x="20" y="438" font-size="19" fill="#62676a" text-anchor="start">Fictional payment mechanics. Scope and commercial terms still matter.</text></svg>
