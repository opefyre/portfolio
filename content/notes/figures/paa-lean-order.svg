<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="paa-lean-order-title paa-lean-order-desc"><title id="paa-lean-order-title">One route can contain flow and defect problems</title><desc id="paa-lean-order-desc">Fictional picks wait for batch transfer before packing. Waiting and incorrect contents require different evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">ORDER PACKING / TWO DIFFERENT QUESTIONS</text><rect x="24" y="100" width="190" height="110" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="130" font-size="19" fill="#101213" text-anchor="start">Pick complete</text><text x="40" y="161" font-size="15" fill="#5a5d60" text-anchor="start">Order ready</text><rect x="285" y="100" width="190" height="110" rx="4" fill="#e1d9cc" stroke="#b4532a"/><text x="301" y="130" font-size="19" fill="#101213" text-anchor="start">Waiting batch</text><text x="301" y="161" font-size="15" fill="#5a5d60" text-anchor="start">Up to two days</text><rect x="546" y="100" width="190" height="110" rx="4" fill="none" stroke="#c7c2b8"/><text x="562" y="130" font-size="19" fill="#101213" text-anchor="start">Pack and check</text><text x="562" y="161" font-size="15" fill="#5a5d60" text-anchor="start">Quantity can be wrong</text><line x1="216" y1="155" x2="282" y2="155" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><line x1="477" y1="155" x2="543" y2="155" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><line x1="380" y1="212" x2="380" y2="274" stroke="#b4532a" stroke-width="2"/><text x="250" y="309" font-size="20" fill="#b4532a" text-anchor="start">Flow and handoff</text><text x="250" y="338" font-size="16" fill="#5a5d60" text-anchor="start">Why does ready work wait?</text><line x1="641" y1="212" x2="641" y2="274" stroke="#c7c2b8" stroke-width="2"/><text x="510" y="309" font-size="20" fill="#101213" text-anchor="start">Variation and defects</text><text x="510" y="338" font-size="16" fill="#5a5d60" text-anchor="start">Why is the quantity wrong?</text><text x="24" y="396" font-size="19" fill="#101213" text-anchor="start">Kaizen can involve the team in testing either change.</text></svg>
