<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-operating-model-title gap-operating-model-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-operating-model-title">Choose what must be shared</title><desc id="gap-operating-model-desc">Both sites use shared stock-availability and allocation rules while retaining local loading decisions.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Choose what must be shared</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><rect x="60" y="108" width="160" height="70" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="140" y="150" font-size="25" fill="#24282b" text-anchor="middle">Site A</text><rect x="30" y="306" width="220" height="66" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="140" y="345" font-size="18" fill="#24282b" text-anchor="middle">Local loading decision</text><line x1="140" y1="178" x2="140" y2="306" stroke="#496778" stroke-width="2" stroke-dasharray="5 4"/><rect x="540" y="108" width="160" height="70" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="620" y="150" font-size="25" fill="#24282b" text-anchor="middle">Site B</text><rect x="510" y="306" width="220" height="66" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="620" y="345" font-size="18" fill="#24282b" text-anchor="middle">Local loading decision</text><line x1="620" y1="178" x2="620" y2="306" stroke="#496778" stroke-width="2" stroke-dasharray="5 4"/><rect x="265" y="203" width="230" height="95" rx="4" fill="#24282b" stroke="#bab8af"/><text x="380" y="240" font-size="23" fill="#eeebe4" text-anchor="middle">Shared availability</text><text x="380" y="271" font-size="22" fill="#eeebe4" text-anchor="middle">and allocation rules</text><path d="M140 178 V250 H265" fill="none" stroke="#a35736" stroke-width="2"/><path d="M620 178 V250 H495" fill="none" stroke="#a35736" stroke-width="2"/><text x="20" y="424" font-size="19" fill="#62676a" text-anchor="start">One promise basis. Explicit local decisions. A named exception owner.</text></svg>
