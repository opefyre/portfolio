<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" role="img" aria-labelledby="paa-risk-dependency-title paa-risk-dependency-desc"><title id="paa-risk-dependency-title">Two suppliers may share the same failure path</title><desc id="paa-risk-dependency-desc">Fictional component maker supplies both vendors, whose shipments converge on one port and route before the plant. The supplier count alone does not establish resilience.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">TWO SUPPLIERS / SHARED EXPOSURE</text><rect x="245" y="65" width="270" height="75" rx="4" fill="none" stroke="#c7c2b8"/><text x="261" y="95" font-size="19" fill="#101213" text-anchor="start">Component maker</text><text x="261" y="126" font-size="15" fill="#5a5d60" text-anchor="start"></text><line x1="300" y1="142" x2="180" y2="187" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="142" x2="580" y2="187" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="190" width="220" height="75" rx="4" fill="none" stroke="#c7c2b8"/><text x="86" y="220" font-size="19" fill="#101213" text-anchor="start">Supplier A</text><text x="86" y="251" font-size="15" fill="#5a5d60" text-anchor="start"></text><rect x="470" y="190" width="220" height="75" rx="4" fill="none" stroke="#c7c2b8"/><text x="486" y="220" font-size="19" fill="#101213" text-anchor="start">Supplier B</text><text x="486" y="251" font-size="15" fill="#5a5d60" text-anchor="start"></text><line x1="180" y1="267" x2="325" y2="312" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><line x1="580" y1="267" x2="435" y2="312" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="315" width="270" height="75" rx="4" fill="#e1d9cc" stroke="#b4532a"/><text x="261" y="345" font-size="19" fill="#101213" text-anchor="start">Shared port and route</text><text x="261" y="376" font-size="15" fill="#5a5d60" text-anchor="start">One disruption can hit both</text><line x1="380" y1="392" x2="380" y2="425" stroke="#101213" stroke-width="2" marker-end="url(#arrow)"/><rect x="245" y="428" width="270" height="75" rx="4" fill="none" stroke="#c7c2b8"/><text x="261" y="458" font-size="19" fill="#101213" text-anchor="start">Plant / customers</text><text x="261" y="489" font-size="15" fill="#5a5d60" text-anchor="start"></text><rect x="565" y="428" width="171" height="75" rx="4" fill="none" stroke="#c7c2b8"/><text x="581" y="458" font-size="19" fill="#101213" text-anchor="start">Local option</text><text x="581" y="489" font-size="15" fill="#5a5d60" text-anchor="start">Verify upstream</text><line x1="563" y1="468" x2="518" y2="468" stroke="#5a5d60" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="24" y="550" font-size="20" fill="#b4532a" text-anchor="start">A backup needs an independent, verified path to usable supply.</text></svg>
