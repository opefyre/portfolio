<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" role="img" aria-labelledby="paa3-spaghetti-route-title paa3-spaghetti-route-desc"><title id="paa3-spaghetti-route-title">Before and proposed walking routes on the same scale</title><desc id="paa3-spaghetti-route-desc">Current one-way routes are 8 metres to parts, 14 to labels via the horizontal aisle and 6 to the printer. Proposed routes are 2, 4 and 2 metres. Every route is travelled in both directions, totals 56 and 16 metres.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#252a2d" text-anchor="start" font-weight="500">Trace the walking route, including the return</text><text x="54" y="84" font-size="23" fill="#252a2d" text-anchor="start" font-weight="500">Current layout</text><line x1="54" y1="130" x2="54" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="54" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">0</text><line x1="110" y1="130" x2="110" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="110" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">2</text><line x1="166" y1="130" x2="166" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="166" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">4</text><line x1="222" y1="130" x2="222" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="222" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">6</text><line x1="278" y1="130" x2="278" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="278" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">8</text><line x1="54" y1="130" x2="278" y2="130" stroke="#cec9bd" stroke-width="1"/><line x1="54" y1="186" x2="278" y2="186" stroke="#cec9bd" stroke-width="1"/><line x1="54" y1="242" x2="278" y2="242" stroke="#cec9bd" stroke-width="1"/><line x1="54" y1="298" x2="278" y2="298" stroke="#cec9bd" stroke-width="1"/><polyline points="54,130 278,130 278,130" fill="none" stroke="#252a2d" stroke-width="3"/><polyline points="54,130 278,130 278,298" fill="none" stroke="#a94f35" stroke-width="3"/><polyline points="54,130 54,130 54,298" fill="none" stroke="#3c6475" stroke-width="3"/><circle cx="54" cy="130" r="6" fill="#252a2d"/><text x="65" y="120" font-size="18" fill="#252a2d" text-anchor="start" font-weight="500">B</text><circle cx="278" cy="130" r="6" fill="#252a2d"/><text x="289" y="120" font-size="18" fill="#252a2d" text-anchor="start" font-weight="500">P</text><circle cx="278" cy="298" r="6" fill="#252a2d"/><text x="289" y="288" font-size="18" fill="#252a2d" text-anchor="start" font-weight="500">L</text><circle cx="54" cy="298" r="6" fill="#252a2d"/><text x="65" y="288" font-size="18" fill="#252a2d" text-anchor="start" font-weight="500">R</text><text x="54" y="368" font-size="30" fill="#a94f35" text-anchor="start" font-weight="500">56 m per kit</text><text x="430" y="84" font-size="23" fill="#252a2d" text-anchor="start" font-weight="500">Proposed positions</text><line x1="430" y1="130" x2="430" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="430" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">0</text><line x1="486" y1="130" x2="486" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="486" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">2</text><line x1="542" y1="130" x2="542" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="542" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">4</text><line x1="598" y1="130" x2="598" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="598" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">6</text><line x1="654" y1="130" x2="654" y2="298" stroke="#cec9bd" stroke-width="1"/><text x="654" y="326" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">8</text><line x1="430" y1="130" x2="654" y2="130" stroke="#cec9bd" stroke-width="1"/><line x1="430" y1="186" x2="654" y2="186" stroke="#cec9bd" stroke-width="1"/><line x1="430" y1="242" x2="654" y2="242" stroke="#cec9bd" stroke-width="1"/><line x1="430" y1="298" x2="654" y2="298" stroke="#cec9bd" stroke-width="1"/><polyline points="430,130 486,130 486,130" fill="none" stroke="#252a2d" stroke-width="3"/><polyline points="430,130 486,130 486,186" fill="none" stroke="#a94f35" stroke-width="3"/><polyline points="430,130 430,130 430,186" fill="none" stroke="#3c6475" stroke-width="3"/><circle cx="430" cy="130" r="6" fill="#252a2d"/><text x="441" y="120" font-size="18" fill="#252a2d" text-anchor="start" font-weight="500">B</text><circle cx="486" cy="130" r="6" fill="#252a2d"/><text x="497" y="120" font-size="18" fill="#252a2d" text-anchor="start" font-weight="500">P</text><circle cx="486" cy="186" r="6" fill="#252a2d"/><text x="497" y="176" font-size="18" fill="#252a2d" text-anchor="start" font-weight="500">L</text><circle cx="430" cy="186" r="6" fill="#252a2d"/><text x="441" y="176" font-size="18" fill="#252a2d" text-anchor="start" font-weight="500">R</text><text x="430" y="368" font-size="30" fill="#3c6475" text-anchor="start" font-weight="500">16 m per kit</text><text x="24" y="414" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">B: bench    P: parts    L: labels    R: printer</text><text x="24" y="448" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Same scale / metres. Each route is travelled out and back.</text></g></svg>
