<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 515" role="img" aria-labelledby="aici-ecrs-cycle-title aici-ecrs-cycle-desc"><title id="aici-ecrs-cycle-title">Less walking does not shorten this cycle</title><desc id="aici-ecrs-cycle-desc">Existing fictional packing sequence: forty seconds manual work, walking and waiting total forty-eight in both alternatives.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Less walking does not shorten this cycle</text><text x="24" y="85" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Operator time composition, not task order</text><text x="24" y="153" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Original</text><rect x="175" y="125" width="408.0" height="45" rx="3" fill="#252a2d" stroke="#252a2d" stroke-width="1.2"/><rect x="583.0" y="125" width="61.199999999999996" height="45" rx="3" fill="#3c6475" stroke="#3c6475" stroke-width="1.2"/><rect x="644.2" y="125" width="20.4" height="45" rx="3" fill="#a35334" stroke="#a35334" stroke-width="1.2"/><text x="695" y="154" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">48 s</text><text x="24" y="258" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Shorter walk</text><rect x="175" y="230" width="408.0" height="45" rx="3" fill="#252a2d" stroke="#252a2d" stroke-width="1.2"/><rect x="583.0" y="230" width="30.599999999999998" height="45" rx="3" fill="#3c6475" stroke="#3c6475" stroke-width="1.2"/><rect x="613.6" y="230" width="51.0" height="45" rx="3" fill="#a35334" stroke="#a35334" stroke-width="1.2"/><text x="695" y="259" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">48 s</text><rect x="24" y="367" width="14" height="14" rx="3" fill="#252a2d" stroke="#252a2d" stroke-width="1.2"/><text x="47" y="380" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Manual work: 40 s</text><rect x="269" y="367" width="14" height="14" rx="3" fill="#3c6475" stroke="#3c6475" stroke-width="1.2"/><text x="292" y="380" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Walking: 6 → 3 s</text><rect x="514" y="367" width="14" height="14" rx="3" fill="#a35334" stroke="#a35334" stroke-width="1.2"/><text x="537" y="380" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Waiting: 2 → 5 s</text><text x="24" y="435" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Walking is reduced; the fixed machine completion point creates more</text><text x="24" y="459" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">waiting. The full cycle remains 48 seconds.</text></g></svg>