<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="gap-fishbone-title gap-fishbone-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-fishbone-title">Map possibilities, then test them</title><desc id="gap-fishbone-desc">Machine, material, method and measurement branches contain unproven explanations for a failed pouch seal.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Map possibilities, then test them</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><line x1="40" y1="236" x2="590" y2="236" stroke="#24282b" stroke-width="3"/><rect x="590" y="190" width="147" height="91" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="663" y="225" font-size="22" fill="#24282b" text-anchor="middle">Failed</text><text x="663" y="253" font-size="22" fill="#24282b" text-anchor="middle">seal test</text><line x1="110" y1="124" x2="215" y2="236" stroke="#a35736" stroke-width="2"/><text x="110" y="100" font-size="22" fill="#24282b" text-anchor="start">Machine</text><text x="110" y="124" font-size="17" fill="#62676a" text-anchor="start">Jaw surface cold?</text><line x1="360" y1="124" x2="465" y2="236" stroke="#a35736" stroke-width="2"/><text x="360" y="100" font-size="22" fill="#24282b" text-anchor="start">Material</text><text x="360" y="124" font-size="17" fill="#62676a" text-anchor="start">Film lot different?</text><line x1="110" y1="347" x2="215" y2="236" stroke="#a35736" stroke-width="2"/><text x="110" y="379" font-size="22" fill="#24282b" text-anchor="start">Method</text><text x="110" y="405" font-size="17" fill="#62676a" text-anchor="start">Warm-up check missing?</text><line x1="360" y1="347" x2="465" y2="236" stroke="#a35736" stroke-width="2"/><text x="360" y="379" font-size="22" fill="#24282b" text-anchor="start">Measurement</text><text x="360" y="405" font-size="17" fill="#62676a" text-anchor="start">Test varies by tester?</text><text x="20" y="468" font-size="20" fill="#62676a" text-anchor="start">All branches start as possibilities. Record the check and its result.</text></svg>
