<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 825" role="img" aria-label="Simplified fictional value stream. Waiting counts of 100, 150 and 250 before approval, preparation and dispatch correspond to 2, 3 and 5 working days. Processing takes 12, 18 and 10 minutes. Dashed instructions: planner releases a list, team selects, ready list is reviewed. Parallel resources support 50 orders per working day."><style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.num{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.muted{fill:#5a5d60}.rust{fill:#b4532a}</style><text x="12" y="32" font-size="28" class="num">Where the order waits</text><text x="12" y="66" font-size="19" class="muted">50 orders / working day; 480 min / working day</text><line x1="12" y1="90" x2="548" y2="90" stroke="#d6d3cb"/><text x="12" y="126" font-size="18" class="muted">ORDER PATH</text><text x="261" y="126" font-size="18" class="muted">START INSTRUCTION</text><text x="12" y="164" font-size="22" class="num">100 waiting → 2 days</text><rect x="12" y="180" width="536" height="95" fill="#e2dfd6"/><text x="26" y="214" font-size="23" class="num">Release and approval</text><text x="26" y="245" font-size="20" class="muted">12 min of work</text><path d="M 526 147 V 194 H 505" fill="none" stroke="#b4532a" stroke-dasharray="4 4"/><text x="261" y="147" font-size="18" class="rust">Planner releases a list</text><path d="M 31 277 V 313 m -5 -7 l 5 7 l 5 -7" fill="none" stroke="#0f1011"/><text x="12" y="340" font-size="22" class="num">150 waiting → 3 days</text><rect x="12" y="356" width="536" height="95" fill="#e2dfd6"/><text x="26" y="390" font-size="23" class="num">Prepare the order</text><text x="26" y="421" font-size="20" class="muted">18 min of work</text><path d="M 526 323 V 370 H 505" fill="none" stroke="#b4532a" stroke-dasharray="4 4"/><text x="261" y="323" font-size="18" class="rust">Team selects from its list</text><path d="M 31 453 V 489 m -5 -7 l 5 7 l 5 -7" fill="none" stroke="#0f1011"/><text x="12" y="516" font-size="22" class="num">250 waiting → 5 days</text><rect x="12" y="532" width="536" height="95" fill="#e2dfd6"/><text x="26" y="566" font-size="23" class="num">Check and dispatch</text><text x="26" y="597" font-size="20" class="muted">10 min of work</text><path d="M 526 499 V 546 H 505" fill="none" stroke="#b4532a" stroke-dasharray="4 4"/><text x="261" y="499" font-size="18" class="rust">Ready list is reviewed</text><text x="12" y="666" font-size="22" class="num">Dispatched</text><line x1="12" y1="690" x2="548" y2="690" stroke="#d6d3cb"/><text x="12" y="728" font-size="23" class="num">10 working days waiting + 40 min work</text><text x="12" y="765" font-size="19" class="muted">Solid: order movement. Dashed: information.</text><text x="12" y="798" font-size="19" class="muted">Waiting counts exclude orders being processed.</text></svg>