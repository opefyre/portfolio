<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 457" role="img" aria-labelledby="paa2-return-flow-title paa2-return-flow-desc"><title id="paa2-return-flow-title">Disposition of 20 returns</title><desc id="paa2-return-flow-desc">12 restocked directly, 5 repaired and passed, 3 scrapped. Seventeen units available for stock. Customer credit 800 euros, handling 156 euros.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Follow the returned units to their final outcome</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional pump returns. Repair branch shows completed, accepted work.</text><rect x="24" y="110" width="170" height="90" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="44" y="148" font-size="27" fill="#272b2d" font-weight="500">20 pumps</text><text x="44" y="179" font-size="18" fill="#63676a" font-weight="400">received</text><line x1="194" y1="155" x2="240" y2="132" stroke="#63676a"/><rect x="240" y="102" width="265" height="64" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="257" y="141" font-size="22" fill="#3c6475" font-weight="500">12  Direct restock</text><line x1="194" y1="155" x2="240" y2="234" stroke="#63676a"/><rect x="240" y="204" width="265" height="64" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="257" y="243" font-size="22" fill="#3c6475" font-weight="500">5  Repaired, passed</text><line x1="194" y1="155" x2="240" y2="336" stroke="#63676a"/><rect x="240" y="306" width="265" height="64" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="257" y="345" font-size="22" fill="#a94f35" font-weight="500">3  Scrap</text><text x="546" y="161" font-size="25" fill="#3c6475" font-weight="500">17 available</text><text x="546" y="192" font-size="17" fill="#63676a" font-weight="400">12 + 5 units</text><text x="546" y="343" font-size="24" fill="#a94f35" font-weight="500">3 scrapped</text><text x="24" y="426" font-size="18" fill="#272b2d" font-weight="400">€800 customer credit and €156 handling cost are separate records.</text></g></svg>
