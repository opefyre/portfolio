<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 535" role="img" aria-labelledby="r4-logistics-roles-title r4-logistics-roles-desc"><title id="r4-logistics-roles-title">Two logistics coordination arrangements</title><desc id="r4-logistics-roles-desc">In both alternatives, warehouse and transport providers execute the order. Coordination belongs either to the company logistics team or an appointed 4PL within its agreed remit. No service outcome or saving is assumed.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="26" fill="#272b2d" font-weight="500">Keep execution and coordination visible</text><text x="24" y="68" font-size="18" fill="#63676a" font-weight="400">Alternative arrangements for the same 40-unit order</text><text x="24" y="110" font-size="21" fill="#272b2d" font-weight="500">Company logistics team</text><line x1="24" y1="128" x2="736" y2="128" stroke="#272b2d" stroke-width="2"/><rect x="24" y="153" width="290" height="94" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="24" y="153" width="4" height="94" rx="0" fill="#4e6879"/><text x="40" y="182" font-size="19" fill="#4e6879" font-weight="500">Warehouse provider</text><text x="40" y="211" font-size="16" fill="#272b2d" font-weight="400">Pick and pack</text><text x="40" y="235" font-size="16" fill="#272b2d" font-weight="400">40 units</text><rect x="400" y="153" width="290" height="94" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="400" y="153" width="4" height="94" rx="0" fill="#4e6879"/><text x="416" y="182" font-size="19" fill="#4e6879" font-weight="500">Transport provider</text><text x="416" y="211" font-size="16" fill="#272b2d" font-weight="400">Collect and move</text><text x="416" y="235" font-size="16" fill="#272b2d" font-weight="400">the consignment</text><line x1="320" y1="198" x2="393" y2="198" stroke="#272b2d" stroke-width="2"/><path d="M 384.13005077220714 193.38220824458517 L 393 198 L 384.13005077220714 202.61779175541483" fill="none" stroke="#272b2d" stroke-width="2"/><text x="24" y="282" font-size="17" fill="#63676a" font-weight="400">Coordination owner connects readiness, collection and exceptions.</text><text x="24" y="325" font-size="21" fill="#a94f35" font-weight="500">Appointed 4PL</text><line x1="24" y1="343" x2="736" y2="343" stroke="#a94f35" stroke-width="2"/><rect x="24" y="368" width="290" height="94" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="24" y="368" width="4" height="94" rx="0" fill="#4e6879"/><text x="40" y="397" font-size="19" fill="#4e6879" font-weight="500">Warehouse provider</text><text x="40" y="426" font-size="16" fill="#272b2d" font-weight="400">Pick and pack</text><text x="40" y="450" font-size="16" fill="#272b2d" font-weight="400">40 units</text><rect x="400" y="368" width="290" height="94" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="400" y="368" width="4" height="94" rx="0" fill="#4e6879"/><text x="416" y="397" font-size="19" fill="#4e6879" font-weight="500">Transport provider</text><text x="416" y="426" font-size="16" fill="#272b2d" font-weight="400">Collect and move</text><text x="416" y="450" font-size="16" fill="#272b2d" font-weight="400">the consignment</text><line x1="320" y1="413" x2="393" y2="413" stroke="#272b2d" stroke-width="2"/><path d="M 384.13005077220714 408.3822082445852 L 393 413 L 384.13005077220714 417.6177917554148" fill="none" stroke="#272b2d" stroke-width="2"/><text x="24" y="497" font-size="17" fill="#63676a" font-weight="400">Coordination owner connects readiness, collection and exceptions.</text></g></svg>
