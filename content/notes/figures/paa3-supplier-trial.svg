<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" role="img" aria-labelledby="paa3-supplier-trial-title paa3-supplier-trial-desc"><title id="paa3-supplier-trial-title">Joint supplier development trial</title><desc id="paa3-supplier-trial-desc">Fictional buyer and supplier commitments followed by review of twenty orders. Initial sixteen successes and later nineteen successes do not establish a causal effect.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#252a2d" text-anchor="start" font-weight="500">A delivery result needs work on both sides</text><text x="24" y="86" font-size="21" fill="#252a2d" text-anchor="start" font-weight="500">Baseline review</text><text x="280" y="86" font-size="21" fill="#252a2d" text-anchor="start" font-weight="500">Four-week trial</text><text x="536" y="86" font-size="21" fill="#252a2d" text-anchor="start" font-weight="500">Follow-up</text><text x="24" y="126" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Buyer</text><text x="24" y="164" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Late releases found</text><text x="280" y="164" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Complete by Tuesday</text><text x="536" y="164" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Release records checked</text><line x1="24" y1="186" x2="736" y2="186" stroke="#cec9bd" stroke-width="1"/><text x="24" y="226" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Supplier</text><text x="24" y="264" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Loading and packing</text><text x="280" y="264" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Reserve slot; ready pack</text><text x="536" y="264" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Dispatch records checked</text><line x1="24" y1="286" x2="736" y2="286" stroke="#cec9bd" stroke-width="1"/><text x="24" y="354" font-size="28" fill="#a94f35" text-anchor="start" font-weight="500">16 / 20 orders</text><line x1="242" y1="344" x2="490" y2="344" stroke="#252a2d" stroke-width="2"/><path d="M 483,339 L 490,344 L 483,349" fill="none" stroke="#252a2d" stroke-width="2"/><text x="536" y="354" font-size="28" fill="#3c6475" text-anchor="start" font-weight="500">19 / 20 orders</text><text x="24" y="398" font-size="19" fill="#62676a" text-anchor="start" font-weight="400">Same delivery rule. Check comparability and keep reviewing.</text></g></svg>
