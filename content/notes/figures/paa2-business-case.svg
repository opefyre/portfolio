<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" aria-labelledby="paa2-business-case-title paa2-business-case-desc"><title id="paa2-business-case-title">NPV of three options</title><desc id="paa2-business-case-desc">Current process incremental NPV zero, shared record positive 6885 euros, portal negative 8537 euros. Bars use the same euro scale, extending from zero.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Compare the options on the same basis</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Three-year incremental NPV at 8%. Fictional year-end cash flows.</text><line x1="382" y1="94" x2="382" y2="304" stroke="#272b2d"/><text x="24" y="120" font-size="18" fill="#272b2d" font-weight="400">Current process</text><rect x="382" y="132" width="2" height="22" rx="3" fill="#63676a" stroke="#63676a"/><text x="550" y="149" font-size="20" fill="#63676a" font-weight="500">€0</text><text x="24" y="186" font-size="18" fill="#272b2d" font-weight="400">Shared record</text><rect x="382" y="198" width="165.2516376" height="22" rx="3" fill="#3c6475" stroke="#3c6475"/><text x="550" y="215" font-size="20" fill="#3c6475" font-weight="500">+€6,885</text><text x="24" y="252" font-size="18" fill="#272b2d" font-weight="400">Portal</text><rect x="177.10196559999997" y="264" width="204.89803440000003" height="22" rx="3" fill="#a94f35" stroke="#a94f35"/><text x="550" y="281" font-size="20" fill="#a94f35" font-weight="500">€-8,537</text><text x="24" y="352" font-size="19" fill="#63676a" font-weight="400">Staff time released is shown separately from cash.</text></g></svg>
