<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-labelledby="paa3-application-exit-title paa3-application-exit-desc"><title id="paa3-application-exit-title">Application consolidation and exit costs</title><desc id="paa3-application-exit-desc">Fictional portal retirement transfers active work, integrations and readable evidence before removing the licence. Annual licence 18000 less support 4000 and archive 2000 gives 12000 saving, against 24000 one-off transition cost.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="23" fill="#252a2d" text-anchor="start" font-weight="500">Before retiring Portal B, give its work a destination</text><rect x="24" y="92" width="200" height="214" fill="#f5f2ea" stroke="#cec9bd"/><text x="38" y="128" font-size="20" fill="#252a2d" text-anchor="start" font-weight="500">Portal B today</text><text x="38" y="177" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Inspection imports</text><text x="38" y="219" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Linked evidence</text><text x="38" y="261" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Customer exports</text><rect x="280" y="92" width="200" height="214" fill="#f5f2ea" stroke="#cec9bd"/><text x="294" y="128" font-size="20" fill="#252a2d" text-anchor="start" font-weight="500">New destinations</text><text x="294" y="177" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Active work in A</text><text x="294" y="219" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Verified integrations</text><text x="294" y="261" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Readable record archive</text><rect x="536" y="92" width="200" height="214" fill="#f5f2ea" stroke="#cec9bd"/><text x="550" y="128" font-size="20" fill="#252a2d" text-anchor="start" font-weight="500">Exit after checks</text><text x="550" y="177" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Business acceptance</text><text x="550" y="219" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Access/support agreed</text><text x="550" y="261" font-size="16" fill="#252a2d" text-anchor="start" font-weight="400">Contract exit confirmed</text><line x1="232" y1="198" x2="270" y2="198" stroke="#252a2d" stroke-width="2"/><path d="M 263,193 L 270,198 L 263,203" fill="none" stroke="#252a2d" stroke-width="2"/><line x1="488" y1="198" x2="526" y2="198" stroke="#252a2d" stroke-width="2"/><path d="M 519,193 L 526,198 L 519,203" fill="none" stroke="#252a2d" stroke-width="2"/><text x="24" y="358" font-size="23" fill="#252a2d" text-anchor="start" font-weight="500">€18,000 licence removed</text><text x="24" y="402" font-size="21" fill="#a94f35" text-anchor="start" font-weight="400">€6,000 annual support and archive cost added</text><text x="24" y="447" font-size="21" fill="#3c6475" text-anchor="start" font-weight="400">€24,000 transition cost / €12,000 annual net saving</text></g></svg>
