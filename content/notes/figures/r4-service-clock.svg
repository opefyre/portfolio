<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="r4-service-clock-title r4-service-clock-desc"><title id="r4-service-clock-title">Warehouse recovery and usable service timeline</title><desc id="r4-service-clock-desc">Access is lost at 08:00. Restricted fallback begins at 08:15. Technical recovery ends at 11:00; verification and reconciliation end at 11:45. The stated four-hour recovery objective is 12:00. No monthly availability or response SLA is inferred.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Recovery and usable service end at different times</text><text x="24" y="68" font-size="18" fill="#63676a" font-weight="400">One fictional warehouse outage, on a common local clock</text><line x1="40.0" y1="165" x2="40.0" y2="322" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="40.0" y="112" font-size="17" fill="#63676a" font-weight="400" text-anchor="middle">08:00</text><line x1="82.0" y1="165" x2="82.0" y2="322" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="82.0" y="150" font-size="17" fill="#63676a" font-weight="400" text-anchor="middle">08:15</text><line x1="544.0" y1="165" x2="544.0" y2="322" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="544.0" y="112" font-size="17" fill="#63676a" font-weight="400" text-anchor="middle">11:00</text><line x1="670.0" y1="165" x2="670.0" y2="322" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="670.0" y="112" font-size="17" fill="#63676a" font-weight="400" text-anchor="middle">11:45</text><line x1="712.0" y1="165" x2="712.0" y2="322" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="712.0" y="150" font-size="17" fill="#63676a" font-weight="400" text-anchor="middle">12:00</text><rect x="40.0" y="185" width="503.99999999999994" height="32" rx="3" fill="#4e6879"/><text x="44" y="178" font-size="20" fill="#4e6879" font-weight="500">Technical recovery: 3 hours</text><rect x="544.0" y="185" width="125.99999999999999" height="32" rx="3" fill="#a94f35"/><text x="24" y="265" font-size="20" fill="#a94f35" font-weight="500">Reconcile and verify: 45 more minutes</text><line x1="82.0" y1="300" x2="670.0" y2="300" stroke="#272b2d" stroke-width="2"/><text x="24" y="355" font-size="18" fill="#63676a" font-weight="400">Restricted fallback runs from 08:15 during recovery.</text><text x="24" y="391" font-size="19" fill="#272b2d" font-weight="500">Normal digital processing resumes at 11:45.</text><text x="24" y="427" font-size="18" fill="#63676a" font-weight="400">The four-hour RTO ends at 12:00; no SLA is invented.</text></g></svg>
