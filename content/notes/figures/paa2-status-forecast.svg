<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="paa2-status-forecast-title paa2-status-forecast-desc"><title id="paa2-status-forecast-title">Remaining work gives a later finish</title><desc id="paa2-status-forecast-desc">At end day15, four validation days, two training days and one acceptance day imply finish22, versus baseline20. Cost forecast23000 versus budget20000.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Report the forecast alongside the original date</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional status at the end of working day 15</text><text x="24" y="111" font-size="18" fill="#272b2d" font-weight="400">Reported point</text><text x="24" y="181" font-size="18" fill="#272b2d" font-weight="400">Remaining work</text><rect x="205" y="87" width="330" height="30" rx="3" fill="#272b2d" stroke="#272b2d"/><text x="545" y="109" font-size="17" fill="#272b2d" font-weight="400">Day 15</text><rect x="535" y="158" width="86" height="31" rx="3" fill="#a94f35" stroke="#a94f35"/><text x="24" y="235" font-size="17" fill="#a94f35" font-weight="400">Validate: 4</text><rect x="623" y="158" width="42" height="31" rx="3" fill="#3c6475" stroke="#3c6475"/><text x="24" y="267" font-size="17" fill="#3c6475" font-weight="400">Train: 2</text><rect x="667" y="158" width="20" height="31" rx="3" fill="#63676a" stroke="#63676a"/><text x="24" y="283" font-size="17" fill="#63676a" font-weight="400">Accept: 1</text><line x1="645" y1="145" x2="645" y2="203" stroke="#a94f35" stroke-dasharray="4 4"/><text x="515" y="218" font-size="16" fill="#a94f35" font-weight="400">Baseline: day 20</text><text x="24" y="324" font-size="23" fill="#272b2d" font-weight="500">15 + 4 + 2 + 1 = finish on working day 22</text><text x="24" y="365" font-size="19" fill="#a94f35" font-weight="400">Baseline: day 20. Forecast: two working days late.</text><text x="24" y="405" font-size="18" fill="#272b2d" font-weight="400">Cost forecast: €12,000 spent + €11,000 remaining = €23,000.</text></g></svg>
