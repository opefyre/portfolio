<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 475" role="img" aria-labelledby="gap-rollout-calendar-title gap-rollout-calendar-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-rollout-calendar-title">The time between go-lives is work too</title><desc id="gap-rollout-calendar-desc">Both sites can switch in week six, or site A in week six and site B in week nine. The phased plan needs three weeks of controlled coexistence.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">The time between go-lives is work too</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><text x="210" y="105" font-size="18" fill="#62676a" text-anchor="middle">W5</text><line x1="210" y1="120" x2="210" y2="361" stroke="#bab8af" stroke-width="1"/><text x="283" y="105" font-size="18" fill="#62676a" text-anchor="middle">W6</text><line x1="283" y1="120" x2="283" y2="361" stroke="#bab8af" stroke-width="1"/><text x="356" y="105" font-size="18" fill="#62676a" text-anchor="middle">W7</text><line x1="356" y1="120" x2="356" y2="361" stroke="#bab8af" stroke-width="1"/><text x="429" y="105" font-size="18" fill="#62676a" text-anchor="middle">W8</text><line x1="429" y1="120" x2="429" y2="361" stroke="#bab8af" stroke-width="1"/><text x="502" y="105" font-size="18" fill="#62676a" text-anchor="middle">W9</text><line x1="502" y1="120" x2="502" y2="361" stroke="#bab8af" stroke-width="1"/><text x="575" y="105" font-size="18" fill="#62676a" text-anchor="middle">W10</text><line x1="575" y1="120" x2="575" y2="361" stroke="#bab8af" stroke-width="1"/><text x="18" y="164" font-size="19" fill="#24282b" text-anchor="start">Together / A and B</text><line x1="210" y1="158" x2="283" y2="158" stroke="#62676a" stroke-width="13"/><line x1="283" y1="158" x2="575" y2="158" stroke="#496778" stroke-width="13"/><circle cx="283" cy="158" r="7" fill="#a35736"/><text x="18" y="248" font-size="19" fill="#24282b" text-anchor="start">Phased / Site A</text><line x1="210" y1="242" x2="283" y2="242" stroke="#62676a" stroke-width="13"/><line x1="283" y1="242" x2="575" y2="242" stroke="#496778" stroke-width="13"/><circle cx="283" cy="242" r="7" fill="#a35736"/><text x="18" y="332" font-size="19" fill="#24282b" text-anchor="start">Phased / Site B</text><line x1="210" y1="326" x2="502" y2="326" stroke="#62676a" stroke-width="13"/><line x1="502" y1="326" x2="575" y2="326" stroke="#496778" stroke-width="13"/><circle cx="502" cy="326" r="7" fill="#a35736"/><rect x="283" y="372" width="219" height="34" rx="4" fill="#d6dfdf" stroke="#496778"/><text x="392.5" y="396" font-size="17" fill="#496778" text-anchor="middle">Three weeks of coexistence</text><text x="20" y="447" font-size="19" fill="#62676a" text-anchor="start">Grey: old service. Blue: new service. Copper: switch point.</text></svg>
