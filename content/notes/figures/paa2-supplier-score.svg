<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-labelledby="paa2-supplier-score-title paa2-supplier-score-desc"><title id="paa2-supplier-score-title">A passing average can hide a failed requirement</title><desc id="paa2-supplier-score-desc">Weighted total 94.34 passes 90, but quality 98.8 percent misses required 99.5 percent. Separate conditions, not interchangeable scores.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">One total, two separate conditions</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional quarterly supplier review</text><rect x="24" y="99" width="348" height="189" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="42" y="132" font-size="19" fill="#272b2d" font-weight="400">Weighted score</text><text x="42" y="184" font-size="34" fill="#3c6475" font-weight="500">94.34 / 100</text><text x="42" y="226" font-size="18" fill="#272b2d" font-weight="400">Overall target: 90</text><text x="42" y="263" font-size="19" fill="#3c6475" font-weight="500">Passes the total</text><rect x="388" y="99" width="348" height="189" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="406" y="132" font-size="19" fill="#272b2d" font-weight="400">Accepted quality</text><text x="406" y="184" font-size="34" fill="#a94f35" font-weight="500">98.8%</text><text x="406" y="226" font-size="18" fill="#272b2d" font-weight="400">Required: at least 99.5%</text><text x="406" y="263" font-size="19" fill="#a94f35" font-weight="500">Misses the requirement</text><text x="24" y="332" font-size="22" fill="#272b2d" font-weight="500">120 rejected pieces still need a decision.</text></g></svg>
