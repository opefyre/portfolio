<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="aici-kata-conversation-title aici-kata-conversation-desc"><title id="aici-kata-conversation-title">Give the coaching conversation a specific obstacle</title><desc id="aici-kata-conversation-desc">Existing fictional approval trial: the average falls from 24 to 16 hours, but corrections rise from five to ten percent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Give the coaching conversation a specific obstacle</text><rect x="24" y="105" width="327" height="180" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39" y="134" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Learner</text><text x="39" y="181" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Inspect current work, choose an</text><text x="39" y="205" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">obstacle and test a prediction</text><rect x="409" y="105" width="327" height="180" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="424" y="134" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Coach</text><text x="424" y="181" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Ask for evidence, expectations</text><text x="424" y="205" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">and the next review</text><line x1="358" y1="190" x2="402" y2="190" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="402" y1="220" x2="358" y2="220" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="345" font-size="21" fill="#252a2d" text-anchor="start" font-weight="400">Existing approval trial</text><text x="24" y="388" font-size="23" fill="#252a2d" text-anchor="start" font-weight="400">24 → 16 hours/request</text><text x="409" y="388" font-size="23" fill="#a35334" text-anchor="start" font-weight="400">5% → 10% returned</text><text x="24" y="435" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">The speed criterion is met. The correction-rate condition fails. Inspect</text><text x="24" y="459" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">the returned requests before choosing the next experiment.</text></g></svg>