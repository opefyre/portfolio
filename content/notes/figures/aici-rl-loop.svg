<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="aici-rl-loop-title aici-rl-loop-desc"><title id="aici-rl-loop-title">Specify the loop and its independent limits</title><desc id="aici-rl-loop-desc">Observations feed a policy. Actions affect the process. Constraints and fallback remain separate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Specify the loop and its independent limits</text><rect x="24" y="140" width="210" height="140" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39" y="169" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Process or</text><text x="39" y="193" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">simulator</text><text x="39" y="216" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Produces</text><text x="39" y="240" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">observations</text><rect x="280" y="140" width="210" height="140" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="295" y="169" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Policy</text><text x="295" y="216" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Chooses permitted</text><text x="295" y="240" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">action</text><line x1="237" y1="187" x2="272" y2="187" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="380" y1="285" x2="380" y2="320" stroke="#cbc6ba" stroke-width="1.5"/><line x1="380" y1="320" x2="127" y2="320" stroke="#cbc6ba" stroke-width="1.5"/><line x1="127" y1="320" x2="127" y2="286" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="284" y="355" font-size="17" fill="#62676a" text-anchor="middle" font-weight="400">Action and consequence</text><rect x="536" y="140" width="200" height="140" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="551" y="169" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Constraints</text><text x="551" y="216" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Limits and</text><text x="551" y="240" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">fallback</text><line x1="532" y1="210" x2="495" y2="210" stroke="#a35334" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="24" y="96" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Training also supplies a defined reward.</text><text x="24" y="405" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">A deployed fixed policy is different from continuing to update it online.</text></g></svg>