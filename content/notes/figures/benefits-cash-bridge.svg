<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" role="img" aria-label="Fictional monthly cash comparison. A 900 euro overtime reduction minus 700 euros of recurring system cost equals 200 euros of net benefit. The separate 6,300 euro capacity value overlaps and is not added. Upfront cost is included separately in the cumulative review."><style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.num{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.muted{fill:#5a5d60}.rust{fill:#b4532a}</style><text x="12" y="32" font-size="27" class="num">From gross benefit to net cash</text><text x="12" y="67" font-size="20" class="muted">Monthly amounts in euros</text><line x1="12" y1="90" x2="548" y2="90" stroke="#d6d3cb"/><text x="12" y="140" font-size="22" class="">Overtime expense reduction</text><text x="463" y="140" font-size="29" class="num">900</text><text x="12" y="195" font-size="22" class="">Recurring system cost</text><text x="449" y="195" font-size="29" class="num rust">−700</text><line x1="12" y1="223" x2="548" y2="223" stroke="#d6d3cb"/><text x="12" y="269" font-size="23" class="num">Net recurring cash benefit</text><text x="463" y="269" font-size="33" class="num">200</text><line x1="12" y1="309" x2="548" y2="309" stroke="#d6d3cb"/><text x="12" y="349" font-size="24" class="num">Capacity value: €6,300 / month</text><text x="12" y="383" font-size="20" class="muted">Shown separately. It is outside this cash sum.</text><text x="12" y="423" font-size="19" class="muted">Upfront cost is included in the cumulative review.</text></svg>