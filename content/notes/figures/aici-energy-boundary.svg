<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" role="img" aria-labelledby="aici-energy-boundary-title aici-energy-boundary-desc"><title id="aici-energy-boundary-title">Keep the energy and output boundaries aligned</title><desc id="aici-energy-boundary-desc">An energy measure needs a defined process boundary, period and output. Metered energy and the declared output share that boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Keep the energy and output boundaries aligned</text><rect x="206" y="100" width="356" height="246" rx="3" fill="#f6f3eb" stroke="#252a2d" stroke-width="1.2"/><text x="384" y="143" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">Declared process boundary</text><text x="384" y="206" font-size="18" fill="#252a2d" text-anchor="middle" font-weight="400">Equipment and included loads</text><text x="384" y="253" font-size="18" fill="#62676a" text-anchor="middle" font-weight="400">One consistent reporting period</text><text x="24" y="190" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Metered energy</text><line x1="25" y1="220" x2="197" y2="220" stroke="#3c6475" stroke-width="1.5" marker-end="url(#arrow)"/><text x="575" y="190" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Declared output</text><line x1="568" y1="220" x2="730" y2="220" stroke="#a35334" stroke-width="1.5" marker-end="url(#arrow)"/><text x="384" y="316" font-size="17" fill="#62676a" text-anchor="middle" font-weight="400">Retain rejected and reworked production.</text><text x="24" y="399" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Energy intensity = scoped energy ÷ stated productive output</text><text x="24" y="438" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Normalisation may also need mix, weather, hours or other relevant operating</text><text x="24" y="462" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">variables.</text></g></svg>