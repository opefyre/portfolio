<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 374" role="img" aria-labelledby="robot-title robot-desc"><title id="robot-title">Who completes the 300,000 placements?</title><desc id="robot-desc">Fictional annual workload shown as ten equal blocks of 30,000 placements. The humanoid completes nine blocks, or 270,000 placements. People complete the remaining 30,000. Capacity is 4,000 hours times 75 percent cycling time times 90 accepted placements per cycling hour.</desc><g font-family="inherit" fill="#0f1011"><text x="0" y="30" font-size="26" font-weight="500">Who covers the year's work?</text><text x="0" y="64" font-size="18" fill="#62676a">300,000 acceptable placements required</text><path d="M0 85H480" stroke="#cbc8bf"/><g fill="#101213"><rect x="0" y="117" width="42" height="64" rx="2"/><rect x="48" y="117" width="42" height="64" rx="2"/><rect x="96" y="117" width="42" height="64" rx="2"/><rect x="144" y="117" width="42" height="64" rx="2"/><rect x="192" y="117" width="42" height="64" rx="2"/><rect x="240" y="117" width="42" height="64" rx="2"/><rect x="288" y="117" width="42" height="64" rx="2"/><rect x="336" y="117" width="42" height="64" rx="2"/><rect x="384" y="117" width="42" height="64" rx="2"/></g><rect x="432" y="117" width="42" height="64" rx="2" fill="#b4532a"/><path d="M0 194v9h426v-9M453 194v43h-94" fill="none" stroke="#767b7f"/><text x="0" y="238" font-size="22">270,000 by robot</text><text x="359" y="268" text-anchor="end" font-size="22" fill="#b4532a">30,000 by people</text><path d="M0 291H480" stroke="#cbc8bf"/><text x="0" y="328" font-size="20">4,000 h × 75% × 90 placements/h</text><text x="0" y="363" font-size="17" fill="#62676a">Each block represents 30,000 placements.</text></g></svg>
