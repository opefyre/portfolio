<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" role="img" aria-labelledby="paa3-continuity-timeline-title paa3-continuity-timeline-desc"><title id="paa3-continuity-timeline-title">Business fallback and technical recovery timeline</title><desc id="paa3-continuity-timeline-desc">Fictional outage at 08:00, approved fallback at 08:15, alternate-site restoration at 11:00, verified normal processing at 11:45. Four-hour RTO is noon, RPO fifteen minutes and last recoverable data 07:50.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Restored software still needs reconciled work</text><line x1="90" y1="110" x2="90" y2="280" stroke="#cec9bd" stroke-width="1"/><text x="90" y="307" font-size="17" fill="#62676a" text-anchor="middle" font-weight="400">08:00</text><line x1="240" y1="110" x2="240" y2="280" stroke="#cec9bd" stroke-width="1"/><text x="240" y="307" font-size="17" fill="#62676a" text-anchor="middle" font-weight="400">09:00</text><line x1="390" y1="110" x2="390" y2="280" stroke="#cec9bd" stroke-width="1"/><text x="390" y="307" font-size="17" fill="#62676a" text-anchor="middle" font-weight="400">10:00</text><line x1="540" y1="110" x2="540" y2="280" stroke="#cec9bd" stroke-width="1"/><text x="540" y="307" font-size="17" fill="#62676a" text-anchor="middle" font-weight="400">11:00</text><line x1="690" y1="110" x2="690" y2="280" stroke="#cec9bd" stroke-width="1"/><text x="690" y="307" font-size="17" fill="#62676a" text-anchor="middle" font-weight="400">12:00</text><rect x="127.5" y="126" width="525.0" height="42" fill="#d8dad3" stroke="#cec9bd"/><text x="139.5" y="154" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Approved fallback work</text><rect x="540" y="216" width="112.5" height="42" fill="#3c6475" stroke="#3c6475"/><text x="24" y="245" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Reconcile</text><circle cx="90" cy="119" r="5" fill="#252a2d"/><text x="90" y="103" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">Outage 08:00</text><circle cx="127.5" cy="273" r="5" fill="#252a2d"/><text x="127.5" y="346" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Fallback 08:15</text><circle cx="540" cy="216" r="5" fill="#252a2d"/><text x="540" y="191" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">Restore 11:00</text><circle cx="652.5" cy="273" r="5" fill="#3c6475"/><text x="652.5" y="346" font-size="17" fill="#3c6475" text-anchor="end" font-weight="400">Normal 11:45</text><line x1="690" y1="100" x2="690" y2="280" stroke="#a94f35" stroke-width="2" stroke-dasharray="5 4"/><text x="736" y="82" font-size="18" fill="#a94f35" text-anchor="end" font-weight="400">RTO 12:00</text><line x1="24" y1="379" x2="736" y2="379" stroke="#cec9bd" stroke-width="1"/><text x="24" y="423" font-size="22" fill="#252a2d" text-anchor="start" font-weight="500">RPO: 15 minutes</text><text x="24" y="460" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">Last recoverable point 07:50: ten minutes before outage.</text><text x="24" y="501" font-size="20" fill="#3c6475" text-anchor="start" font-weight="400">Normal service: 3 h 45 min after outage, including checks.</text></g></svg>
