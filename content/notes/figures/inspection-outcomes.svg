<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" role="img" aria-label="Fictional 10000-part pilot. 95 defects correctly flagged, 5 defects missed, 198 good parts falsely flagged and 9702 good parts passed. 293 reviews, including 95 real defects."><style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.plot-number{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.plot-muted{fill:#5a5d60}.plot-rust{fill:#b4532a}</style><text x="12" y="31" font-size="27" class="plot-number">10,000 parts. Four outcomes.</text><text x="12" y="65" font-size="20" class="plot-muted">100 defective parts; 9,900 good parts</text><text x="294" y="112" font-size="21" text-anchor="middle">Flagged</text><text x="466" y="112" font-size="21" text-anchor="middle">Passed</text><text x="12" y="180" font-size="19" class="plot-muted">Actually</text><text x="12" y="207" font-size="21" >defective</text><text x="12" y="318" font-size="19" class="plot-muted">Actually</text><text x="12" y="345" font-size="21" >good</text><rect x="206" y="129" width="171" height="128" fill="#e2dfd6"/><rect x="378" y="129" width="170" height="128" fill="#ecdcd3"/><rect x="206" y="267" width="171" height="128" fill="#ecdcd3"/><rect x="378" y="267" width="170" height="128" fill="#e2dfd6"/><text x="292" y="190" font-size="43" text-anchor="middle" class="plot-number">95</text><text x="292" y="226" font-size="19" text-anchor="middle">caught</text><text x="463" y="190" font-size="43" text-anchor="middle" class="plot-number plot-rust">5</text><text x="463" y="226" font-size="18" text-anchor="middle">missed defects</text><text x="292" y="330" font-size="43" text-anchor="middle" class="plot-number plot-rust">198</text><text x="292" y="366" font-size="19" text-anchor="middle">false alarms</text><text x="463" y="330" font-size="39" text-anchor="middle" class="plot-number">9,702</text><text x="463" y="366" font-size="18" text-anchor="middle">correct passes</text><line x1="12" y1="426" x2="548" y2="426" stroke="#d6d3cb" stroke-width="1"/><text x="12" y="465" font-size="25" class="plot-number">293 parts flagged for review</text><text x="12" y="499" font-size="21" class="plot-muted">95 of those 293 have a defect.</text></svg>