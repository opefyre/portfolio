<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 485" role="img" aria-labelledby="rtm-impact-title rtm-impact-desc" font-family="var(--font-funnel-display), Arial, sans-serif">
<title id="rtm-impact-title">Trace a proposed R02 change before approving it</title>
<desc id="rtm-impact-desc">A fictional proposal to permit some supervisor hold overrides must be traced into roles and permissions, dispatch controls, messages and history, and tests and evidence. The proposal is not yet approved. Earlier results remain attached to the earlier build and rule.</desc>
<text x="12" y="36" font-size="30" fill="#26282a">Where would R02 change?</text>
<line x1="12" y1="58" x2="508" y2="58" stroke="#bab8af"/>
<rect x="82" y="84" width="356" height="91" rx="6" fill="#26282a"/>
<text x="260" y="119" font-size="25" fill="#eeece5" text-anchor="middle">Proposed hold override</text>
<text x="260" y="152" font-size="21" fill="#eeece5" text-anchor="middle">R02 amendment, not yet approved</text>
<path d="M260 175V201H131V224 M260 201H389V224 M260 201V322H131V333 M260 322H389V333" stroke="#a35736" stroke-width="2" fill="none"/>
<g fill="#a35736"><circle cx="131" cy="231" r="6"/><circle cx="389" cy="231" r="6"/><circle cx="131" cy="340" r="6"/><circle cx="389" cy="340" r="6"/></g>
<text x="131" y="265" font-size="24" fill="#26282a" text-anchor="middle">Roles and</text><text x="131" y="294" font-size="24" fill="#26282a" text-anchor="middle">permissions</text>
<text x="389" y="265" font-size="24" fill="#26282a" text-anchor="middle">Dispatch</text><text x="389" y="294" font-size="24" fill="#26282a" text-anchor="middle">control</text>
<text x="131" y="374" font-size="24" fill="#26282a" text-anchor="middle">Messages and</text><text x="131" y="403" font-size="24" fill="#26282a" text-anchor="middle">history</text>
<text x="389" y="374" font-size="24" fill="#26282a" text-anchor="middle">Tests and</text><text x="389" y="403" font-size="24" fill="#26282a" text-anchor="middle">evidence</text>
<line x1="12" y1="439" x2="508" y2="439" stroke="#bab8af"/>
<text x="12" y="469" font-size="20" fill="#62676a">Keep old results with the old build and rule.</text>
</svg>
