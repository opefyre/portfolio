<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-system-events-title gap-system-events-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-system-events-title">One delivery has several distinct states</title><desc id="gap-system-events-desc">ERP handles the order, WMS the warehouse work and TMS the transport. The warehouse dispatch and carrier tracking events reach systems at different times.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">One delivery has several distinct states</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><rect x="22" y="116" width="212" height="128" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="128" y="153" font-size="29" fill="#24282b" text-anchor="middle">ERP</text><text x="128" y="190" font-size="18" fill="#62676a" text-anchor="middle">Order and allocation</text><text x="128" y="219" font-size="18" fill="#62676a" text-anchor="middle">40 units reserved</text><line x1="236" y1="179" x2="272" y2="179" stroke="#a35736" stroke-width="3"/><rect x="274" y="116" width="212" height="128" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="380" y="153" font-size="29" fill="#24282b" text-anchor="middle">WMS</text><text x="380" y="190" font-size="18" fill="#62676a" text-anchor="middle">Pick and dispatch</text><text x="380" y="219" font-size="18" fill="#62676a" text-anchor="middle">40 picked ≠ delivered</text><line x1="488" y1="179" x2="524" y2="179" stroke="#a35736" stroke-width="3"/><rect x="526" y="116" width="212" height="128" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="632" y="153" font-size="29" fill="#24282b" text-anchor="middle">TMS</text><text x="632" y="190" font-size="18" fill="#62676a" text-anchor="middle">Carrier and delivery</text><text x="632" y="219" font-size="18" fill="#62676a" text-anchor="middle">Track the shipment</text><line x1="52" y1="326" x2="710" y2="326" stroke="#496778" stroke-width="2"/><circle cx="100" cy="326" r="7" fill="#496778"/><text x="100" y="300" font-size="20" fill="#496778" text-anchor="middle">14:05</text><text x="100" y="365" font-size="17" fill="#24282b" text-anchor="middle">Physical dispatch</text><circle cx="380" cy="326" r="7" fill="#496778"/><text x="380" y="300" font-size="20" fill="#496778" text-anchor="middle">14:06</text><text x="380" y="365" font-size="17" fill="#24282b" text-anchor="middle">ERP confirmation</text><circle cx="650" cy="326" r="7" fill="#496778"/><text x="650" y="300" font-size="20" fill="#496778" text-anchor="middle">14:20</text><text x="650" y="365" font-size="17" fill="#24282b" text-anchor="middle">Carrier event in TMS</text><text x="20" y="419" font-size="20" fill="#62676a" text-anchor="start">Source, event time and processing state explain the difference.</text></svg>
