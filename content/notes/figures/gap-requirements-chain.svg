<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-requirements-chain-title gap-requirements-chain-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-requirements-chain-title">Discover the need before specifying the screen</title><desc id="gap-requirements-chain-desc">The request becomes an observed task, an agreed requirement and an acceptance check, with sources and owners retained.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Discover the need before specifying the screen</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><circle cx="43" cy="123" r="10" fill="#a35736"/><text x="72" y="120" font-size="24" fill="#24282b" text-anchor="start">Request</text><text x="72" y="153" font-size="20" fill="#62676a" text-anchor="start">“We need a faster dispatch dashboard.”</text><circle cx="43" cy="227" r="10" fill="#a35736"/><text x="72" y="224" font-size="24" fill="#24282b" text-anchor="start">Observed need</text><text x="72" y="257" font-size="20" fill="#62676a" text-anchor="start">People search three screens and phone stores.</text><circle cx="43" cy="331" r="10" fill="#a35736"/><text x="72" y="328" font-size="24" fill="#24282b" text-anchor="start">Requirement and check</text><text x="72" y="361" font-size="20" fill="#62676a" text-anchor="start">Show lot status; block stale-data confirmation.</text><line x1="43" y1="134" x2="43" y2="208" stroke="#a35736" stroke-width="2"/><line x1="43" y1="238" x2="43" y2="312" stroke="#a35736" stroke-width="2"/><text x="25" y="423" font-size="20" fill="#24282b" text-anchor="start">Keep the source, owner and decision attached to the wording.</text></svg>
