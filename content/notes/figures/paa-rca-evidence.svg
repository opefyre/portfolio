<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="paa-rca-evidence-title paa-rca-evidence-desc"><title id="paa-rca-evidence-title">Evidence from the event to the follow-up</title><desc id="paa-rca-evidence-desc">Fictional same-day timestamps. Picking finished at 14:00 before the 16:00 cutoff; release was at 16:20. The explanation remains subject to evidence and testing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">MISSED COLLECTION / RECONSTRUCT THE EVENT</text><line x1="80" y1="128" x2="690" y2="128" stroke="#101213" stroke-width="2"/><circle cx="90" cy="128" r="6" fill="#101213"/><text x="90" y="93" font-size="20" fill="#101213" text-anchor="middle">14:00</text><circle cx="600" cy="128" r="6" fill="#101213"/><text x="600" y="93" font-size="20" fill="#101213" text-anchor="middle">16:00</text><circle cx="685" cy="128" r="6" fill="#b4532a"/><text x="685" y="93" font-size="20" fill="#101213" text-anchor="middle">16:20</text><text x="90" y="169" font-size="17" fill="#5a5d60" text-anchor="middle">Pick complete</text><text x="560" y="199" font-size="17" fill="#5a5d60" text-anchor="middle">Collection cutoff</text><text x="685" y="169" font-size="17" fill="#5a5d60" text-anchor="middle">Released</text><line x1="600" y1="135" x2="560" y2="178" stroke="#c7c2b8" stroke-width="2"/><text x="24" y="225" font-size="22" fill="#101213" text-anchor="start">This order was picked before cutoff.</text><text x="24" y="257" font-size="19" fill="#b4532a" text-anchor="start">Check the release queue, cover and authority.</text><line x1="24" y1="288" x2="736" y2="288" stroke="#c7c2b8" stroke-width="2"/><rect x="24" y="317" width="220" height="109" rx="4" fill="none" stroke="#c7c2b8"/><text x="40" y="347" font-size="19" fill="#101213" text-anchor="start">Explanation</text><text x="40" y="378" font-size="15" fill="#5a5d60" text-anchor="start">No authorised cover</text><text x="40" y="400" font-size="15" fill="#5a5d60" text-anchor="start">when approver absent</text><rect x="270" y="317" width="220" height="109" rx="4" fill="none" stroke="#c7c2b8"/><text x="286" y="347" font-size="19" fill="#101213" text-anchor="start">Proposed action</text><text x="286" y="378" font-size="15" fill="#5a5d60" text-anchor="start">Named cover</text><text x="286" y="400" font-size="15" fill="#5a5d60" text-anchor="start">and timely escalation</text><rect x="516" y="317" width="220" height="109" rx="4" fill="none" stroke="#c7c2b8"/><text x="532" y="347" font-size="19" fill="#101213" text-anchor="start">Effectiveness</text><text x="532" y="378" font-size="15" fill="#5a5d60" text-anchor="start">Review comparable</text><text x="532" y="400" font-size="15" fill="#5a5d60" text-anchor="start">orders and exceptions</text></svg>
