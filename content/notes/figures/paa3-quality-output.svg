<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" role="img" aria-labelledby="paa3-quality-output-title paa3-quality-output-desc"><title id="paa3-quality-output-title">Gross output versus accepted output</title><desc id="paa3-quality-output-desc">One hundred cartons processed, twenty-five fail labels, seventy-five accepted in one hour. Accepted output is below the eighty-carton requirement.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">The requirement is good output</text><text x="24" y="70" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Fictional one-hour trial / one carton format</text><text x="24" y="153" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Processed</text><rect x="140" y="128" width="580.0" height="42" fill="#b6b3aa" stroke="#b6b3aa"/><text x="710.0" y="157" font-size="22" fill="#fff" text-anchor="end" font-weight="400">100</text><text x="24" y="263" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Accepted</text><rect x="140" y="238" width="435.0" height="42" fill="#252a2d" stroke="#252a2d"/><text x="583.0" y="267" font-size="22" fill="#252a2d" text-anchor="start" font-weight="400">75</text><line x1="604.0" y1="108" x2="604.0" y2="308" stroke="#a94f35" stroke-width="2" stroke-dasharray="5 4"/><text x="604.0" y="98" font-size="18" fill="#a94f35" text-anchor="middle" font-weight="400">80 required</text><text x="140.0" y="333" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">0</text><text x="285.0" y="333" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">25</text><text x="430.0" y="333" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">50</text><text x="575.0" y="333" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">75</text><text x="720.0" y="333" font-size="15" fill="#62676a" text-anchor="middle" font-weight="400">100</text><text x="24" y="385" font-size="22" fill="#a94f35" text-anchor="start" font-weight="500">25 wrong labels leave 75 accepted cartons, below 80.</text><text x="720" y="365" font-size="17" fill="#62676a" text-anchor="end" font-weight="400">Cartons per hour</text></g></svg>
