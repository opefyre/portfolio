<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 459" role="img" aria-labelledby="paa2-bpm-handoffs-title paa2-bpm-handoffs-desc"><title id="paa2-bpm-handoffs-title">Supplier onboarding crosses three teams</title><desc id="paa2-bpm-handoffs-desc">Purchasing completes day1, Finance day3, IT day6. Completion milestones are not effort durations. A process owner follows the whole route.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">A handoff is not the end of the whole process</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional complete supplier request to ready-to-transact record</text><path d="M24 90H736" stroke="#cec9bd"/><text x="24" y="122" font-size="20" fill="#272b2d" font-weight="500">Purchasing</text><text x="266" y="122" font-size="18" fill="#272b2d" font-weight="400">Commercial details complete</text><text x="646" y="122" font-size="18" fill="#a94f35" font-weight="400">Day 1</text><text x="266" y="154" font-size="16" fill="#63676a" font-weight="400">Completion milestone, not labour hours</text><path d="M24 186H736" stroke="#cec9bd"/><text x="24" y="218" font-size="20" fill="#272b2d" font-weight="500">Finance</text><text x="266" y="218" font-size="18" fill="#272b2d" font-weight="400">Payment checks complete</text><text x="646" y="218" font-size="18" fill="#a94f35" font-weight="400">Day 3</text><text x="266" y="250" font-size="16" fill="#63676a" font-weight="400">Completion milestone, not labour hours</text><path d="M24 282H736" stroke="#cec9bd"/><text x="24" y="314" font-size="20" fill="#272b2d" font-weight="500">IT / system team</text><text x="266" y="314" font-size="18" fill="#272b2d" font-weight="400">Record ready for transactions</text><text x="646" y="314" font-size="18" fill="#a94f35" font-weight="400">Day 6</text><text x="266" y="346" font-size="16" fill="#63676a" font-weight="400">Completion milestone, not labour hours</text><text x="24" y="428" font-size="20" fill="#272b2d" font-weight="500">Process owner follows the request across all three teams.</text></g></svg>
