<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 317" role="img" aria-labelledby="aici-learning-targets-title aici-learning-targets-desc"><title id="aici-learning-targets-title">The target changes the learning task</title><desc id="aici-learning-targets-desc">Supervised training uses targets. Unsupervised structure requires interpretation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">The target changes the learning task</text><text x="24" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Training evidence</text><text x="276" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Output</text><text x="522" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Validation</text><line x1="24" y1="103" x2="736" y2="103" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Inputs with verified</text><text x="24" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">targets</text><text x="276" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Predict a defined</text><text x="276" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">class or value</text><text x="522" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Evaluate on unseen</text><text x="522" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">labelled records</text><line x1="24" y1="194" x2="736" y2="194" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Inputs without that</text><text x="24" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">target</text><text x="276" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Find groups or</text><text x="276" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">representations</text><text x="522" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Check meaning and</text><text x="522" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">usefulness</text></g></svg>