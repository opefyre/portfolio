<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="r4-baseline-forecast-title r4-baseline-forecast-desc"><title id="r4-baseline-forecast-title">A day-20 baseline and day-22 forecast</title><desc id="r4-baseline-forecast-desc">At the end of day 15, four days of validation, two of training and one of acceptance remain sequentially. The approved finish is day 20; the current forecast is day 22. No work-completion percentage is shown.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="26" fill="#272b2d" font-weight="500">Approved finish and current forecast</text><text x="24" y="68" font-size="18" fill="#63676a" font-weight="400">One report at the end of working day 15</text><line x1="100" y1="95" x2="100" y2="335" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="100" y="366" font-size="16" fill="#63676a" font-weight="400" text-anchor="middle">0</text><line x1="230" y1="95" x2="230" y2="335" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="230" y="366" font-size="16" fill="#63676a" font-weight="400" text-anchor="middle">5</text><line x1="360" y1="95" x2="360" y2="335" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="360" y="366" font-size="16" fill="#63676a" font-weight="400" text-anchor="middle">10</text><line x1="490" y1="95" x2="490" y2="335" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="490" y="366" font-size="16" fill="#63676a" font-weight="400" text-anchor="middle">15</text><line x1="620" y1="95" x2="620" y2="335" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="620" y="366" font-size="16" fill="#63676a" font-weight="400" text-anchor="middle">20</text><line x1="672" y1="95" x2="672" y2="335" stroke="#ccc7bd" stroke-width="2" stroke-dasharray="5 5"/><text x="672" y="366" font-size="16" fill="#63676a" font-weight="400" text-anchor="middle">22</text><text x="24" y="395" font-size="17" fill="#63676a" font-weight="400">Working day</text><text x="24" y="128" font-size="19" fill="#272b2d" font-weight="400">Approved plan</text><line x1="100" y1="158" x2="620" y2="158" stroke="#272b2d" stroke-width="2"/><rect x="617" y="142" width="6" height="32" rx="3" fill="#a94f35"/><text x="620" y="124" font-size="19" fill="#a94f35" font-weight="500" text-anchor="middle">Day 20</text><text x="24" y="217" font-size="19" fill="#272b2d" font-weight="400">Current remaining work</text><text x="482" y="307" font-size="17" fill="#63676a" font-weight="400" text-anchor="end">Report: day 15</text><rect x="490" y="238" width="104" height="28" rx="3" fill="#4e6879"/><rect x="594" y="238" width="52" height="28" rx="3" fill="#a94f35"/><rect x="646" y="238" width="26" height="28" rx="3" fill="#272b2d"/><text x="679" y="285" font-size="19" fill="#a94f35" font-weight="500" text-anchor="middle">Day 22</text><line x1="490" y1="223" x2="490" y2="290" stroke="#63676a" stroke-width="2" stroke-dasharray="5 5"/><rect x="24" y="430" width="12" height="12" rx="3" fill="#4e6879"/><text x="44" y="442" font-size="17" fill="#272b2d" font-weight="400">Validation: 4 days</text><rect x="264" y="430" width="12" height="12" rx="3" fill="#a94f35"/><text x="284" y="442" font-size="17" fill="#272b2d" font-weight="400">Training: 2 days</text><rect x="504" y="430" width="12" height="12" rx="3" fill="#272b2d"/><text x="524" y="442" font-size="17" fill="#272b2d" font-weight="400">Acceptance: 1 day</text><text x="24" y="482" font-size="17" fill="#63676a" font-weight="400">Elapsed time is not a claim that all work before day 15 is accepted.</text></g></svg>
