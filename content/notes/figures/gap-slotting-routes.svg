<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-slotting-routes-title gap-slotting-routes-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-slotting-routes-title">Count both journeys</title><desc id="gap-slotting-routes-desc">The small pick face is nearer dispatch but has a longer replenishment route and needs six replenishment loads rather than two.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Count both journeys</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><rect x="28" y="109" width="150" height="170" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="103" y="150" font-size="24" fill="#24282b" text-anchor="middle">Reserve</text><text x="103" y="179" font-size="24" fill="#24282b" text-anchor="middle">stock</text><rect x="300" y="100" width="145" height="80" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="372" y="132" font-size="21" fill="#24282b" text-anchor="middle">Large face</text><text x="372" y="159" font-size="18" fill="#62676a" text-anchor="middle">60 cases</text><rect x="530" y="100" width="145" height="80" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="602" y="132" font-size="21" fill="#24282b" text-anchor="middle">Small face</text><text x="602" y="159" font-size="18" fill="#62676a" text-anchor="middle">20 cases</text><rect x="530" y="292" width="145" height="58" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="602" y="329" font-size="21" fill="#24282b" text-anchor="middle">Dispatch</text><path d="M178 140 H300" fill="none" stroke="#496778" stroke-width="2"/><text x="220" y="126" font-size="17" fill="#496778" text-anchor="middle">80 m</text><path d="M178 230 H490 V140 H530" fill="none" stroke="#496778" stroke-width="2"/><text x="330" y="218" font-size="17" fill="#496778" text-anchor="start">300 m replenishment</text><path d="M372 180 V320 H530" fill="none" stroke="#a35736" stroke-width="2"/><text x="385" y="292" font-size="17" fill="#a35736" text-anchor="start">40 m pick</text><path d="M660 180 V292" fill="none" stroke="#a35736" stroke-width="2"/><text x="678" y="244" font-size="17" fill="#a35736" text-anchor="start">20 m</text><text x="25" y="391" font-size="19" fill="#62676a" text-anchor="start">Complete routes, including returns. Schematic is not to scale.</text><text x="25" y="421" font-size="23" fill="#24282b" text-anchor="start">Large face: 2,560 m/day. Small face: 3,000 m/day.</text></svg>
