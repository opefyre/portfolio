<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 747" role="img" aria-label="Fictional run sequences over three working days. Current: four runs of 300 units and four 45-minute changes. Proposed: three cycles of four runs of 100 units and twelve 15-minute changes. Both produce 1,200 units with 180 setup minutes. Boxes show sequence, not duration."><style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.num{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.muted{fill:#5a5d60}.rust{fill:#b4532a}</style><text x="12" y="32" font-size="27" class="num">Same output. More frequent runs.</text><text x="12" y="68" font-size="20" class="muted">Both schedules cover three working days.</text><line x1="12" y1="89" x2="548" y2="89" stroke="#d6d3cb"/><text x="12" y="130" font-size="18" class="muted">CURRENT: ONE THREE-DAY CYCLE</text><rect x="12" y="153" width="125" height="61" fill="#e2dfd6"/><text x="26" y="177" font-size="19" class="num">A</text><text x="26" y="202" font-size="19" class="">300 units</text><rect x="149" y="153" width="125" height="61" fill="#e2dfd6"/><text x="163" y="177" font-size="19" class="num">B</text><text x="163" y="202" font-size="19" class="">300 units</text><rect x="286" y="153" width="125" height="61" fill="#e2dfd6"/><text x="300" y="177" font-size="19" class="num">C</text><text x="300" y="202" font-size="19" class="">300 units</text><rect x="423" y="153" width="125" height="61" fill="#e2dfd6"/><text x="437" y="177" font-size="19" class="num">D</text><text x="437" y="202" font-size="19" class="">300 units</text><text x="12" y="249" font-size="22" class="num">4 changes × 45 min = 180 setup min</text><line x1="12" y1="278" x2="548" y2="278" stroke="#d6d3cb"/><text x="12" y="317" font-size="18" class="rust">PROPOSED: THREE DAILY CYCLES</text><rect x="12" y="341" width="125" height="61" fill="#e2dfd6"/><text x="26" y="365" font-size="19" class="num">A</text><text x="26" y="390" font-size="19" class="">100 units</text><rect x="149" y="341" width="125" height="61" fill="#e2dfd6"/><text x="163" y="365" font-size="19" class="num">B</text><text x="163" y="390" font-size="19" class="">100 units</text><rect x="286" y="341" width="125" height="61" fill="#e2dfd6"/><text x="300" y="365" font-size="19" class="num">C</text><text x="300" y="390" font-size="19" class="">100 units</text><rect x="423" y="341" width="125" height="61" fill="#e2dfd6"/><text x="437" y="365" font-size="19" class="num">D</text><text x="437" y="390" font-size="19" class="">100 units</text><rect x="12" y="415" width="125" height="61" fill="#e2dfd6"/><text x="26" y="439" font-size="19" class="num">A</text><text x="26" y="464" font-size="19" class="">100 units</text><rect x="149" y="415" width="125" height="61" fill="#e2dfd6"/><text x="163" y="439" font-size="19" class="num">B</text><text x="163" y="464" font-size="19" class="">100 units</text><rect x="286" y="415" width="125" height="61" fill="#e2dfd6"/><text x="300" y="439" font-size="19" class="num">C</text><text x="300" y="464" font-size="19" class="">100 units</text><rect x="423" y="415" width="125" height="61" fill="#e2dfd6"/><text x="437" y="439" font-size="19" class="num">D</text><text x="437" y="464" font-size="19" class="">100 units</text><rect x="12" y="489" width="125" height="61" fill="#e2dfd6"/><text x="26" y="513" font-size="19" class="num">A</text><text x="26" y="538" font-size="19" class="">100 units</text><rect x="149" y="489" width="125" height="61" fill="#e2dfd6"/><text x="163" y="513" font-size="19" class="num">B</text><text x="163" y="538" font-size="19" class="">100 units</text><rect x="286" y="489" width="125" height="61" fill="#e2dfd6"/><text x="300" y="513" font-size="19" class="num">C</text><text x="300" y="538" font-size="19" class="">100 units</text><rect x="423" y="489" width="125" height="61" fill="#e2dfd6"/><text x="437" y="513" font-size="19" class="num">D</text><text x="437" y="538" font-size="19" class="">100 units</text><text x="12" y="588" font-size="22" class="num rust">12 changes × 15 min = 180 setup min</text><line x1="12" y1="615" x2="548" y2="615" stroke="#d6d3cb"/><text x="12" y="652" font-size="23" class="num">Both: 1,200 units + 180 setup minutes</text><text x="12" y="688" font-size="18" class="muted">Count the return change from D to A in each cycle.</text><text x="12" y="721" font-size="19" class="muted">Run sequence shown, not a time scale.</text></svg>