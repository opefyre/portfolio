<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="aici-model-lifecycle-title aici-model-lifecycle-desc"><title id="aici-model-lifecycle-title">Retain a release that someone can reproduce</title><desc id="aici-model-lifecycle-desc">Inputs, release evidence, monitoring and rollback are continuing responsibilities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Retain a release that someone can reproduce</text><text x="24.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">01</text><rect x="24.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Define</text><text x="39.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Inputs and</text><text x="39.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">target meaning</text><line x1="187.0" y1="185" x2="204.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="208.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">02</text><rect x="208.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="223.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Validate</text><text x="223.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Independent</text><text x="223.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">evaluation</text><line x1="371.0" y1="185" x2="388.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="392.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">03</text><rect x="392.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="407.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Release</text><text x="407.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Version and</text><text x="407.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">approval</text><line x1="555.0" y1="185" x2="572.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="576.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">04</text><rect x="576.0" y="103" width="160.0" height="166" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="591.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Monitor</text><text x="591.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Service and</text><text x="591.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">outcomes</text><line x1="700" y1="270" x2="700" y2="317" stroke="#cbc6ba" stroke-width="1.5"/><line x1="700" y1="317" x2="65" y2="317" stroke="#cbc6ba" stroke-width="1.5"/><line x1="65" y1="317" x2="65" y2="277" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="365" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">An approved change returns through validation. Check that the fallback</text><text x="24" y="389" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">and its dependencies still work.</text></g></svg>