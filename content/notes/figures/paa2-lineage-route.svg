<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" role="img" aria-labelledby="paa2-lineage-route-title paa2-lineage-route-desc"><title id="paa2-lineage-route-title">Lineage of pickable quantity</title><desc id="paa2-lineage-route-desc">Physical100 less held20 less separately allocated30 yields50 under rulev2. Oldv1reported70. Report and export are documented consumers; manual sheet route unverified.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Trace the number back to fields and a rule</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional item A, location L1. All inputs have the same 09:00 snapshot.</text><rect x="24" y="100" width="232" height="82" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="38" y="130" font-size="18" fill="#272b2d" font-weight="400">Physical</text><text x="38" y="165" font-size="26" fill="#272b2d" font-weight="500">100</text><rect x="264" y="100" width="232" height="82" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="278" y="130" font-size="18" fill="#272b2d" font-weight="400">Held</text><text x="278" y="165" font-size="26" fill="#272b2d" font-weight="500">20</text><rect x="504" y="100" width="232" height="82" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="518" y="130" font-size="18" fill="#272b2d" font-weight="400">Allocated</text><text x="518" y="165" font-size="26" fill="#272b2d" font-weight="500">30</text><text x="24" y="229" font-size="24" fill="#3c6475" font-weight="500">Version 2: 100 − 20 − 30 = 50 pickable pieces</text><text x="24" y="267" font-size="18" fill="#a94f35" font-weight="400">Old version 1 omitted the hold: 100 − 30 = 70</text><rect x="24" y="312" width="348" height="60" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="40" y="349" font-size="20" fill="#272b2d" font-weight="400">Order-promise report</text><rect x="388" y="312" width="348" height="60" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="404" y="349" font-size="20" fill="#272b2d" font-weight="400">Planning export</text><text x="24" y="410" font-size="18" fill="#3c6475" font-weight="400">Two documented consumers</text><rect x="24" y="441" width="712" height="58" rx="3" fill="none" stroke="#63676a" stroke-dasharray="5 4"/><text x="40" y="477" font-size="20" fill="#63676a" font-weight="400">Manual priority sheet: route not yet verified</text></g></svg>
