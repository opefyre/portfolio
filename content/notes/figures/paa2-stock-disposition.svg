<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" role="img" aria-labelledby="paa2-stock-disposition-title paa2-stock-disposition-desc"><title id="paa2-stock-disposition-title">Three stock reviews</title><desc id="paa2-stock-disposition-desc">Repair seal may be a critical spare, old packaging has 400 potential excess units under its forecast, superseded controller needs resale or disposal assessment.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Old stock can need three different decisions</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional review cases. Age starts the investigation.</text><path d="M24 90H736" stroke="#cec9bd"/><text x="24" y="118" font-size="21" fill="#272b2d" font-weight="500">Repair seal</text><text x="24" y="149" font-size="18" fill="#63676a" font-weight="400">No movement for 18 months</text><text x="412" y="149" font-size="18" fill="#a94f35" font-weight="400">Check critical-spare need</text><path d="M24 192H736" stroke="#cec9bd"/><text x="24" y="220" font-size="21" fill="#272b2d" font-weight="500">Old packaging</text><text x="24" y="251" font-size="18" fill="#63676a" font-weight="400">500 held; 100 expected to be used</text><text x="412" y="251" font-size="18" fill="#a94f35" font-weight="400">Review the 400-unit excess</text><path d="M24 294H736" stroke="#cec9bd"/><text x="24" y="322" font-size="21" fill="#272b2d" font-weight="500">Superseded controller</text><text x="24" y="353" font-size="18" fill="#63676a" font-weight="400">100 held; no approved internal use</text><text x="412" y="353" font-size="18" fill="#a94f35" font-weight="400">Assess resale or disposal</text></g></svg>
