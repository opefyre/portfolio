<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="r4-storage-path-title r4-storage-path-desc"><title id="r4-storage-path-title">Inventory records from raw storage to an analytical view</title><desc id="r4-storage-path-desc">Item A is two cases with ten pieces per case, producing twenty pieces. B remains five pieces. C has a blank quantity and remains unresolved. Raw storage, preparation and reporting roles are shown, not required product boundaries.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#272b2d" font-weight="500">Preserve originals; prepare the reporting view</text><text x="24" y="68" font-size="18" fill="#63676a" font-weight="400">Same inventory records, different storage roles</text><rect x="24" y="110" width="208" height="145" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="24" y="110" width="4" height="145" rx="0" fill="#4e6879"/><text x="40" y="139" font-size="19" fill="#4e6879" font-weight="500">Source-shaped records</text><text x="40" y="168" font-size="16" fill="#272b2d" font-weight="400">A: 2 cases</text><text x="40" y="192" font-size="16" fill="#272b2d" font-weight="400">B: 5 pieces</text><text x="40" y="216" font-size="16" fill="#272b2d" font-weight="400">C: quantity blank</text><rect x="278" y="110" width="208" height="145" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="278" y="110" width="4" height="145" rx="0" fill="#272b2d"/><text x="294" y="139" font-size="19" fill="#272b2d" font-weight="500">Agreed preparation</text><text x="294" y="168" font-size="16" fill="#272b2d" font-weight="400">A: 10 per case</text><text x="294" y="192" font-size="16" fill="#272b2d" font-weight="400">B: retain pieces</text><text x="294" y="216" font-size="16" fill="#272b2d" font-weight="400">C: needs evidence</text><rect x="532" y="110" width="204" height="145" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="532" y="110" width="4" height="145" rx="0" fill="#4e6879"/><text x="548" y="139" font-size="19" fill="#4e6879" font-weight="500">Analytical view</text><text x="548" y="168" font-size="16" fill="#272b2d" font-weight="400">A: 20 pieces</text><text x="548" y="192" font-size="16" fill="#272b2d" font-weight="400">B: 5 pieces</text><text x="548" y="216" font-size="16" fill="#272b2d" font-weight="400">C: unresolved</text><line x1="238" y1="180" x2="272" y2="180" stroke="#272b2d" stroke-width="2"/><path d="M 263.13005077220714 175.38220824458517 L 272 180 L 263.13005077220714 184.61779175541483" fill="none" stroke="#272b2d" stroke-width="2"/><line x1="492" y1="180" x2="526" y2="180" stroke="#272b2d" stroke-width="2"/><path d="M 517.1300507722071 175.38220824458517 L 526 180 L 517.1300507722071 184.61779175541483" fill="none" stroke="#272b2d" stroke-width="2"/><line x1="24" y1="300" x2="736" y2="300" stroke="#ccc7bd" stroke-width="2"/><text x="24" y="338" font-size="19" fill="#272b2d" font-weight="500">Storage and queries can overlap across modern products.</text><text x="24" y="375" font-size="18" fill="#a94f35" font-weight="400">The missing quantity remains unresolved in either design.</text></g></svg>
