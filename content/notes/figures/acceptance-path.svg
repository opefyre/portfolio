<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">Follow the evidence from requirements to acceptance</title><desc id="desc">Requirements feed factory and site tests. Each test retains results and unresolved items.</desc><rect width="760" height="350" fill="#eeebe4"/><g font-family="Funnel Sans,Arial,sans-serif" fill="#24282b"><text x="25" y="35" font-size="24">Agree the requirements and tests first</text><rect x="25" y="65" width="340" height="95" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="43" y="98" font-size="20">FAT at the supplier</text><text x="43" y="127" font-size="15">Agreed scope and available conditions</text><rect x="395" y="65" width="340" height="95" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="413" y="98" font-size="20">SAT after installation</text><text x="413" y="127" font-size="15">Actual connections and site conditions</text><text x="25" y="205" font-size="20">Shipment decision</text><text x="395" y="205" font-size="20">Acceptance decision</text><rect x="25" y="240" width="710" height="70" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="43" y="273" font-size="20">Keep open items visible between stages</text><text x="43" y="302" font-size="15">Owner, consequence, due date and required retest</text></g></svg>