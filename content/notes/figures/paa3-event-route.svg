<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" role="img" aria-labelledby="paa3-event-route-title paa3-event-route-desc"><title id="paa3-event-route-title">Independent consumers and an event retry</title><desc id="paa3-event-route-desc">Fictional event E1042-1 is processed by warehouse at 09:00:05 and billing at 09:05 after recovery. A coordinator still checks reservation and clearance before dispatch.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#252a2d" text-anchor="start" font-weight="500">One accepted fact, separate consumer outcomes</text><rect x="24" y="104" width="200" height="108" fill="#f5f2ea" stroke="#cec9bd"/><text x="40" y="143" font-size="22" fill="#252a2d" text-anchor="start" font-weight="500">Order service</text><text x="40" y="181" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">E1042-1 recorded</text><rect x="280" y="104" width="166" height="108" fill="#f5f2ea" stroke="#cec9bd"/><text x="363" y="146" font-size="20" fill="#252a2d" text-anchor="middle" font-weight="400">Event channel</text><text x="363" y="181" font-size="17" fill="#62676a" text-anchor="middle" font-weight="400">Same event ID</text><line x1="231" y1="159" x2="270" y2="159" stroke="#252a2d" stroke-width="2"/><path d="M 263,154 L 270,159 L 263,164" fill="none" stroke="#252a2d" stroke-width="2"/><polyline points="446,159 484,159 484,114 526,114" fill="none" stroke="#252a2d" stroke-width="2"/><polyline points="484,159 484,286 526,286" fill="none" stroke="#a94f35" stroke-width="2"/><rect x="536" y="70" width="200" height="116" fill="#f5f2ea" stroke="#cec9bd"/><text x="550" y="106" font-size="23" fill="#3c6475" text-anchor="start" font-weight="500">Warehouse</text><text x="550" y="148" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Applied at 09:00:05</text><rect x="536" y="242" width="200" height="116" fill="#f5f2ea" stroke="#cec9bd"/><text x="550" y="278" font-size="23" fill="#a94f35" text-anchor="start" font-weight="500">Billing</text><text x="550" y="320" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">Retry applied at 09:05</text><text x="24" y="419" font-size="22" fill="#252a2d" text-anchor="start" font-weight="500">Dispatch waits for reservation and account clearance.</text><text x="24" y="459" font-size="20" fill="#62676a" text-anchor="start" font-weight="400">Published does not mean every consumer finished.</text></g></svg>
