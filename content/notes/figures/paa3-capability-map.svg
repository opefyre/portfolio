<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" role="img" aria-labelledby="paa3-capability-map-title paa3-capability-map-desc"><title id="paa3-capability-map-title">A small capability map and its supporting evidence</title><desc id="paa3-capability-map-desc">Fictional four-capability customer-order view. Ten promises sampled; four documented supply and capacity checks, six unresolved. The count of apps is not a capability score.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#252a2d" text-anchor="start" font-weight="500">Map the ability before counting the applications</text><rect x="24" y="76" width="712" height="65" fill="#f5f2ea" stroke="#cec9bd"/><text x="380" y="118" font-size="26" fill="#252a2d" text-anchor="middle" font-weight="500">Customer-order service</text><line x1="107" y1="141" x2="107" y2="180" stroke="#cec9bd" stroke-width="1"/><rect x="24" y="180" width="166" height="100" fill="#f5f2ea" stroke="#cec9bd"/><text x="107" y="221" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">Order</text><text x="107" y="252" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">promising</text><line x1="289" y1="141" x2="289" y2="180" stroke="#cec9bd" stroke-width="1"/><rect x="206" y="180" width="166" height="100" fill="#f5f2ea" stroke="#cec9bd"/><text x="289" y="221" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">Inventory</text><text x="289" y="252" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">control</text><line x1="471" y1="141" x2="471" y2="180" stroke="#cec9bd" stroke-width="1"/><rect x="388" y="180" width="166" height="100" fill="#f5f2ea" stroke="#cec9bd"/><text x="471" y="221" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">Order</text><text x="471" y="252" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">fulfilment</text><line x1="653" y1="141" x2="653" y2="180" stroke="#cec9bd" stroke-width="1"/><rect x="570" y="180" width="166" height="100" fill="#f5f2ea" stroke="#cec9bd"/><text x="653" y="221" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">Returns</text><text x="653" y="252" font-size="21" fill="#252a2d" text-anchor="middle" font-weight="400">management</text><line x1="24" y1="322" x2="736" y2="322" stroke="#cec9bd" stroke-width="1"/><text x="24" y="367" font-size="24" fill="#252a2d" text-anchor="start" font-weight="500">10 promises reviewed</text><text x="24" y="408" font-size="21" fill="#3c6475" text-anchor="start" font-weight="400">4 have supply and capacity evidence</text><text x="24" y="445" font-size="21" fill="#a94f35" text-anchor="start" font-weight="400">6 remain unresolved in the review</text><text x="24" y="486" font-size="19" fill="#62676a" text-anchor="start" font-weight="400">Three dashboards do not supply the missing checks.</text></g></svg>
