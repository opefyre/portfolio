<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-labelledby="aici-drift-questions-title aici-drift-questions-desc"><title id="aici-drift-questions-title">Monitor the observations and the relationship</title><desc id="aici-drift-questions-desc">Different evidence is needed to assess changed inputs and changed input-to-outcome relationships.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Monitor the observations and the relationship</text><text x="24" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Observation</text><text x="276" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Interpretation</text><text x="522" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Next check</text><line x1="24" y1="103" x2="736" y2="103" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Input records change</text><text x="276" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Data distribution</text><text x="276" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">changed</text><text x="522" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Check definitions and</text><text x="522" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">operating mix</text><line x1="24" y1="194" x2="736" y2="194" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Prediction outputs</text><text x="24" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">change</text><text x="276" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Model behaviour</text><text x="276" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">changed</text><text x="522" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Join verified outcomes</text><line x1="24" y1="285" x2="736" y2="285" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Input/outcome relation</text><text x="24" y="339" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">changes</text><text x="276" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Possible concept drift</text><text x="522" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Evaluate the</text><text x="522" y="339" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">relationship and</text><text x="522" y="363" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">effect</text></g></svg>