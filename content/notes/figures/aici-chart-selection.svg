<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-labelledby="aici-chart-selection-title aici-chart-selection-desc"><title id="aici-chart-selection-title">Choose the observation before the chart</title><desc id="aici-chart-selection-desc">Measurements, defective units and defects imply different chart families and denominator checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Choose the observation before the chart</text><text x="24" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">What is recorded?</text><text x="276" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Next distinction</text><text x="522" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Common starting family</text><line x1="24" y1="103" x2="736" y2="103" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Measured values</text><text x="276" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Individual / small</text><text x="276" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">group / larger group</text><text x="522" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">I-MR / Xbar-R / Xbar-S</text><line x1="24" y1="194" x2="736" y2="194" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Defective units</text><text x="276" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Count / proportion</text><text x="276" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">with sample size</text><text x="522" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">np / p</text><line x1="24" y1="285" x2="736" y2="285" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Individual defects</text><text x="276" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Count / rate with</text><text x="276" y="339" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">inspection exposure</text><text x="522" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">c / u</text></g></svg>