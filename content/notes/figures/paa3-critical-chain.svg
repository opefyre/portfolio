<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 586" role="img" aria-labelledby="paa3-critical-chain-title paa3-critical-chain-desc"><title id="paa3-critical-chain-title">Dependency-only and resource-feasible schedules</title><desc id="paa3-critical-chain-desc">Dependency-only sequence finishes at six days but overlaps B and C on one specialist. Scheduling them sequentially finishes work at day eight. A separate two-day buffer protects a day-ten commitment.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="23" fill="#252a2d" text-anchor="start" font-weight="500">Resolve the specialist conflict before adding a buffer</text><text x="24" y="83" font-size="21" fill="#252a2d" text-anchor="start" font-weight="500">Dependencies only: B and C overlap</text><line x1="180" y1="101" x2="180" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="180" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">0</text><line x1="229" y1="101" x2="229" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="229" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">1</text><line x1="278" y1="101" x2="278" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="278" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">2</text><line x1="327" y1="101" x2="327" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="327" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">3</text><line x1="376" y1="101" x2="376" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="376" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">4</text><line x1="425" y1="101" x2="425" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="425" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">5</text><line x1="474" y1="101" x2="474" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="474" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">6</text><line x1="523" y1="101" x2="523" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="523" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">7</text><line x1="572" y1="101" x2="572" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="572" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">8</text><line x1="621" y1="101" x2="621" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="621" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">9</text><line x1="670" y1="101" x2="670" y2="241" stroke="#cec9bd" stroke-width="1"/><text x="670" y="264" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">10</text><text x="24" y="127" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">A: preparation</text><rect x="180" y="108" width="98" height="25" fill="#252a2d" stroke="#252a2d"/><text x="24" y="160" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">B: specialist</text><rect x="278" y="141" width="147" height="25" fill="#a94f35" stroke="#a94f35"/><text x="24" y="193" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">C: specialist</text><rect x="278" y="174" width="98" height="25" fill="#3c6475" stroke="#3c6475"/><text x="24" y="226" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">D: acceptance</text><rect x="425" y="207" width="49" height="25" fill="#252a2d" stroke="#252a2d"/><text x="24" y="318" font-size="21" fill="#252a2d" text-anchor="start" font-weight="500">One specialist: work ends day 8</text><line x1="180" y1="336" x2="180" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="180" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">0</text><line x1="229" y1="336" x2="229" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="229" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">1</text><line x1="278" y1="336" x2="278" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="278" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">2</text><line x1="327" y1="336" x2="327" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="327" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">3</text><line x1="376" y1="336" x2="376" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="376" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">4</text><line x1="425" y1="336" x2="425" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="425" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">5</text><line x1="474" y1="336" x2="474" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="474" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">6</text><line x1="523" y1="336" x2="523" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="523" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">7</text><line x1="572" y1="336" x2="572" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="572" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">8</text><line x1="621" y1="336" x2="621" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="621" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">9</text><line x1="670" y1="336" x2="670" y2="476" stroke="#cec9bd" stroke-width="1"/><text x="670" y="499" font-size="14" fill="#62676a" text-anchor="middle" font-weight="400">10</text><text x="24" y="362" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">A: preparation</text><rect x="180" y="343" width="98" height="25" fill="#252a2d" stroke="#252a2d"/><text x="24" y="395" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">B: specialist</text><rect x="278" y="376" width="147" height="25" fill="#a94f35" stroke="#a94f35"/><text x="24" y="428" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">C: specialist</text><rect x="425" y="409" width="98" height="25" fill="#3c6475" stroke="#3c6475"/><text x="24" y="461" font-size="17" fill="#252a2d" text-anchor="start" font-weight="400">D: acceptance</text><rect x="523" y="442" width="49" height="25" fill="#252a2d" stroke="#252a2d"/><rect x="572" y="442" width="98" height="25" fill="#d9c1b5" stroke="#a94f35"/><text x="621" y="521" font-size="17" fill="#a94f35" text-anchor="middle" font-weight="400">2-day buffer</text><text x="24" y="560" font-size="19" fill="#62676a" text-anchor="start" font-weight="400">Day 10 commitment. The buffer is assumed protection, not work.</text></g></svg>
