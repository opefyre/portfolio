<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 684" role="img" aria-label="Fictional sequential changeover tasks. Current 45 minutes, proposed 15. Staging: 10 to zero stopped minutes. Remove tooling: 8 to 5. Fit tooling: 12 to 5. Adjust: 10 to 2. Validate: 5 to 3. Ten minutes of staging remain external."><style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.num{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.muted{fill:#5a5d60}.rust{fill:#b4532a}</style><text x="12" y="32" font-size="28" class="num">45 stopped minutes → 15</text><text x="12" y="67" font-size="20" class="muted">Current and proposed stopped time</text><line x1="12" y1="89" x2="548" y2="89" stroke="#d6d3cb"/><rect x="278" y="104" width="14" height="14" fill="#0f1011"/><text x="300" y="117" font-size="18" class="">Current</text><rect x="401" y="104" width="14" height="14" fill="#b4532a"/><text x="423" y="117" font-size="18" class="">Proposed</text><text x="12" y="176" font-size="21" class="">Stage kit</text><rect x="230" y="158" width="200" height="17" fill="#0f1011"/><text x="440" y="173" font-size="18" class="">10 min</text><rect x="230" y="185" width="0" height="17" fill="#b4532a"/><text x="240" y="200" font-size="18" class="rust">0 min</text><text x="12" y="252" font-size="21" class="">Remove tooling</text><rect x="230" y="234" width="160" height="17" fill="#0f1011"/><text x="400" y="249" font-size="18" class="">8 min</text><rect x="230" y="261" width="100" height="17" fill="#b4532a"/><text x="340" y="276" font-size="18" class="rust">5 min</text><text x="12" y="328" font-size="21" class="">Fit tooling</text><rect x="230" y="310" width="240" height="17" fill="#0f1011"/><text x="480" y="325" font-size="18" class="">12 min</text><rect x="230" y="337" width="100" height="17" fill="#b4532a"/><text x="340" y="352" font-size="18" class="rust">5 min</text><text x="12" y="404" font-size="21" class="">Adjust settings</text><rect x="230" y="386" width="200" height="17" fill="#0f1011"/><text x="440" y="401" font-size="18" class="">10 min</text><rect x="230" y="413" width="40" height="17" fill="#b4532a"/><text x="280" y="428" font-size="18" class="rust">2 min</text><text x="12" y="480" font-size="21" class="">Restart / validate</text><rect x="230" y="462" width="100" height="17" fill="#0f1011"/><text x="340" y="477" font-size="18" class="">5 min</text><rect x="230" y="489" width="60" height="17" fill="#b4532a"/><text x="300" y="504" font-size="18" class="rust">3 min</text><line x1="12" y1="550" x2="548" y2="550" stroke="#d6d3cb"/><text x="12" y="588" font-size="24" class="num">10 minutes move before the stop.</text><text x="12" y="621" font-size="19" class="muted">Preparation still needs time, space and a person.</text><text x="12" y="658" font-size="19" class="muted">Sequential tasks. Proposed durations need a trial.</text></svg>