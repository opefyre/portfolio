<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="aici-check-sheet-title aici-check-sheet-desc"><title id="aici-check-sheet-title">Keep the event count and the unit count separate</title><desc id="aici-check-sheet-desc">Minitab teaching example: category counts 2, 1, 1 and 3 sum to seven defects on six orders.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Keep the event count and the unit count separate</text><text x="24" y="132" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Incomplete</text><rect x="180" y="110" width="270" height="32" rx="3" fill="#3c6475" stroke="#3c6475" stroke-width="1.2"/><text x="462" y="133" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">2</text><text x="24" y="192" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Damaged</text><rect x="180" y="170" width="135" height="32" rx="3" fill="#3c6475" stroke="#3c6475" stroke-width="1.2"/><text x="327" y="193" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">1</text><text x="24" y="252" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Incorrect</text><rect x="180" y="230" width="135" height="32" rx="3" fill="#3c6475" stroke="#3c6475" stroke-width="1.2"/><text x="327" y="253" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">1</text><text x="24" y="312" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">Typo</text><rect x="180" y="290" width="405" height="32" rx="3" fill="#3c6475" stroke="#3c6475" stroke-width="1.2"/><text x="597" y="313" font-size="19" fill="#252a2d" text-anchor="start" font-weight="400">3</text><text x="24" y="410" font-size="21" fill="#252a2d" text-anchor="start" font-weight="400">7 defects across 6 defective orders / 50 orders inspected</text><text x="24" y="451" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">One order is both damaged and incorrect. Count it once as a defective</text><text x="24" y="475" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">order.</text></g></svg>