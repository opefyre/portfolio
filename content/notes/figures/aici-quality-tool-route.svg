<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="aici-quality-tool-route-title aici-quality-tool-route-desc"><title id="aici-quality-tool-route-title">Connect the tools through the investigation</title><desc id="aici-quality-tool-route-desc">Collecting observations, displaying patterns and testing explanations are connected tasks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Connect the tools through the investigation</text><text x="24.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">01</text><rect x="24.0" y="103" width="221.33333333333334" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Collect</text><text x="39.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Check sheet and clear</text><text x="39.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">definitions</text><line x1="248.33333333333334" y1="185" x2="265.33333333333337" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="269.33333333333337" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">02</text><rect x="269.33333333333337" y="103" width="221.33333333333334" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="284.33333333333337" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Display</text><text x="284.33333333333337" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Distribution, time,</text><text x="284.33333333333337" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">categories or pairs</text><line x1="493.66666666666674" y1="185" x2="510.66666666666674" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="514.6666666666667" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">03</text><rect x="514.6666666666667" y="103" width="221.33333333333334" height="166" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="529.6666666666667" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Investigate</text><text x="529.6666666666667" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Possible causes and</text><text x="529.6666666666667" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">distinguishing checks</text><text x="24" y="324" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Choose a tool around the question and available records, then retain</text><text x="24" y="348" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">what the next check will need.</text></g></svg>