<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="aici-leakage-boundary-title aici-leakage-boundary-desc"><title id="aici-leakage-boundary-title">Keep future information outside the input</title><desc id="aici-leakage-boundary-desc">Later outcomes evaluate a prediction. They must not leak back into fitting or unavailable features.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Keep future information outside the input</text><rect x="24" y="120" width="211" height="170" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39" y="149" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Available before</text><text x="39" y="173" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">prediction</text><text x="39" y="196" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Input measurements</text><text x="39" y="220" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">and fitted</text><text x="39" y="244" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">transforms</text><rect x="276" y="120" width="207" height="170" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="291" y="149" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Prediction point</text><text x="291" y="196" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Model output is</text><text x="291" y="220" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">issued</text><rect x="524" y="120" width="212" height="170" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="539" y="149" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Later finding</text><text x="539" y="196" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Inspection or repair</text><text x="539" y="220" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">outcome</text><line x1="238" y1="203" x2="270" y2="203" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="486" y1="203" x2="518" y2="203" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="626" y1="310" x2="130" y2="310" stroke="#a35334" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><line x1="248" y1="301" x2="266" y2="319" stroke="#a35334" stroke-width="1.5"/><line x1="248" y1="319" x2="266" y2="301" stroke="#a35334" stroke-width="1.5"/><text x="378" y="350" font-size="18" fill="#252a2d" text-anchor="middle" font-weight="400">Blocked input path: the later finding was not yet available.</text><text x="378" y="380" font-size="18" fill="#252a2d" text-anchor="middle" font-weight="400">Use that finding to evaluate the issued prediction.</text></g></svg>