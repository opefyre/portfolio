<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 370" role="img" aria-label="Five failure modes ranked by RPN. Transit damage scores 192, wrong item picked 150, late dispatch 96 and missing batch code 80. The allergen mix-up has severity 10 but the lowest RPN, 40.">
<text x="0" y="18" font-size="17" fill="#5a5d60">RPN = S × O × D</text>
<text x="480" y="18" font-size="17" fill="#5a5d60" text-anchor="end">S = severity</text>
<text x="0" y="53" font-size="19" fill="#0f1011" font-weight="400">Damaged in transit</text>
<rect x="0" y="63" width="420.00" height="20" rx="3" fill="#6f7f8c"/>
<text x="428.00" y="79" font-size="19" fill="#0f1011" font-weight="600">192</text>
<text x="480" y="53" font-size="19" fill="#0f1011" text-anchor="end" font-weight="600">S 6</text>
<text x="0" y="115" font-size="19" fill="#0f1011" font-weight="400">Wrong item picked</text>
<rect x="0" y="125" width="328.12" height="20" rx="3" fill="#6f7f8c"/>
<text x="336.12" y="141" font-size="19" fill="#0f1011" font-weight="600">150</text>
<text x="480" y="115" font-size="19" fill="#0f1011" text-anchor="end" font-weight="600">S 5</text>
<text x="0" y="177" font-size="19" fill="#0f1011" font-weight="400">Late dispatch</text>
<rect x="0" y="187" width="210.00" height="20" rx="3" fill="#6f7f8c"/>
<text x="218.00" y="203" font-size="19" fill="#0f1011" font-weight="600">96</text>
<text x="480" y="177" font-size="19" fill="#0f1011" text-anchor="end" font-weight="600">S 4</text>
<text x="0" y="239" font-size="19" fill="#0f1011" font-weight="400">Label missing batch code</text>
<rect x="0" y="249" width="175.00" height="20" rx="3" fill="#6f7f8c"/>
<text x="183.00" y="265" font-size="19" fill="#0f1011" font-weight="600">80</text>
<text x="480" y="239" font-size="19" fill="#0f1011" text-anchor="end" font-weight="600">S 8</text>
<text x="0" y="301" font-size="19" fill="#b4532a" font-weight="600">Allergen pack in wrong carton</text>
<rect x="0" y="311" width="87.50" height="20" rx="3" fill="#b4532a"/>
<text x="95.50" y="327" font-size="19" fill="#0f1011" font-weight="600">40</text>
<text x="480" y="301" font-size="19" fill="#b4532a" text-anchor="end" font-weight="600">S 10</text>
</svg>
