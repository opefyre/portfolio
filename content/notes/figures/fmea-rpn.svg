<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="Five failure modes ranked by RPN. Wrong item picked scores highest at 150, while the allergen mix-up, severity 10, scores only 40 and ranks last, even though it is the only one that could hurt a customer.">
<text x="250" y="18" font-size="13" fill="#5a5d60">RPN = Severity × Occurrence × Detection</text>
<text x="680" y="18" font-size="13" fill="#5a5d60" text-anchor="end">Severity</text>
<text x="0" y="59" font-size="14" fill="#0f1011" font-weight="400">Wrong item picked</text>
<rect x="250" y="44" width="328.1" height="22" rx="3" fill="#6f7f8c"/>
<text x="586.1" y="60" font-size="13" fill="#0f1011" font-weight="600">150</text>
<text x="680" y="60" font-size="14" fill="#0f1011" text-anchor="end" font-weight="600">5</text>
<text x="0" y="103" font-size="14" fill="#0f1011" font-weight="400">Damaged in transit</text>
<rect x="250" y="88" width="315.0" height="22" rx="3" fill="#6f7f8c"/>
<text x="573.0" y="104" font-size="13" fill="#0f1011" font-weight="600">144</text>
<text x="680" y="104" font-size="14" fill="#0f1011" text-anchor="end" font-weight="600">6</text>
<text x="0" y="147" font-size="14" fill="#0f1011" font-weight="400">Late dispatch</text>
<rect x="250" y="132" width="210.0" height="22" rx="3" fill="#6f7f8c"/>
<text x="468.0" y="148" font-size="13" fill="#0f1011" font-weight="600">96</text>
<text x="680" y="148" font-size="14" fill="#0f1011" text-anchor="end" font-weight="600">4</text>
<text x="0" y="191" font-size="14" fill="#0f1011" font-weight="400">Label missing batch code</text>
<rect x="250" y="176" width="105.0" height="22" rx="3" fill="#6f7f8c"/>
<text x="363.0" y="192" font-size="13" fill="#0f1011" font-weight="600">48</text>
<text x="680" y="192" font-size="14" fill="#0f1011" text-anchor="end" font-weight="600">8</text>
<text x="0" y="235" font-size="14" fill="#b4532a" font-weight="600">Allergen pack in wrong carton</text>
<rect x="250" y="220" width="87.5" height="22" rx="3" fill="#b4532a"/>
<text x="345.5" y="236" font-size="13" fill="#0f1011" font-weight="600">40</text>
<text x="680" y="236" font-size="14" fill="#b4532a" text-anchor="end" font-weight="600">10</text>
</svg>