<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="An autonomy ladder for AI in operations: Read, then Recommend, then Orchestrate, then Act, each step allowed only as consequence falls and reversibility rises.">
<text x="760" y="20" font-size="14" fill="#5a5d60" text-anchor="end">More autonomy only where errors are small, reversible and caught fast</text>
<rect x="0" y="210" width="182" height="90" rx="4" fill="#dcd6c9"/>
<text x="14" y="236" font-size="17" font-weight="600" fill="#0f1011">1 · Read</text>
<text x="14" y="258" font-size="13" fill="#3f4244">Observe systems and</text>
<text x="14" y="276" font-size="13" fill="#3f4244">assemble evidence</text>
<rect x="192" y="160" width="182" height="140" rx="4" fill="#b8b1a2"/>
<text x="206" y="186" font-size="17" font-weight="600" fill="#0f1011">2 · Recommend</text>
<text x="206" y="208" font-size="13" fill="#26282a">Rank options;</text>
<text x="206" y="226" font-size="13" fill="#26282a">a person decides</text>
<rect x="384" y="110" width="182" height="190" rx="4" fill="#5d5a52"/>
<text x="398" y="136" font-size="17" font-weight="600" fill="#eeebe4">3 · Orchestrate</text>
<text x="398" y="158" font-size="13" fill="#e3dfd5">Run workflows people</text>
<text x="398" y="176" font-size="13" fill="#e3dfd5">have already approved</text>
<rect x="576" y="60" width="184" height="240" rx="4" fill="#0f1011"/>
<text x="590" y="86" font-size="17" font-weight="600" fill="#eeebe4">4 · Act</text>
<text x="590" y="108" font-size="13" fill="#d6d2c8">Execute only inside</text>
<text x="590" y="126" font-size="13" fill="#d6d2c8">explicit, reversible limits</text>
</svg>
