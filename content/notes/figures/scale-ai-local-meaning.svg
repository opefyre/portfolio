<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img" aria-labelledby="scale-title scale-desc">
<title id="scale-title">What STOP means at each plant</title><desc id="scale-desc">Fictional records for a breakdown and a planned changeover. Plant A records them as STOP and CHANGEOVER. Plant B records both as STOP. Split B's stop records by event before comparing breakdowns. Rows illustrate classification, not event frequency or duration.</desc>
<g font-family="inherit" fill="#0f1011">
<text x="0" y="30" font-size="27" font-weight="500">What does STOP include?</text>
<text x="0" y="62" font-size="17" fill="#62676a">Two events, recorded differently</text>
<path d="M0 84H480" stroke="#cbc8bf"/>
<text x="0" y="117" font-size="14" letter-spacing="1">WHAT HAPPENED</text>
<rect x="0" y="137" width="226" height="51" rx="3" fill="#101213"/>
<text x="113" y="169" text-anchor="middle" font-size="20" fill="#eeebe4">Breakdown</text>
<rect x="238" y="137" width="242" height="51" rx="3" fill="#b4532a"/>
<text x="359" y="169" text-anchor="middle" font-size="20" fill="#eeebe4">Planned changeover</text>
<path d="M113 197V216m-5-6 5 6 5-6M359 197V216m-5-6 5 6 5-6" fill="none" stroke="#767b7f"/>
<text x="0" y="247" font-size="14" letter-spacing="1">PLANT A RECORDS</text>
<rect x="0" y="263" width="226" height="49" rx="3" fill="none" stroke="#101213"/>
<text x="113" y="294" text-anchor="middle" font-size="21">STOP</text>
<rect x="238" y="263" width="242" height="49" rx="3" fill="none" stroke="#b4532a"/>
<text x="359" y="294" text-anchor="middle" font-size="19" fill="#b4532a">CHANGEOVER</text>
<text x="0" y="354" font-size="14" letter-spacing="1">PLANT B RECORDS</text>
<rect x="0" y="370" width="480" height="49" rx="3" fill="#dedbd3"/>
<text x="113" y="401" text-anchor="middle" font-size="21">STOP</text>
<text x="359" y="401" text-anchor="middle" font-size="21">STOP</text>
<path d="M232 380V409" stroke="#aaa79c"/>
<text x="0" y="457" font-size="17" fill="#62676a">B's STOP records need separating before analysis.</text>
</g></svg>
