<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="r4-incoterms-risk-title r4-incoterms-risk-desc"><title id="r4-incoterms-risk-title">CIF carriage cost and cargo risk</title><desc id="r4-incoterms-risk-desc">The seller arranges freight and the required insurance to the named destination port. Risk transfers when the goods are on board at the shipment port. The figure is schematic, with no geographic or time scale.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#272b2d" font-weight="500">CIF: freight and risk follow different spans</text><text x="24" y="68" font-size="18" fill="#63676a" font-weight="400">Sea or inland waterway transport, Incoterms 2020</text><rect x="24" y="104" width="212" height="112" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="24" y="104" width="4" height="112" rx="0" fill="#a94f35"/><text x="40" y="133" font-size="19" fill="#a94f35" font-weight="500">Shipment port</text><text x="40" y="162" font-size="16" fill="#272b2d" font-weight="400">Goods placed on board</text><text x="40" y="186" font-size="16" fill="#272b2d" font-weight="400">Risk passes here</text><rect x="286" y="104" width="212" height="112" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="286" y="104" width="4" height="112" rx="0" fill="#4e6879"/><text x="302" y="133" font-size="19" fill="#4e6879" font-weight="500">Carriage</text><text x="302" y="162" font-size="16" fill="#272b2d" font-weight="400">Seller arranges freight</text><text x="302" y="186" font-size="16" fill="#272b2d" font-weight="400">Buyer bears carriage risk</text><rect x="548" y="104" width="212" height="112" rx="4" fill="#f8f6f0" stroke="#ccc7bd"/><rect x="548" y="104" width="4" height="112" rx="0" fill="#4e6879"/><text x="564" y="133" font-size="19" fill="#4e6879" font-weight="500">Destination port</text><text x="564" y="162" font-size="16" fill="#272b2d" font-weight="400">Named in the term</text><text x="564" y="186" font-size="16" fill="#272b2d" font-weight="400">Not the risk-transfer point</text><line x1="240" y1="156" x2="280" y2="156" stroke="#272b2d" stroke-width="2"/><path d="M 271.13005077220714 151.38220824458517 L 280 156 L 271.13005077220714 160.61779175541483" fill="none" stroke="#272b2d" stroke-width="2"/><line x1="502" y1="156" x2="542" y2="156" stroke="#272b2d" stroke-width="2"/><path d="M 533.1300507722071 151.38220824458517 L 542 156 L 533.1300507722071 160.61779175541483" fill="none" stroke="#272b2d" stroke-width="2"/><text x="24" y="266" font-size="18" fill="#4e6879" font-weight="500">Seller-arranged freight</text><line x1="24" y1="288" x2="736" y2="288" stroke="#4e6879" stroke-width="2"/><path d="M 727.1300507722071 283.3822082445852 L 736 288 L 727.1300507722071 292.6177917554148" fill="none" stroke="#4e6879" stroke-width="2"/><text x="24" y="337" font-size="18" fill="#a94f35" font-weight="500">Buyer risk from on-board delivery</text><line x1="24" y1="359" x2="736" y2="359" stroke="#a94f35" stroke-width="2"/><path d="M 727.1300507722071 354.3822082445852 L 736 359 L 727.1300507722071 363.6177917554148" fill="none" stroke="#a94f35" stroke-width="2"/><text x="24" y="406" font-size="18" fill="#63676a" font-weight="400">Seller also arranges the agreed CIF insurance cover.</text></g></svg>
