<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="r4-p2p-records-title r4-p2p-records-desc"><title id="r4-p2p-records-title">Procure-to-pay record chain</title><desc id="r4-p2p-records-desc">The chain connects internal approval, supplier order, receipt, invoice check and approved payment. Only receipt R-082 supplies numerical evidence: ten boxes of twelve cartridges, or 120 cartridges. No payment has been assumed.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="26" fill="#272b2d" font-weight="500">Each event leaves a different record</text><text x="24" y="68" font-size="18" fill="#63676a" font-weight="400">Follow the request through to an approved payment</text><text x="30" y="127" font-size="19" fill="#a94f35" font-weight="500">01</text><text x="90" y="119" font-size="20" fill="#272b2d" font-weight="500">Request and approval</text><text x="90" y="147" font-size="17" fill="#63676a" font-weight="400">Internal permission to buy</text><line x1="46" y1="141" x2="46" y2="170" stroke="#a94f35" stroke-width="2"/><path d="M 50.61779175541483 161.13005077220717 L 46 170 L 41.38220824458517 161.13005077220717" fill="none" stroke="#a94f35" stroke-width="2"/><line x1="90" y1="164" x2="736" y2="164" stroke="#ccc7bd" stroke-width="2"/><text x="30" y="207" font-size="19" fill="#a94f35" font-weight="500">02</text><text x="90" y="199" font-size="20" fill="#272b2d" font-weight="500">Purchase order</text><text x="90" y="227" font-size="17" fill="#63676a" font-weight="400">Supplier, item, quantity and terms</text><line x1="46" y1="221" x2="46" y2="250" stroke="#a94f35" stroke-width="2"/><path d="M 50.61779175541483 241.13005077220717 L 46 250 L 41.38220824458517 241.13005077220717" fill="none" stroke="#a94f35" stroke-width="2"/><line x1="90" y1="244" x2="736" y2="244" stroke="#ccc7bd" stroke-width="2"/><text x="30" y="287" font-size="19" fill="#a94f35" font-weight="500">03</text><text x="90" y="279" font-size="20" fill="#272b2d" font-weight="500">Receipt R-082</text><text x="90" y="307" font-size="17" fill="#63676a" font-weight="400">10 BOX × 12 = 120 cartridges</text><line x1="46" y1="301" x2="46" y2="330" stroke="#a94f35" stroke-width="2"/><path d="M 50.61779175541483 321.13005077220714 L 46 330 L 41.38220824458517 321.13005077220714" fill="none" stroke="#a94f35" stroke-width="2"/><line x1="90" y1="324" x2="736" y2="324" stroke="#ccc7bd" stroke-width="2"/><text x="30" y="367" font-size="19" fill="#a94f35" font-weight="500">04</text><text x="90" y="359" font-size="20" fill="#272b2d" font-weight="500">Invoice check</text><text x="90" y="387" font-size="17" fill="#63676a" font-weight="400">Compare order, receipt and invoice</text><line x1="46" y1="381" x2="46" y2="410" stroke="#a94f35" stroke-width="2"/><path d="M 50.61779175541483 401.13005077220714 L 46 410 L 41.38220824458517 401.13005077220714" fill="none" stroke="#a94f35" stroke-width="2"/><line x1="90" y1="404" x2="736" y2="404" stroke="#ccc7bd" stroke-width="2"/><text x="30" y="447" font-size="19" fill="#a94f35" font-weight="500">05</text><text x="90" y="439" font-size="20" fill="#272b2d" font-weight="500">Payment and reconciliation</text><text x="90" y="467" font-size="17" fill="#63676a" font-weight="400">Only after the required approvals</text><line x1="90" y1="484" x2="736" y2="484" stroke="#ccc7bd" stroke-width="2"/><text x="24" y="530" font-size="17" fill="#63676a" font-weight="400">The receipt has quantities. No invoice price or payment result is assumed.</text></g></svg>
