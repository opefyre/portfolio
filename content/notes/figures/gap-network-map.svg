<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="gap-network-map-title gap-network-map-desc" font-family="var(--font-funnel-display), Arial, sans-serif"><title id="gap-network-map-title">Same demand, different footprint</title><desc id="gap-network-map-desc">Both networks serve 12,000 western and 8,000 eastern annual orders. The regional option costs 66,000 euros more and provides the assumed one-day service.</desc><text x="20" y="38" font-size="27" fill="#24282b" text-anchor="start">Same demand, different footprint</text><line x1="20" y1="61" x2="740" y2="61" stroke="#bab8af" stroke-width="2"/><text x="26" y="103" font-size="24" fill="#24282b" text-anchor="start">One central facility</text><text x="412" y="103" font-size="24" fill="#24282b" text-anchor="start">Two regional facilities</text><line x1="380" y1="90" x2="380" y2="379" stroke="#bab8af" stroke-width="2"/><rect x="111" y="140" width="118" height="54" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="170" y="173" font-size="20" fill="#24282b" text-anchor="middle">Central</text><rect x="34" y="273" width="118" height="54" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="93" y="306" font-size="20" fill="#24282b" text-anchor="middle">West</text><rect x="207" y="273" width="118" height="54" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="266" y="306" font-size="20" fill="#24282b" text-anchor="middle">East</text><rect x="419" y="140" width="118" height="54" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="478" y="173" font-size="20" fill="#24282b" text-anchor="middle">West DC</text><rect x="604" y="140" width="118" height="54" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="663" y="173" font-size="20" fill="#24282b" text-anchor="middle">East DC</text><rect x="419" y="273" width="118" height="54" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="478" y="306" font-size="20" fill="#24282b" text-anchor="middle">West</text><rect x="604" y="273" width="118" height="54" rx="4" fill="#eeebe4" stroke="#bab8af"/><text x="663" y="306" font-size="20" fill="#24282b" text-anchor="middle">East</text><line x1="170" y1="194" x2="93" y2="272" stroke="#496778" stroke-width="2"/><line x1="170" y1="194" x2="266" y2="272" stroke="#496778" stroke-width="2"/><line x1="478" y1="194" x2="478" y2="272" stroke="#496778" stroke-width="2"/><line x1="663" y1="194" x2="663" y2="272" stroke="#496778" stroke-width="2"/><text x="93" y="352" font-size="18" fill="#62676a" text-anchor="middle">12,000 orders</text><text x="266" y="352" font-size="18" fill="#62676a" text-anchor="middle">8,000 orders</text><text x="478" y="352" font-size="18" fill="#62676a" text-anchor="middle">12,000 orders</text><text x="663" y="352" font-size="18" fill="#62676a" text-anchor="middle">8,000 orders</text><text x="170" y="407" font-size="21" fill="#24282b" text-anchor="middle">€460,000/year; 2 days</text><text x="567" y="407" font-size="21" fill="#24282b" text-anchor="middle">€526,000/year; 1 day</text></svg>
