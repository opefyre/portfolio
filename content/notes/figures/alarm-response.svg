<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Connect a signal to an operator response</title><desc id="desc">The team defines the condition, consequence, operator action and response time before creating an alarm.</desc><rect width="760" height="340" fill="#eeebe4"/><g font-family="Funnel Sans,Arial,sans-serif" fill="#24282b"><text x="25" y="35" font-size="24">Before a signal becomes an alarm</text><rect x="25" y="65" width="345" height="85" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="43" y="98" font-size="20">Define the condition</text><text x="43" y="127" font-size="15">What has changed?</text><rect x="390" y="65" width="345" height="85" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="408" y="98" font-size="20">Record the consequence</text><text x="408" y="127" font-size="15">What happens without a response?</text><rect x="25" y="175" width="345" height="85" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="43" y="208" font-size="20">Specify the action</text><text x="43" y="237" font-size="15">What should the operator do?</text><rect x="390" y="175" width="345" height="85" rx="8" fill="#e2dfd6" stroke="#b6b0a4"/><text x="408" y="208" font-size="20">Check the available time</text><text x="408" y="237" font-size="15">Can the operator act in time?</text><text x="25" y="310" font-size="18">Log the response and check that the condition is resolved</text></g></svg>