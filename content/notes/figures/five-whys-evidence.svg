<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 790" role="img" aria-label="Fictional cause investigation. Unsupported retraining is replaced by observation of missed detection, measurement of guide movement, inspection of its locating arrangement, and two proposed actions: retain position and test retention."><style>text{font-family:var(--font-funnel-sans),Arial,sans-serif;fill:#0f1011}.plot-number{font-family:var(--font-funnel-display),Arial,sans-serif;font-weight:500}.plot-muted{fill:#5a5d60}.plot-rust{fill:#b4532a}</style><text x="12" y="31" font-size="25" class="plot-number">From explanation to a testable change</text><line x1="12" y1="53" x2="548" y2="53" stroke="#d6d3cb" stroke-width="1"/><text x="12" y="86" font-size="17" class="plot-muted">FIRST EXPLANATION</text><text x="12" y="116" font-size="21" >Incorrect setup → retrain the operator</text><text x="12" y="145" font-size="19" class="plot-muted">No observed link to the recurring stops.</text><line x1="12" y1="166" x2="548" y2="166" stroke="#d6d3cb" stroke-width="1"/><text x="12" y="205" font-size="17" class="plot-muted">OBSERVE</text><text x="12" y="235" font-size="23" class="plot-number">Cartons pass outside the beam.</text><text x="12" y="265" font-size="19" class="plot-muted">The log and the trial point to the same event.</text><line x1="27" y1="279" x2="27" y2="300" stroke="#0f1011" stroke-width="1.5"/><text x="12" y="320" font-size="17" class="plot-muted">MEASURE</text><text x="12" y="350" font-size="23" class="plot-number">The side guide moves after setup.</text><text x="12" y="380" font-size="19" class="plot-muted">Compare its position before and after running.</text><line x1="27" y1="394" x2="27" y2="415" stroke="#0f1011" stroke-width="1.5"/><text x="12" y="435" font-size="17" class="plot-muted">INSPECT</text><text x="12" y="465" font-size="23" class="plot-number">The position has no locating stop.</text><text x="12" y="495" font-size="19" class="plot-muted">The mark and clamp do not retain the position.</text><line x1="12" y1="526" x2="548" y2="526" stroke="#d6d3cb" stroke-width="1"/><text x="12" y="562" font-size="17" class="plot-rust">TWO ACTIONS FOLLOW</text><text x="12" y="599" font-size="24" class="plot-number">Hold the guide in position.</text><text x="12" y="629" font-size="20" class="plot-muted">Validate a positive locating stop.</text><text x="12" y="674" font-size="24" class="plot-number">Check that the position holds.</text><text x="12" y="704" font-size="20" class="plot-muted">Update the setup acceptance check.</text><line x1="12" y1="730" x2="548" y2="730" stroke="#d6d3cb" stroke-width="1"/><text x="12" y="761" font-size="20" >Test both under comparable running conditions.</text></svg>