<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="paa-maturity-evidence-title paa-maturity-evidence-desc"><title id="paa-maturity-evidence-title">An overall count can hide a blocking gap</title><desc id="paa-maturity-evidence-desc">Author-defined fictional checklist: seven checks passed, three open, including both data checks. No official EDIH score or maturity level is calculated.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5a5d60"/></marker></defs><text x="24" y="30" font-size="14" fill="#5a5d60" text-anchor="start">WAREHOUSE EVIDENCE CHECKLIST V1</text><text x="24" y="91" font-size="34" fill="#101213" text-anchor="start">7 of 10 checks passed</text><text x="24" y="127" font-size="18" fill="#5a5d60" text-anchor="start">This is checklist completion, not a maturity score.</text><rect x="24" y="165" width="59" height="38" fill="#101213"/><rect x="95" y="165" width="59" height="38" fill="#101213"/><rect x="166" y="165" width="59" height="38" fill="#101213"/><rect x="237" y="165" width="59" height="38" fill="#101213"/><rect x="308" y="165" width="59" height="38" fill="#101213"/><rect x="379" y="165" width="59" height="38" fill="#101213"/><rect x="450" y="165" width="59" height="38" fill="#101213"/><rect x="521" y="165" width="59" height="38" fill="#b4532a"/><rect x="592" y="165" width="59" height="38" fill="#b4532a"/><rect x="663" y="165" width="59" height="38" fill="#b4532a"/><text x="24" y="237" font-size="16" fill="#101213" text-anchor="start">Passed</text><text x="522" y="237" font-size="16" fill="#b4532a" text-anchor="start">Open</text><line x1="24" y1="269" x2="736" y2="269" stroke="#c7c2b8" stroke-width="2"/><text x="24" y="311" font-size="24" fill="#b4532a" text-anchor="start">Data: 0 of 2 checks passed</text><text x="24" y="350" font-size="18" fill="#101213" text-anchor="start">Item identity and event completeness still block trust in the alert.</text><text x="24" y="390" font-size="17" fill="#5a5d60" text-anchor="start">Other passed checks cannot cancel this dependency.</text></svg>
