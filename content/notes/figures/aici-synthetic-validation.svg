<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="aici-synthetic-validation-title aici-synthetic-validation-desc"><title id="aici-synthetic-validation-title">Keep generated training and real tests distinct</title><desc id="aici-synthetic-validation-desc">NVIDIA can-detection tutorial workflow; independent real evaluation has a separate role.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Keep generated training and real tests distinct</text><rect x="24" y="112" width="210" height="175" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39" y="141" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Generated training</text><text x="39" y="188" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Scene variations and</text><text x="39" y="212" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">known synthetic</text><text x="39" y="236" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">labels</text><rect x="276" y="112" width="208" height="175" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="291" y="141" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Development</text><text x="291" y="188" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Fit, inspect and</text><text x="291" y="212" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">revise</text><rect x="526" y="112" width="210" height="175" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="541" y="141" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Real evaluation</text><text x="541" y="188" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Independent captured</text><text x="541" y="212" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">observations</text><line x1="237" y1="196" x2="270" y2="196" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="488" y1="196" x2="520" y2="196" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="506" y1="90" x2="506" y2="311" stroke="#a35334" stroke-width="1.5" stroke-dasharray="6 5"/><text x="24" y="354" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Using evaluation failures to revise the generator makes them part of</text><text x="24" y="378" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">development. Retain a separate final evaluation.</text></g></svg>