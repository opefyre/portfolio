<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" role="img" aria-labelledby="paa2-rolling-wave-title paa2-rolling-wave-desc"><title id="paa2-rolling-wave-title">Rolling-wave plan changes</title><desc id="paa2-rolling-wave-desc">Initial sequential ten-day packages finish day30. On day8, detailing site2 reveals 12 days, shifting site3 to days23 through32. Site3 remains a planning package.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Add detail, then show its effect on the date</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional sequential site work. One critical team, no overlap.</text><text x="24" y="102" font-size="20" fill="#272b2d" font-weight="500">Initial plan</text><rect x="54" y="120" width="196" height="44" rx="3" fill="#272b2d" stroke="#272b2d"/><text x="64" y="148" font-size="18" fill="#fff" font-weight="400">Site 1</text><rect x="254" y="120" width="196" height="44" rx="3" fill="none" stroke="#63676a" stroke-dasharray="5 4"/><text x="264" y="148" font-size="18" fill="#63676a" font-weight="400">Site 2</text><rect x="454" y="120" width="196" height="44" rx="3" fill="none" stroke="#63676a" stroke-dasharray="5 4"/><text x="464" y="148" font-size="18" fill="#63676a" font-weight="400">Site 3</text><text x="54" y="195" font-size="17" fill="#63676a" font-weight="400">0</text><text x="254" y="195" font-size="17" fill="#63676a" font-weight="400">10</text><text x="454" y="195" font-size="17" fill="#63676a" font-weight="400">20</text><text x="654" y="195" font-size="17" fill="#63676a" font-weight="400">30</text><text x="24" y="242" font-size="20" fill="#272b2d" font-weight="500">Day 8 review</text><rect x="54" y="260" width="196" height="44" rx="3" fill="#272b2d" stroke="#272b2d"/><text x="64" y="288" font-size="18" fill="#fff" font-weight="400">Site 1</text><rect x="254" y="260" width="236" height="44" rx="3" fill="#a94f35" stroke="#a94f35"/><text x="264" y="288" font-size="18" fill="#fff" font-weight="400">Site 2</text><rect x="494" y="260" width="196" height="44" rx="3" fill="none" stroke="#63676a" stroke-dasharray="5 4"/><text x="504" y="288" font-size="18" fill="#63676a" font-weight="400">Site 3</text><text x="54" y="335" font-size="17" fill="#63676a" font-weight="400">0</text><text x="254" y="335" font-size="17" fill="#63676a" font-weight="400">10</text><text x="494" y="335" font-size="17" fill="#63676a" font-weight="400">22</text><text x="694" y="335" font-size="17" fill="#63676a" font-weight="400">32</text><text x="24" y="396" font-size="18" fill="#272b2d" font-weight="400">Solid: detailed work. Dashed: work package awaiting detail.</text><text x="24" y="429" font-size="18" fill="#a94f35" font-weight="400">Site 2 adds two working days. Forecast finish moves from 30 to 32.</text></g></svg>
