<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="aici-yokoten-transfer-title aici-yokoten-transfer-desc"><title id="aici-yokoten-transfer-title">Transfer the method and check the receiving work</title><desc id="aici-yokoten-transfer-desc">Original problem, operating conditions and evidence support a local adaptation and verification.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Transfer the method and check the receiving work</text><text x="24.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">01</text><rect x="24.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Original work</text><text x="39.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Problem,</text><text x="39.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">mechanism and</text><text x="39.0" y="227" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">evidence</text><line x1="187.0" y1="185" x2="204.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="208.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">02</text><rect x="208.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="223.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Conditions</text><text x="223.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Skills, limits</text><text x="223.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">and response</text><line x1="371.0" y1="185" x2="388.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="392.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">03</text><rect x="392.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="407.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Local</text><text x="407.0" y="156" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">adaptation</text><text x="407.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Differences at</text><text x="407.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">the receiving</text><text x="407.0" y="227" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">site</text><line x1="555.0" y1="185" x2="572.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="576.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">04</text><rect x="576.0" y="103" width="160.0" height="166" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="591.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Verification</text><text x="591.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Test, record</text><text x="591.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">and</text><text x="591.0" y="227" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">standardise</text><text x="24" y="324" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">For the washer-presence case, transfer the hold rule, responder and</text><text x="24" y="348" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">restart check along with the signal.</text></g></svg>