<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 485" role="img" aria-labelledby="aici-subgroups-title aici-subgroups-desc"><title id="aici-subgroups-title">Keep the source of each observation visible</title><desc id="aici-subgroups-desc">The existing five-pack-per-head protocol retains head identity. The identified packs remain grouped by head.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Keep the source of each observation visible</text><text x="24" y="140" font-size="22" fill="#252a2d" text-anchor="start" font-weight="400">Head 4</text><circle cx="203" cy="132" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="203" y="138" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">1</text><circle cx="293" cy="132" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="293" y="138" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">2</text><circle cx="383" cy="132" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="383" y="138" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">3</text><circle cx="473" cy="132" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="473" y="138" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">4</text><circle cx="563" cy="132" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="563" y="138" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">5</text><text x="204" y="183" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Five identified packs collected under the defined condition</text><text x="24" y="252" font-size="22" fill="#252a2d" text-anchor="start" font-weight="400">Head 9</text><circle cx="203" cy="244" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="203" y="250" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">1</text><circle cx="293" cy="244" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="293" y="250" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">2</text><circle cx="383" cy="244" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="383" y="250" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">3</text><circle cx="473" cy="244" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="473" y="250" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">4</text><circle cx="563" cy="244" r="23" fill="#eeeae1" stroke="#3c6475" stroke-width="2"/><text x="563" y="250" font-size="17" fill="#252a2d" text-anchor="middle" font-weight="400">5</text><text x="204" y="295" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Five identified packs collected under the defined condition</text><text x="24" y="400" font-size="19" fill="#62676a" text-anchor="start" font-weight="400">Excerpt from the 12-head teaching protocol. The numbers identify</text><text x="24" y="424" font-size="19" fill="#62676a" text-anchor="start" font-weight="400">samples within each head.</text></g></svg>