<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="r4-work-observations-title r4-work-observations-desc"><title id="r4-work-observations-title">Two different observation designs</title><desc id="r4-work-observations-desc">Ten timed dispatch jobs in minutes: 8,9,9,10,10,10,10,11,11,12. Mean ten minutes. Separately, the NPTEL work-sampling illustration has 365 working and 135 other observations out of 500, giving 73 and 27 percent. No combined inference is made.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Job duration and activity share use different units</text><text x="24" y="83" font-size="21" fill="#4e6879" font-weight="500">Timed dispatch jobs</text><text x="24" y="111" font-size="17" fill="#63676a" font-weight="400">10 separate fictional jobs; minutes per job</text><rect x="30" y="205" width="42" height="80" rx="3" fill="#4e6879"/><text x="51" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">8</text><rect x="100" y="195" width="42" height="90" rx="3" fill="#4e6879"/><text x="121" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">9</text><rect x="170" y="195" width="42" height="90" rx="3" fill="#4e6879"/><text x="191" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">9</text><rect x="240" y="185" width="42" height="100" rx="3" fill="#4e6879"/><text x="261" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">10</text><rect x="310" y="185" width="42" height="100" rx="3" fill="#4e6879"/><text x="331" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">10</text><rect x="380" y="185" width="42" height="100" rx="3" fill="#4e6879"/><text x="401" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">10</text><rect x="450" y="185" width="42" height="100" rx="3" fill="#4e6879"/><text x="471" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">10</text><rect x="520" y="175" width="42" height="110" rx="3" fill="#4e6879"/><text x="541" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">11</text><rect x="590" y="175" width="42" height="110" rx="3" fill="#4e6879"/><text x="611" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">11</text><rect x="660" y="165" width="42" height="120" rx="3" fill="#4e6879"/><text x="681" y="308" font-size="17" fill="#272b2d" font-weight="400" text-anchor="middle">12</text><text x="24" y="350" font-size="20" fill="#4e6879" font-weight="500">100 minutes ÷ 10 jobs = 10 minutes per job</text><line x1="24" y1="378" x2="736" y2="378" stroke="#ccc7bd" stroke-width="2"/><text x="24" y="421" font-size="21" fill="#a94f35" font-weight="500">Random snapshots from a different teaching case</text><rect x="24" y="458" width="519.76" height="34" rx="3" fill="#4e6879"/><rect x="543.76" y="458" width="192.24" height="34" rx="3" fill="#a94f35"/><text x="24" y="528" font-size="18" fill="#4e6879" font-weight="500">365 working / 500 = 73%</text><text x="440" y="528" font-size="18" fill="#a94f35" font-weight="500">135 other / 500 = 27%</text><text x="24" y="574" font-size="17" fill="#63676a" font-weight="400">NPTEL illustration. These snapshots are not the dispatch jobs above.</text></g></svg>
