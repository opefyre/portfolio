<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" role="img" aria-labelledby="paa2-time-classification-title paa2-time-classification-desc"><title id="paa2-time-classification-title">Two different time measures</title><desc id="paa2-time-classification-desc">Forty active minutes over 4840 lead-time minutes gives an activity ratio of 0.83 percent. Value-added minutes have not been classified, so PCE is unknown.</desc><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="24" fill="#272b2d" font-weight="500">Active time is not automatically value-added</text><text x="24" y="66" font-size="17" fill="#63676a" font-weight="400">Fictional current state. Boxes are not drawn to duration.</text><rect x="24" y="100" width="226" height="126" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="40" y="132" font-size="17" fill="#63676a" font-weight="400">Waiting</text><text x="40" y="180" font-size="25" fill="#63676a" font-weight="500">4,800 min</text><rect x="266" y="100" width="226" height="126" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="282" y="132" font-size="17" fill="#272b2d" font-weight="400">Active work</text><text x="282" y="180" font-size="25" fill="#272b2d" font-weight="500">40 min</text><rect x="508" y="100" width="228" height="126" rx="3" fill="#f4f1e9" stroke="#cec9bd"/><text x="524" y="132" font-size="17" fill="#a94f35" font-weight="400">Value-added work</text><text x="524" y="180" font-size="25" fill="#a94f35" font-weight="500">Not classified</text><text x="24" y="274" font-size="22" fill="#272b2d" font-weight="500">Activity ratio = 40 ÷ 4,840 = 0.83%</text><text x="24" y="312" font-size="19" fill="#a94f35" font-weight="400">PCE needs a separate value-added assessment.</text></g></svg>
