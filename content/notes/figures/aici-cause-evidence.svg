<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-labelledby="aici-cause-evidence-title aici-cause-evidence-desc"><title id="aici-cause-evidence-title">Identify the claim before choosing the action</title><desc id="aici-cause-evidence-desc">Association, a causal model and intervention evidence are distinct forms of support.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Identify the claim before choosing the action</text><text x="24" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Evidence</text><text x="276" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Claim</text><text x="522" y="82" font-size="16" fill="#62676a" text-anchor="start" font-weight="400">Review</text><line x1="24" y1="103" x2="736" y2="103" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Predictive association</text><text x="276" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Variable helps predict</text><text x="276" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">outcome</text><text x="522" y="133" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Check timing and</text><text x="522" y="157" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">alternative</text><text x="522" y="181" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">explanations</text><line x1="24" y1="194" x2="736" y2="194" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Causal model</text><text x="276" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Effect under stated</text><text x="276" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">assumptions</text><text x="522" y="224" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Check identification</text><text x="522" y="248" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">and process knowledge</text><line x1="24" y1="285" x2="736" y2="285" stroke="#cbc6ba" stroke-width="1.5"/><text x="24" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Process intervention</text><text x="276" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Observed response to a</text><text x="276" y="339" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">planned change</text><text x="522" y="315" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">Check design and</text><text x="522" y="339" font-size="18" fill="#252a2d" text-anchor="start" font-weight="400">operating conditions</text></g></svg>