<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="aici-suggestion-response-title aici-suggestion-response-desc"><title id="aici-suggestion-response-title">Make the response route part of the system</title><desc id="aici-suggestion-response-desc">An idea moves to ownership, trial or decision and a response, with learning returning to the employee.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676a"/></marker></defs><g font-family="Funnel Sans, sans-serif"><text x="24" y="36" font-size="25" fill="#252a2d" text-anchor="start" font-weight="500">Make the response route part of the system</text><text x="24.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">01</text><rect x="24.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="39.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Record</text><text x="39.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Problem and</text><text x="39.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">person raising</text><text x="39.0" y="227" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">it</text><line x1="187.0" y1="185" x2="204.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="208.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">02</text><rect x="208.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="223.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Assign</text><text x="223.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Owner and next</text><text x="223.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">review</text><line x1="371.0" y1="185" x2="388.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="392.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">03</text><rect x="392.0" y="103" width="160.0" height="166" rx="3" fill="#f6f3eb" stroke="#cbc6ba" stroke-width="1.2"/><text x="407.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Test or</text><text x="407.0" y="156" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">decide</text><text x="407.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Evidence and</text><text x="407.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">requirements</text><line x1="555.0" y1="185" x2="572.0" y2="185" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="576.0" y="88" font-size="15" fill="#a35334" text-anchor="start" font-weight="400">04</text><rect x="576.0" y="103" width="160.0" height="166" rx="3" fill="#e8e0d3" stroke="#a35334" stroke-width="1.2"/><text x="591.0" y="132" font-size="20" fill="#252a2d" text-anchor="start" font-weight="400">Reply</text><text x="591.0" y="179" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">Outcome and</text><text x="591.0" y="203" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">next</text><text x="591.0" y="227" font-size="17" fill="#62676a" text-anchor="start" font-weight="400">responsibility</text><line x1="700" y1="270" x2="700" y2="317" stroke="#cbc6ba" stroke-width="1.5"/><line x1="700" y1="317" x2="65" y2="317" stroke="#cbc6ba" stroke-width="1.5"/><line x1="65" y1="317" x2="65" y2="277" stroke="#62676a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="365" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">Return the response even when the proposal is declined. Retain the</text><text x="24" y="389" font-size="18" fill="#62676a" text-anchor="start" font-weight="400">reason and the next action.</text></g></svg>